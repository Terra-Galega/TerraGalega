<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title
      th:text="${isNew} ? 'Nuevo cliente · Terra Galega' : 'Editar cliente · Terra Galega'"
    >
      Cliente · Terra Galega
    </title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --terra: #b2571f;
        --burgundy: #8a2222;
        --cream: #f5f2eb;
      }
      body {
        background-color: var(--cream);
      }
      .navbar-terra {
        background-color: #2c2c2c;
      }
      .navbar-terra .navbar-brand {
        color: var(--cream) !important;
        font-weight: 600;
        letter-spacing: 0.05em;
      }
      .btn-terra {
        background-color: var(--terra);
        border-color: var(--terra);
        color: #fff;
      }
      .btn-terra:hover {
        background-color: var(--burgundy);
        border-color: var(--burgundy);
        color: #fff;
      }
      .card-header-terra {
        background-color: var(--terra);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-terra navbar-expand-lg" data-bs-theme="dark">
      <div class="container">
        <a class="navbar-brand" th:href="@{/home}">Terra Galega · Admin</a>
        <div class="d-flex gap-2">
          <a class="btn btn-outline-light btn-sm" th:href="@{/admin}"
            >Comidas</a
          >
          <a class="btn btn-outline-light btn-sm active" th:href="@{/clients}"
            >Clientes</a
          >
          <a class="btn btn-outline-light btn-sm" th:href="@{/home}"
            >Volver al sitio</a
          >
        </div>
      </div>
    </nav>

    <div class="container py-5" style="max-width: 640px">
      <div class="card shadow-sm border-0">
        <div
          class="card-header card-header-terra"
          th:text="${isNew} ? 'Nuevo cliente' : 'Editar cliente'"
        ></div>
        <div class="card-body">
          <form
            th:action="${isNew} ? @{/clients} : @{/clients/{id}(id=${client.id})}"
            th:object="${client}"
            method="post"
          >
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Nombre</label>
                <input
                  type="text"
                  class="form-control"
                  th:field="*{name}"
                  required
                />
              </div>
              <div class="col-md-6">
                <label class="form-label">Apellido</label>
                <input
                  type="text"
                  class="form-control"
                  th:field="*{lastName}"
                  required
                />
              </div>
              <div class="col-md-6">
                <label class="form-label">Correo electrónico</label>
                <input
                  type="email"
                  class="form-control"
                  th:field="*{email}"
                  required
                />
              </div>
              <div class="col-md-6">
                <label class="form-label">Contraseña</label>
                <input
                  type="text"
                  class="form-control"
                  th:field="*{password}"
                  required
                />
              </div>
              <div class="col-md-6">
                <label class="form-label">Teléfono</label>
                <input type="tel" class="form-control" th:field="*{phone}" />
              </div>
              <div class="col-md-6">
                <label class="form-label">Dirección</label>
                <input type="text" class="form-control" th:field="*{address}" />
              </div>
              <div class="col-12 form-check ms-1" th:unless="${isNew}">
                <input
                  type="checkbox"
                  class="form-check-input"
                  id="active"
                  th:field="*{active}"
                />
                <label class="form-check-label" for="active"
                  >Cliente activo</label
                >
              </div>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-4">
              <a class="btn btn-outline-secondary" th:href="@{/clients}"
                >Cancelar</a
              >
              <button
                type="submit"
                class="btn btn-terra"
                th:text="${isNew} ? 'Crear cliente' : 'Guardar cambios'"
              ></button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
