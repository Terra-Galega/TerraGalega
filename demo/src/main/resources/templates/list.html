<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clientes · Terra Galega</title>
    <!-- Esta sección de administración usa Bootstrap 5 (a diferencia del resto del sitio, que usa Tailwind) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --terra: #b2571f;
        --burgundy: #8a2222;
        --cream: #f5f2eb;
      }
      body {
        background-color: var(--cream);
      }
      .navbar-terra {
        background-color: #2c2c2c;
      }
      .navbar-terra .navbar-brand {
        color: var(--cream) !important;
        font-weight: 600;
        letter-spacing: 0.05em;
      }
      .btn-terra {
        background-color: var(--terra);
        border-color: var(--terra);
        color: #fff;
      }
      .btn-terra:hover {
        background-color: var(--burgundy);
        border-color: var(--burgundy);
        color: #fff;
      }
      .card-header-terra {
        background-color: var(--terra);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-terra navbar-expand-lg" data-bs-theme="dark">
      <div class="container">
        <a class="navbar-brand" th:href="@{/home}">Terra Galega · Admin</a>
        <div class="d-flex gap-2">
          <a class="btn btn-outline-light btn-sm" th:href="@{/admin}"
            >Comidas</a
          >
          <a class="btn btn-outline-light btn-sm active" th:href="@{/clients}"
            >Clientes</a
          >
          <a class="btn btn-outline-light btn-sm" th:href="@{/home}"
            >Volver al sitio</a
          >
        </div>
      </div>
    </nav>

    <div class="container py-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">Clientes</h1>
        <a class="btn btn-terra" th:href="@{/clients/new}">+ Nuevo cliente</a>
      </div>

      <div class="card shadow-sm border-0">
        <div class="card-header card-header-terra">
          Listado de clientes registrados
        </div>
        <div class="table-responsive">
          <table class="table table-striped table-hover align-middle mb-0">
            <thead class="table-dark">
              <tr>
                <th>#</th>
                <th>Nombre</th>
                <th>Email</th>
                <th>Teléfono</th>
                <th>Dirección</th>
                <th>Estado</th>
                <th class="text-end">Acciones</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="client : ${clients}">
                <td th:text="${client.id}"></td>
                <td th:text="${client.name + ' ' + client.lastName}"></td>
                <td th:text="${client.email}"></td>
                <td th:text="${client.phone}"></td>
                <td th:text="${client.address}"></td>
                <td>
                  <span th:if="${client.active}" class="badge bg-success"
                    >Activo</span
                  >
                  <span th:unless="${client.active}" class="badge bg-secondary"
                    >Inactivo</span
                  >
                </td>
                <td class="text-end">
                  <a
                    class="btn btn-sm btn-outline-secondary"
                    th:href="@{/clients/{id}(id=${client.id})}"
                    >Ver</a
                  >
                  <a
                    class="btn btn-sm btn-outline-primary"
                    th:href="@{/clients/{id}/edit(id=${client.id})}"
                    >Editar</a
                  >
                  <form
                    th:action="@{/clients/{id}/delete(id=${client.id})}"
                    method="post"
                    class="d-inline"
                    onsubmit="return confirm('¿Eliminar este cliente?');"
                  >
                    <button type="submit" class="btn btn-sm btn-outline-danger">
                      Eliminar
                    </button>
                  </form>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(clients)}">
                <td colspan="7" class="text-center text-muted py-4">
                  No hay clientes registrados.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </body>
</html>
