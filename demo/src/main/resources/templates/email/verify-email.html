<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Confirma tu cuenta en Terra Galega</title>
</head>
<body>
<!-- Correo de confirmación de cuenta. Variables: name (nombre del cliente) y link (enlace al front).
     Los estilos van en línea porque los clientes de correo ignoran las hojas de estilo externas. -->
<div style="font-family:Arial,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#2b2b2b">
    <h2 style="margin:0 0 16px">¡Bienvenido a Terra Galega, <span th:text="${name}">Juan</span>!</h2>

    <p>Para activar tu cuenta, confirma tu correo electrónico:</p>

    <p style="margin:28px 0">
        <a th:href="${link}" href="#"
           style="background:#8a1c1c;color:#ffffff;padding:12px 24px;border-radius:6px;text-decoration:none;display:inline-block">
            Confirmar mi cuenta
        </a>
    </p>

    <p style="font-size:13px;color:#666">
        Si el botón no funciona, copia este enlace en tu navegador:<br>
        <span th:text="${link}">http://localhost:4200/verify-email?token=...</span>
    </p>

    <p style="font-size:13px;color:#666">
        El enlace vence en 24 horas. Si no creaste esta cuenta, ignora este mensaje.
    </p>
</div>
</body>
</html>
