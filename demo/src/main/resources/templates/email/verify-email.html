<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Confirma tu cuenta en Terra Galega</title>
  </head>
  <body
    style="font-family: Arial, sans-serif; background: #f5f3ef; padding: 24px"
  >
    <div
      style="
        max-width: 520px;
        margin: auto;
        background: white;
        padding: 32px;
        border-radius: 12px;
        color: #2b2b2b;
      "
    >
      <h2 style="color: #314b36">Bienvenido a Terra Galega</h2>

      <p>Hola, <strong th:text="${name}">cliente</strong>.</p>
      <p>Confirma tu correo electrónico para activar tu cuenta:</p>

      <p style="margin: 28px 0">
        <a
          th:href="${link}"
          style="
            display: inline-block;
            background: #314b36;
            color: white;
            padding: 14px 24px;
            border-radius: 8px;
            text-decoration: none;
          "
        >
          Confirmar mi cuenta
        </a>
      </p>

      <p>Si el botón no funciona, abre este enlace:</p>
      <p style="word-break: break-all">
        <a th:href="${link}" th:text="${link}">Enlace</a>
      </p>

      <p>El enlace vence en 24 horas.</p>
      <p>Si no creaste esta cuenta, ignora este correo.</p>
    </div>
  </body>
</html>
