<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Fuentes de la marca (Playfair Display y Source Sans 3). Las cargan Apple Mail, iOS, Outlook para Mac
         y similares; Gmail las ignora y usa la siguiente de la lista (Georgia / Arial). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&amp;family=Source+Sans+3:wght@400;600;700&amp;display=swap" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&display=swap");
    </style>
    <title>Informe</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #e9e4d8">
    <!-- Texto de vista previa (lo que se ve junto al asunto en la bandeja) -->
    <div style="display: none; max-height: 0; overflow: hidden; opacity: 0; color: #e9e4d8">
      Informe de ventas de Terra Galega.
    </div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #e9e4d8">
      <tr>
        <td align="center" style="padding: 28px 12px">
          <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"
            style="width: 100%; max-width: 600px; background-color: #ffffff; border-radius: 18px; overflow: hidden; box-shadow: 0 8px 28px rgba(31, 51, 38, 0.18)">
            <!-- Cabecera con el logo -->
            <tr>
              <td style="background-color: #314b36; line-height: 0; font-size: 0">
                <img th:src="${baseUrl} + '/images/email-logo.png'" src="/images/email-logo.png" alt="Terra Galega"
                  width="600" style="display: block; width: 100%; max-width: 600px; height: auto; border: 0" />
              </td>
            </tr>
            <!-- Franja de color -->
            <tr>
              <td style="background-color: #b2571f; height: 6px; line-height: 6px; font-size: 6px">&nbsp;</td>
            </tr>
            <!-- Contenido -->
            <tr>
              <td style="padding: 36px 40px 12px; font-family: 'Source Sans 3', Arial, Helvetica, sans-serif; font-size: 16px; line-height: 1.6; color: #2c2c2c">
<h1 style="margin: 0 0 18px; font-family: 'Playfair Display', Georgia, 'Times New Roman', serif; font-size: 28px; line-height: 1.25; color: #314b36">Informe de ventas</h1>
                <p style="margin: 0 0 18px">Adjuntamos el archivo solicitado desde el panel de administración:</p>
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin: 0 0 24px">
                  <tr>
                    <td style="background-color: #f5f2eb; border-left: 4px solid #b2571f; border-radius: 6px; padding: 14px 20px; font-size: 15px; color: #314b36">
                      <strong th:text="${filename}">informe.pdf</strong>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <!-- Pie -->
            <tr>
              <td style="background-color: #1f3326; padding: 26px 40px; text-align: center; font-family: 'Source Sans 3', Arial, Helvetica, sans-serif">
                <p style="margin: 0 0 6px; font-family: 'Playfair Display', Georgia, 'Times New Roman', serif; font-size: 18px; color: #f5f2eb; letter-spacing: 1px">
                  Terra Galega
                </p>
                <p style="margin: 0; font-size: 12px; line-height: 1.6; color: #b9c4b3">
                  Cocina gallega en Bogotá, Colombia - desde 2018
                </p>
                <p style="margin: 14px 0 0; font-size: 11px; line-height: 1.5; color: #8fa08a">
                  Informe generado desde el panel de administración de Terra Galega.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
