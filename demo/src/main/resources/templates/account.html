<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi cuenta · Terra Galega</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @theme {
        --color-terra: #b2571f;
        --color-gold: #d99a21;
        --color-burgundy: #8a2222;
        --color-cream: #f5f2eb;
        --color-forest: #556141;
        --color-charcoal: #2c2c2c;
        --font-sans: "Source Sans 3", ui-sans-serif, system-ui, sans-serif;
        --font-serif: "Playfair Display", ui-serif, Georgia, serif;
      }
    </style>
  <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>

<body class="min-h-screen bg-cream font-sans text-charcoal">
  <header th:replace="~{fragments :: navbar(false)}"></header>

  <!-- Modal de carrito -->
  <div th:replace="~{fragments :: modal-cart}"></div>


  <main class="min-h-screen flex items-center justify-center px-6 py-32">
    <div class="w-full max-w-md mx-auto glass-card rounded-3xl p-8">
      <p class="text-[12px] tracking-widest uppercase mb-2" style="color: rgba(44, 44, 44, 0.38)">
        Sesión iniciada
      </p>
      <h1 class="font-serif text-3xl font-semibold mb-6" th:text="${client.name + ' ' + client.lastName}"></h1>

      <div class="space-y-3 text-sm mb-8" style="color: rgba(44, 44, 44, 0.7)">
        <p>
          <span class="font-semibold text-charcoal">Correo:</span>
          <span th:text="${client.email}"></span>
        </p>
        <p>
          <span class="font-semibold text-charcoal">Teléfono:</span>
          <span th:text="${client.phone}"></span>
        </p>
        <p>
          <span class="font-semibold text-charcoal">Dirección de entrega:</span>
          <span th:text="${client.address}"></span>
        </p>
      </div>

      <div class="flex flex-col gap-3">
        <a th:href="@{/menu}" class="w-full text-center py-3 text-white font-medium rounded-xl btn-terra" style="
                background: linear-gradient(135deg, #b2571f 0%, #8a2222 100%);
                box-shadow: 0 4px 20px rgba(178, 87, 31, 0.3);
              ">Ver la carta</a>

        <a th:href="@{/clients/{id}/edit(id=${client.id})}"
    class="w-full text-center py-3 rounded-xl font-medium border border-charcoal/15 hover:bg-charcoal/5 transition-colors">
    Editar perfil
  </a>

  <form th:action="@{/logout}" method="post">
    <button type="submit"
      class="w-full py-3 rounded-xl font-medium border border-charcoal/15 hover:bg-charcoal/5 transition-colors">
      Cerrar sesión
    </button>
  </form>

  <form th:action="@{/clients/{id}/delete(id=${client.id})}" method="post"
    onsubmit="return confirm('¿Seguro que querés eliminar tu cuenta? Esta acción no se puede deshacer.');">
    <button type="submit"
      class="w-full py-3 rounded-xl font-medium transition-all duration-300 border border-burgundy/30 text-burgundy hover:bg-burgundy hover:text-white shadow-sm">
      Eliminar mi cuenta
    </button>
  </form>
</div>
    </div>
  </main>



  <footer th:replace=" ~{fragments :: footer}"></footer>
            <script th:src="@{/js/script.js}"></script>
</body>

</html>
