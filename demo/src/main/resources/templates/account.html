<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi cuenta · Terra Galega</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --color-terra: #b2571f;
        --color-gold: #d99a21;
        --color-burgundy: #8a2222;
        --color-cream: #f5f2eb;
        --color-forest: #556141;
        --color-charcoal: #2c2c2c;
        --font-sans: "Source Sans 3", ui-sans-serif, system-ui, sans-serif;
        --font-serif: "Playfair Display", ui-serif, Georgia, serif;
      }
    </style>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
  </head>
  <body class="min-h-screen bg-cream font-sans text-charcoal">
    <header th:replace="~{fragments :: navbar(false)}"></header>

    <main class="min-h-screen flex items-center justify-center px-6 py-32">
      <div class="w-full max-w-md mx-auto glass-card rounded-3xl p-8">
        <p
          class="text-[12px] tracking-widest uppercase mb-2"
          style="color: rgba(44, 44, 44, 0.38)"
        >
          Sesión iniciada
        </p>
        <h1
          class="font-serif text-3xl font-semibold mb-6"
          th:text="${client.name + ' ' + client.lastName}"
        ></h1>

        <div
          class="space-y-3 text-sm mb-8"
          style="color: rgba(44, 44, 44, 0.7)"
        >
          <p>
            <span class="font-semibold text-charcoal">Correo:</span>
            <span th:text="${client.email}"></span>
          </p>
          <p>
            <span class="font-semibold text-charcoal">Teléfono:</span>
            <span th:text="${client.phone}"></span>
          </p>
          <p>
            <span class="font-semibold text-charcoal"
              >Dirección de entrega:</span
            >
            <span th:text="${client.address}"></span>
          </p>
        </div>

        <div class="flex flex-col gap-3">
          <a th:href="@{/menu}" class="w-full text-center py-3 text-white font-medium rounded btn-terra">Ver la carta</a>

          <a th:href="@{/clients/me/edit}" class="w-full text-center py-3 rounded font-medium border border-charcoal/15 hover:bg-charcoal/5 transition-colors">Editar perfil</a>

          <form th:action="@{/logout}" method="post">
            <button type="submit" class="w-full py-3 rounded font-medium border border-charcoal/15 hover:bg-charcoal/5 transition-colors">
              Cerrar sesión
            </button>
          </form>

          <form th:action="@{/clients/me/delete}" method="post" onsubmit="return confirm('¿Seguro que querés eliminar tu cuenta? Esta acción no se puede deshacer.');">
            <button type="submit" class="w-full py-3 rounded font-medium text-sm" style="color: #8a2222; border: 1px solid rgba(138, 34, 34, 0.3)">
              Eliminar mi cuenta
            </button>
          </form>
        </div>
      </div>
    </main>

    <!--Modal de carrito -->
    <div
      id="modal-cart"
      class="hidden-modal fixed inset-0 z-50 flex items-end md:items-center justify-center"
      style="background-color: rgba(44, 44, 44, 0.65)"
    >
      <div
        class="bg-cream w-full md:max-w-lg shadow-2xl flex flex-col"
        style="max-height: 82vh; border-radius: 2px 2px 0 0"
      >
        <div
          class="p-6 border-b flex items-center justify-between"
          style="border-color: rgba(44, 44, 44, 0.1)"
        >
          <h2 class="font-serif text-2xl font-semibold text-charcoal">
            Mi Carrito
          </h2>
          <button data-close="cart" style="color: rgba(23, 227, 47, 0.35)">
            <svg
              class="w-5 h-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>

        <div class="flex-1 overflow-y-auto p-6">
          <div
            id="cart-empty"
            class="text-center py-14"
            style="color: rgba(44, 44, 44, 0.35)"
          >
            <svg
              class="w-12 h-12 mx-auto mb-4 opacity-40"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.5"
                d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"
              />
            </svg>
            <p class="text-sm">Tu carrito está vacío</p>
            <button
              id="cart-explore-menu"
              class="mt-4 text-sm underline underline-offset-2"
              style="color: #b2571f"
            >
              Explorar el menú
            </button>
          </div>
          <div id="cart-items" class="space-y-3"></div>
        </div>

        <div
          id="cart-footer"
          class="hidden-modal p-6 border-t"
          style="border-color: rgba(44, 44, 44, 0.1)"
        >
          <div class="flex justify-between items-center mb-4">
            <span class="font-medium text-charcoal">Total del pedido</span>
            <span
              id="cart-total"
              class="font-bold text-xl"
              style="color: #b2571f"
            ></span>
          </div>
          <button
            id="cart-checkout"
            th:attr="data-href=@{/login}"
            class="w-full py-3 text-white font-medium rounded btn-terra"
          >
            Confirmar pedido
          </button>
          <p
            class="text-center text-xs mt-3"
            style="color: rgba(44, 44, 44, 0.4)"
          >
            Pago contra entrega o con datafono en tu domicilio
          </p>
        </div>
      </div>
    </div>

    <footer th:replace="~{fragments :: footer}"></footer>
    <script th:src="@{/js/script.js}"></script>
  </body>
</html>
