<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pagar pedido · Terra Galega</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/assets/logo-cropped.svg}">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @theme {
      --color-terra: #b2571f;
      --color-gold: #d99a21;
      --color-burgundy: #8a2222;
      --color-cream: #f5f2eb;
      --color-forest: #556141;
      --color-charcoal: #2c2c2c;
      --font-sans: "Source Sans 3", ui-sans-serif, system-ui, sans-serif;
      --font-serif: "Playfair Display", ui-serif, Georgia, serif;
    }
  </style>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>

<body class="min-h-screen bg-cream font-sans text-charcoal">
    <header th:replace="~{fragments :: navbar(false)}"></header>

    <main class="min-h-screen pt-32 pb-28 max-w-5xl mx-auto px-6 md:px-8">

        <div class="mb-12">
            <p class="text-[12px] font-medium tracking-[0.3em] uppercase mb-2" style="color: #b2571f">
                Pasarela de pago simulada
            </p>
            <h1 class="font-serif text-4xl md:text-5xl font-bold text-charcoal">Confirma y paga</h1>
            <p class="mt-3 text-[15px]" style="color: rgba(44, 44, 44, 0.7)"
                th:text="'Hola ' + ${client.name} + ', estás a un paso de tu pedido.'"></p>
        </div>

        <!-- Caso: llegaron aquí con el carrito vacío (p. ej. entrando directo por URL) -->
        <div id="checkout-empty" class="hidden-modal glass-card rounded-3xl py-20 text-center">
            <p class="text-lg mb-2 text-charcoal">Tu carrito está vacío.</p>
            <p class="text-[15px] mb-7" style="color: rgba(44, 44, 44, 0.65)">
                Agrega algo de la carta antes de pagar.
            </p>
            <a th:href="@{/menu}" class="text-[15px] font-medium underline underline-offset-4" style="color: #b2571f">
                Explorar la carta
            </a>
        </div>

        <div id="checkout-content" class="grid grid-cols-1 md:grid-cols-5 gap-8">

            <!-- Resumen del pedido -->
            <div class="md:col-span-2">
                <div class="glass-card rounded-3xl p-6">
                    <h2 class="font-serif text-xl font-semibold text-charcoal mb-4">Tu pedido</h2>
                    <div id="checkout-items" class="space-y-4 mb-5"></div>
                    <div class="pt-4 border-t flex items-center justify-between"
                        style="border-color: rgba(44,44,44,0.1)">
                        <span class="font-medium text-charcoal">Total</span>
                        <span id="checkout-total" class="font-bold text-2xl" style="color: #b2571f"></span>
                    </div>
                </div>

                <div class="glass-card rounded-3xl p-6 mt-6">
                    <label for="checkout-address" class="block text-[11px] font-medium uppercase tracking-wider mb-1.5"
                        style="color: rgba(44,44,44,0.4)">
                        Dirección de entrega
                    </label>
                    <input type="text" id="checkout-address" placeholder="Ejm: Calle 123 #45-67, apto 8"
                        class="input-field w-full px-4 py-3 rounded-xl text-charcoal text-sm" maxlength="120" />
                    <p id="checkout-address-error" class="hidden-modal text-xs mt-2" style="color: #8a2222">
                        Escribe la dirección donde quieres recibir tu pedido.
                    </p>
                </div>

                <button type="button" onclick="
        document.getElementById('checkout-address').value = 'Calle 123 #45-67, apto 8';
        document.getElementById('card-name').value = 'Juan García';
        document.getElementById('card-number').value = '4111 1111 1111 11F11';
        document.getElementById('card-expiry').value = '12/28';
        document.getElementById('card-cvv').value = '123';
    " class="mt-4 w-full py-2 rounded-xl text-[12px] font-medium uppercase tracking-wider transition-all duration-300"
                    style="color: #b2571f; border: 1px solid #b2571f; background-color: transparent;">
                    Autocompletar datos de prueba
                </button>
            </div>

            <!-- Formulario de pago simulado -->
            <div class="md:col-span-3">
                <div class="glass-card rounded-3xl p-7">
                    <h2 class="font-serif text-xl font-semibold text-charcoal mb-1">Datos de pago</h2>
                    <p class="text-[15px] mb-6" style="color: rgba(44,44,44,0.65)">
                        Ingresa los datos de tu tarjeta de crédito/débito para finalizar el pago.
                    </p>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-[11px] font-medium uppercase tracking-wider mb-1.5"
                                style="color: rgba(44,44,44,0.4)">
                                Nombre en la tarjeta
                            </label>
                            <input type="text" id="card-name" placeholder="Juan García"
                                class="input-field w-full px-4 py-3 rounded-xl text-charcoal text-sm" />
                        </div>
                        <div>
                            <label class="block text-[11px] font-medium uppercase tracking-wider mb-1.5"
                                style="color: rgba(44,44,44,0.4)">
                                Número de tarjeta
                            </label>
                            <input type="text" id="card-number" placeholder="4111 1111 1111 1111" inputmode="numeric"
                                maxlength="19" class="input-field w-full px-4 py-3 rounded-xl text-charcoal text-sm" />
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-[11px] font-medium uppercase tracking-wider mb-1.5"
                                    style="color: rgba(44,44,44,0.4)">
                                    Vencimiento
                                </label>
                                <input type="text" id="card-expiry" placeholder="MM/AA" maxlength="5"
                                    class="input-field w-full px-4 py-3 rounded-xl text-charcoal text-sm" />
                            </div>
                            <div>
                                <label class="block text-[11px] font-medium uppercase tracking-wider mb-1.5"
                                    style="color: rgba(44,44,44,0.4)">
                                    CVV
                                </label>
                                <input type="text" id="card-cvv" placeholder="123" inputmode="numeric" maxlength="3"
                                    class="input-field w-full px-4 py-3 rounded-xl text-charcoal text-sm" />
                            </div>
                        </div>
                    </div>

                    <p id="checkout-error" class="hidden-modal text-xs mt-4" style="color: #8a2222"></p>

                    <button id="checkout-pay-btn" type="button"
                        class="w-full py-4 rounded-2xl font-medium text-white mt-6 transition-all duration-300"
                        style="background: linear-gradient(135deg, #b2571f 0%, #8a2222 100%); box-shadow: 0 4px 20px rgba(178,87,31,0.3)">
                        Pagar
                    </button>
                    <button id="cancel-checkout-btn" type="button" class="w-full py-3 rounded-2xl font-medium mt-3
           text-charcoal border border-charcoal/10
           transition-all duration-300
           hover:bg-[#8a2222] hover:text-white hover:border-[#8a2222]
           hover:shadow-md hover:-translate-y-0.5">
                        Cancelar compra
                    </button>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments :: modal-cart}"></div>
    <footer th:replace="~{fragments :: footer}"></footer>

    <script th:src="@{/js/script.js}"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            checkoutPage();
        });
    </script>

</body>

</html>
