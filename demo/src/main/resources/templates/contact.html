<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contacto · Terra Galega</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @theme {
        --color-terra: #b2571f;
        --color-gold: #d99a21;
        --color-burgundy: #8a2222;
        --color-cream: #f5f2eb;
        --color-forest: #556141;
        --color-charcoal: #2c2c2c;
        --font-sans: "Source Sans 3", ui-sans-serif, system-ui, sans-serif;
        --font-serif: "Playfair Display", ui-serif, Georgia, serif;
      }
    </style>
  <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>

<body class="min-h-screen bg-cream font-sans text-charcoal">
  <!--header con la barra de navegación -->
  <header th:replace="~{fragments :: navbar(false)}"></header>
  <!-- Contenido principal de la página -->
  <main class="min-h-screen pt-32 pb-28 max-w-6xl mx-auto px-6">
    <div class="text-center mb-16">
      <p class="text-[12px] font-medium tracking-[0.3em] uppercase mb-3" style="color: #b2571f">
        Encuéntranos
      </p>
      <h1 class="font-serif text-4xl md:text-5xl font-bold text-charcoal">
        Visítanos en Bogotá
      </h1>
      <div class="w-10 h-0.5 mx-auto mt-5" style="background-color: #d99a21"></div>
    </div>

    <div class="grid md:grid-cols-2 gap-10 items-start">
      <!-- Tarjetas con información de contacto -->
      <div class="space-y-5">
        <div class="glass-card rounded-2xl p-6 flex items-start gap-5">
          <div class="w-11 h-11 rounded-xl flex items-center justify-center flex-shrink-0"
            style="background-color: rgba(178, 87, 31, 0.1); color: #b2571f">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M17.657 16.657 13.414 20.9a1.998 1.998 0 0 1-2.827 0l-4.244-4.243a8 8 0 1 1 11.314 0Z" />
              <circle cx="12" cy="11" r="3" />
            </svg>
          </div>
          <div>
            <p class="text-[11px] font-medium uppercase tracking-widest mb-1" style="color: rgba(44, 44, 44, 0.38)">
              Dirección
            </p>
            <p class="text-sm font-medium text-charcoal leading-snug">
              Calle 93 #15-47, Zona Rosa, Bogotá
            </p>
          </div>
        </div>
        <div class="glass-card rounded-2xl p-6 flex items-start gap-5">
          <div class="w-11 h-11 rounded-xl flex items-center justify-center flex-shrink-0"
            style="background-color: rgba(178, 87, 31, 0.1); color: #b2571f">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path
                d="M3 5a2 2 0 0 1 2-2h3.28a1 1 0 0 1 .948.684l1.498 4.493a1 1 0 0 1-.502 1.21l-2.257 1.13a11.042 11.042 0 0 0 5.516 5.516l1.13-2.257a1 1 0 0 1 1.21-.502l4.493 1.498a1 1 0 0 1 .684.949V19a2 2 0 0 1-2 2h-1C9.716 21 3 14.284 3 6V5Z" />
            </svg>
          </div>
          <div>
            <p class="text-[11px] font-medium uppercase tracking-widest mb-1" style="color: rgba(44, 44, 44, 0.38)">
              Teléfono
            </p>
            <p class="text-sm font-medium text-charcoal leading-snug">
              +57 601 456 7890
            </p>
          </div>
        </div>
        <div class="glass-card rounded-2xl p-6 flex items-start gap-5">
          <div class="w-11 h-11 rounded-xl flex items-center justify-center flex-shrink-0"
            style="background-color: rgba(178, 87, 31, 0.1); color: #b2571f">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="3" y="5" width="18" height="14" rx="2" />
              <path d="m3 7 9 6 9-6" />
            </svg>
          </div>
          <div>
            <p class="text-[11px] font-medium uppercase tracking-widest mb-1" style="color: rgba(44, 44, 44, 0.38)">
              Correo
            </p>
            <p class="text-sm font-medium text-charcoal leading-snug">
              contacto@terragalega.co
            </p>
          </div>
        </div>
        <div class="glass-card rounded-2xl p-6 flex items-start gap-5">
          <div class="w-11 h-11 rounded-xl flex items-center justify-center flex-shrink-0"
            style="background-color: rgba(178, 87, 31, 0.1); color: #b2571f">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <circle cx="12" cy="12" r="10" />
              <path d="M12 6v6l4 2" />
            </svg>
          </div>
          <div>
            <p class="text-[11px] font-medium uppercase tracking-widest mb-1" style="color: rgba(44, 44, 44, 0.38)">
              Horario
            </p>
            <p class="text-sm font-medium text-charcoal leading-snug">
              Lun – Sáb: 12:00 – 22:00 · Dom: 12:00 – 20:00
            </p>
          </div>
        </div>
      </div>

      <!-- Formulario de contacto (validación y envío simulado en el cliente, igual que login/registro) -->
      <div class="glass-card rounded-3xl p-8">
        <h2 class="font-serif text-xl font-semibold text-charcoal mb-6">
          Envíanos un mensaje
        </h2>
        <form id="contact-form" class="space-y-4">
          <div>
            <label class="block text-[11px] font-medium uppercase tracking-wider mb-1.5"
              style="color: rgba(44, 44, 44, 0.4)">Nombre</label>
            <input type="text" id="contact-name" placeholder="Tu nombre"
              class="input-field w-full px-4 py-3 text-charcoal text-sm rounded-xl" />
          </div>
          <div>
            <label class="block text-[11px] font-medium uppercase tracking-wider mb-1.5"
              style="color: rgba(44, 44, 44, 0.4)">Correo</label>
            <input type="email" id="contact-email" placeholder="correo@ejemplo.com"
              class="input-field w-full px-4 py-3 text-charcoal text-sm rounded-xl" />
          </div>
          <div>
            <label class="block text-[11px] font-medium uppercase tracking-wider mb-1.5"
              style="color: rgba(44, 44, 44, 0.4)">Mensaje</label>
            <textarea id="contact-message" rows="4" placeholder="¿En qué podemos ayudarte?"
              class="input-field w-full px-4 py-3 text-charcoal text-sm rounded-xl resize-none"></textarea>
          </div>
          <p id="contact-error" class="hidden-modal text-xs" style="color: #8a2222"></p>
          <button type="submit" class="w-full py-3.5 text-white font-medium rounded-xl btn-terra">
            Enviar mensaje
          </button>
        </form>
      </div>
    </div>
  </main>
  <!-- Pie de página con información del restaurante, navegación y enlaces a la cuenta -->
  <footer th:replace="~{fragments :: footer}"></footer>

  <!-- Modales para mostrar información adicional, carrito de compras y productos -->

  <!--Modal de producto-->
  <div id="modal-product" class="hidden-modal fixed inset-0 z-50 flex items-center justify-center p-4"
    style="background-color: rgba(44, 44, 44, 0.65)">
    <!-- Contenido del modal de producto -->
    <div class="bg-cream w-full max-w-lg overflow-hidden shadow-2xl relative" style="border-radius: 2px">
      <!-- Botón para cerrar el modal -->
      <button class="modal-close absolute top-3 right-3 z-10 w-8 h-8 rounded-full flex items-center justify-center"
        style="background-color: rgba(44, 44, 44, 0.7); color: #f5f2eb" data-close="product">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
      <!-- Imagen del producto -->
      <div class="relative h-56">
        <img id="product-image" src="" alt="" class="w-full h-full object-cover" />
      </div>
      <!-- Contenido del modal (data)-->
      <div class="p-6">
        <div class="flex items-start justify-between gap-4 mb-3">
          <h3 id="product-name" class="font-serif text-2xl font-semibold text-charcoal"></h3>
          <span id="product-price" class="font-bold text-xl flex-shrink-0" style="color: #b2571f"></span>
        </div>
        <p id="product-description" class="text-sm leading-relaxed mb-5" style="color: rgba(44, 44, 44, 0.62)"></p>

        <!-- Contenedor para los aditionales del producto -->
        <div id="product-additionals-wrap" class="mb-5">
          <p class="text-xs font-medium uppercase tracking-wider mb-3" style="color: rgba(44, 44, 44, 0.45)">
            Adicionales
          </p>
          <div id="product-additionals" class="space-y-2.5"></div>
        </div>
        <!-- Contenedor para la cantidad del producto -->
        <div class="flex items-center gap-4 mb-5">
          <p class="text-xs font-medium uppercase tracking-wider" style="color: rgba(44, 44, 44, 0.45)">
            Cantidad
          </p>
          <div class="flex items-center gap-3">
            <!-- Botón para restar cantidad -->
            <button id="qty-minus"
              class="qty-btn w-8 h-8 rounded-full flex items-center justify-center text-lg font-light">
              −
            </button>
            <span id="qty-value" class="w-6 text-center font-semibold text-charcoal">1</span>
            <!-- Botón para sumar cantidad -->
            <button id="qty-plus"
              class="qty-btn w-8 h-8 rounded-full flex items-center justify-center text-lg font-light">
              +
            </button>
          </div>
        </div>
        <!-- Botón para agregar al carrito -->
        <button id="add-to-cart-btn" class="w-full py-3 text-white font-medium rounded btn-terra">
          Agregar al carrito
        </button>
      </div>
    </div>
  </div>

  <!-- Modal de carrito -->
  <div th:replace="~{fragments :: modal-cart}"></div>

  <!--Arreglo que contiene los productos del menú y se comparte al js-->
  <script th:inline="javascript">
    const menuProducts = /*[[${products}]]*/[];
  </script>
  <script th:src="@{/js/script.js}"></script>
</body>

</html>
