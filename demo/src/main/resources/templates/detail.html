<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${client.name + ' ' + client.lastName + ' · Terra Galega'}">
      Cliente · Terra Galega
    </title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --terra: #b2571f;
        --burgundy: #8a2222;
        --cream: #f5f2eb;
      }
      body {
        background-color: var(--cream);
      }
      .navbar-terra {
        background-color: #2c2c2c;
      }
      .navbar-terra .navbar-brand {
        color: var(--cream) !important;
        font-weight: 600;
        letter-spacing: 0.05em;
      }
      .card-header-terra {
        background-color: var(--terra);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-terra navbar-expand-lg" data-bs-theme="dark">
      <div class="container">
        <a class="navbar-brand" th:href="@{/home}">Terra Galega · Admin</a>
        <div class="d-flex gap-2">
          <a class="btn btn-outline-light btn-sm" th:href="@{/admin}"
            >Comidas</a
          >
          <a class="btn btn-outline-light btn-sm active" th:href="@{/clients}"
            >Clientes</a
          >
          <a class="btn btn-outline-light btn-sm" th:href="@{/home}"
            >Volver al sitio</a
          >
        </div>
      </div>
    </nav>

    <div class="container py-5" style="max-width: 640px">
      <div class="card shadow-sm border-0">
        <div
          class="card-header card-header-terra"
          th:text="${client.name + ' ' + client.lastName}"
        ></div>
        <ul class="list-group list-group-flush">
          <li class="list-group-item">
            <strong>Email:</strong> <span th:text="${client.email}"></span>
          </li>
          <li class="list-group-item">
            <strong>Teléfono:</strong> <span th:text="${client.phone}"></span>
          </li>
          <li class="list-group-item">
            <strong>Dirección:</strong>
            <span th:text="${client.address}"></span>
          </li>
          <li class="list-group-item">
            <strong>Estado:</strong>
            <span th:if="${client.active}" class="badge bg-success"
              >Activo</span
            >
            <span th:unless="${client.active}" class="badge bg-secondary"
              >Inactivo</span
            >
          </li>
        </ul>
        <div class="card-body d-flex justify-content-end gap-2">
          <a class="btn btn-outline-secondary" th:href="@{/clients}"
            >Volver al listado</a
          >
          <a
            class="btn btn-outline-primary"
            th:href="@{/clients/{id}/edit(id=${client.id})}"
            >Editar</a
          >
        </div>
      </div>
    </div>
  </body>
</html>
