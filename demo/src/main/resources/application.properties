spring.application.name=demo

# Railway define PORT; en el PC sigue siendo 8080
server.port=${PORT:8080}
spring.thymeleaf.cache=false

#datasource
spring.jpa.database=h2
spring.datasource.driver-class-name=org.h2.Driver
#nombre base de datos
# Por defecto H2 en archivo (PC). En Railway: DATASOURCE_URL=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
# más DATASOURCE_USERNAME y DATASOURCE_PASSWORD (el driver se elige según la URL).
spring.datasource.url=${DATASOURCE_URL:jdbc:h2:file:./mydatabase}
spring.datasource.username=${DATASOURCE_USERNAME:sa}
spring.datasource.password=${DATASOURCE_PASSWORD:}

#consola de administracion de h2
# Consola web de H2 (/h2): da acceso total a la base de datos sin contraseña, así que viene
# apagada. Para usarla en el PC: H2_CONSOLE=true en .env.
spring.h2.console.enabled=${H2_CONSOLE:false}
#localhost:8080/h2
spring.h2.console.path=/h2

# Datos de prueba
spring.jpa.generate-ddl=true
#borrar la tabla cada vez: cada arranque empieza solo con los datos del DataLoader
spring.jpa.hibernate.ddl-auto=create-drop
#spring.sql.init.mode=

# Logging
#permite imprimir la query
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:DEBUG}
#imprime los parametros de las querys
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${SQL_BIND_LOG_LEVEL:TRACE}
spring.jpa.properties.hibernate.format_sql=true
springdoc.api-docs.version=OPENAPI_3_0

# PostgreSQL (seguimiento de domicilios). Docker: docker-compose.yml
# En Railway el plugin de PostgreSQL define PGHOST, PGPORT, PGDATABASE, PGUSER y PGPASSWORD.
terra.postgres.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5433}/${PGDATABASE:terragalega_delivery}
terra.postgres.username=${PGUSER:terra}
terra.postgres.password=${PGPASSWORD:terra123}
# create-drop porque H2 también se recrea en cada arranque (ids nuevos).
# Cuando H2 sea persistente, cambia las dos a "update".
terra.postgres.ddl-auto=create-drop
# ===================== JWT =====================
# En un despliegue real se define JWT_SECRET (en .env o en el servidor); el valor de abajo es
# solo para desarrollo y es conocido por todo el que tenga el repositorio.
terra.jwt.secret=${JWT_SECRET:Py6FLgYBcH4nBg+Xf/bGQyVdA0bdZ7OsjjXSX7TgQMpVoiOx2QQ0/tFCv8r4zNgk11Pge8Z4Fjbg7uNFE2zcKw==}
# Cuánto dura un token en milisegundos: 86400000 ms = 24 horas (1 día)
terra.jwt.expiration-ms=86400000

# ===================== CORREO =====================
# URL del front en el PC. Stripe vuelve aquí al pagar desde la web.
# Se queda en localhost: así la sesión (localStorage) y el botón de Google funcionan.
# En producción: FRONTEND_URL=https://tu-front.up.railway.app
terra.frontend-url=${FRONTEND_URL:http://localhost:4200}
# URL del front vista desde la red (IP del PC): el enlace del correo de
# confirmación apunta aquí para que también abra en el celular.
# Si cambia la IP del PC (otra red wifi), cámbiala aquí y en la app (ApiClient.BASE_URL).
# Para Angular en la red: npm run start:lan
# En producción: EMAIL_LINK_URL con la misma URL pública del front.
terra.email-link-url=${EMAIL_LINK_URL:http://10.195.49.29:4200}
# Desarrollo: Mailpit (docker-compose). Para producción, usuario y clave en variables de entorno
# Gmail real. Usuario y clave de aplicación van en variables de entorno, nunca en el archivo.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000



# Gmail reescribe el remitente al de la cuenta, así que debe ser el mismo test
terra.mail.from=${MAIL_USERNAME:terragalega0@gmail.com}

# Dirección del back que el CELULAR puede alcanzar (la que va dentro del QR)
terra.public-backend-url=${PUBLIC_BACKEND_URL:http://10.195.49.29:8080}
# Firma de los enlaces de factura: si cambia, los QR viejos dejan de abrir
terra.invoice.secret=${INVOICE_SECRET:cambia-esto-por-un-texto-largo-y-secreto}
terra.invoice.company-name=Terra Galega
terra.invoice.nit=

# Los informes (PDF/Excel con gráficas) pesan más de 1 MB, que es el límite por defecto
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB


# Stripe: las claves se obtienen del entorno de ejecución.
# Si faltan, la app arranca igual pero los pagos en línea responden 503.
# STRIPE_WEBHOOK_SECRET (whsec_...) lo da: stripe listen --forward-to localhost:8080/payments/webhook
terra.stripe.secret-key=${STRIPE_SECRET_KEY:}
terra.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
# Al pagar o cancelar, Stripe vuelve a terra.frontend-url + /checkout/result

# ===================== GOOGLE =====================
# Client ID web de Google Cloud (termina en .apps.googleusercontent.com).
# Es el mismo que usan la web y la app móvil. No es secreto (Google lo muestra
# en el navegador), por eso va aquí; la variable GOOGLE_CLIENT_ID lo reemplaza.
terra.google.client-ids=${GOOGLE_CLIENT_ID:805596346290-qk1d7bngiepvdvpbibqvjobkmpidd3ch.apps.googleusercontent.com}
# Comprobar la conexión con el correo al arrancar. Apagado por defecto: sin MAIL_USERNAME y
# MAIL_PASSWORD (archivo .env) la aplicación no arrancaría; así arranca y solo falla el envío.
spring.mail.test-connection=${MAIL_TEST_CONNECTION:false}
spring.config.import=optional:file:./.env[.properties]
# ===================== GEMINI (chatbot) =====================
# La key va en el archivo .env (GEMINI_API_KEY=...). Si falta, la app arranca igual
# pero el chat responde 503, igual que los pagos sin claves de Stripe.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=gemini-3.5-flash-lite
gemini.fallback-model=gemini-3.1-flash-lite
