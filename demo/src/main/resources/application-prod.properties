# Base principal y carrito compartido: conservar datos al reiniciar Railway.
# Las variables de entorno siguen teniendo prioridad sobre estos valores.
spring.jpa.hibernate.ddl-auto=update
terra.postgres.ddl-auto=update

# La consola H2 permite ejecutar SQL sin contraseña: nunca en producción.
spring.h2.console.enabled=false

# Sin consultas SQL ni sus parámetros en los logs: incluyen teléfonos, mensajes y tokens.
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
spring.jpa.properties.hibernate.format_sql=false

# La documentación Swagger expone todos los endpoints: solo en desarrollo.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

spring.thymeleaf.cache=true

# Comprobación al arrancar de que los secretos no son los de ejemplo del repositorio.
terra.production-checks=true
