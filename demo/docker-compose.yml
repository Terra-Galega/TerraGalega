services:
  postgres:
    image: postgres:16-alpine
    container_name: terragalega-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: terragalega_delivery
      POSTGRES_USER: terra
      POSTGRES_PASSWORD: terra123
    ports:
      - "5433:5432"
    volumes:
      - terragalega_pgdata:/var/lib/postgresql/data

  # Servidor de correo de prueba: recibe los correos sin enviarlos de verdad
  mailpit:
    image: axllent/mailpit
    container_name: terragalega-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP (el back envía aquí)
      - "8025:8025" # bandeja web: http://localhost:8025

volumes:
  terragalega_pgdata: