@if (visible) {
  <aside class="switcher">
    <button
      class="toggle"
      type="button"
      [attr.aria-expanded]="menuOpen"
      aria-controls="festival-switcher-menu"
      (click)="menuOpen = !menuOpen"
    >
      Probar festividades
    </button>

    @if (menuOpen) {
      <div class="menu" id="festival-switcher-menu">
        <p>Vista previa</p>
        <div class="options">
          @for (option of options; track option.id) {
            <button type="button" [attr.aria-pressed]="selected() === option.id" (click)="choose(option.id)">
              {{ option.name }}
            </button>
          }
        </div>
      </div>
    }
  </aside>
}
