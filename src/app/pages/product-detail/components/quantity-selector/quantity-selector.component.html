<div class="flex items-center rounded-full p-1" style="background: rgba(44, 44, 44, 0.06)">
  <button type="button" class="qty-btn" aria-label="Disminuir" (click)="change(-1)">−</button>
  <span class="w-12 text-center font-semibold text-charcoal">{{ value }}</span>
  <button type="button" class="qty-btn" aria-label="Aumentar" (click)="change(1)">+</button>
</div>
