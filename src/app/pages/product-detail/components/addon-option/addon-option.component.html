<!-- Fila del adicional; se resalta (clase "selected") si hay al menos una unidad elegida -->
<div
  class="addon-item addon flex items-center justify-between p-4 rounded-2xl"
  [class.selected]="quantity > 0"
>
  <!-- Nombre y precio (sin decimales, con "+" delante porque es un extra) -->
  <div class="flex flex-col">
    <span class="addon-item-name text-sm font-medium" style="color: rgba(44, 44, 44, 0.75)">{{
      addOn.name
    }}</span>
    <span class="text-sm" style="color: rgba(44, 44, 44, 0.45)"
      ><span class="sr-only">Cuesta {{ addOn.price | number: "1.0-0" }} pesos más</span
      ><span aria-hidden="true">+${{ addOn.price | number: "1.0-0" }}</span></span
    >
  </div>

  <!-- Selector de cantidad: "−", número y "+" -->
  <div
    class="flex items-center rounded-full p-0.5"
    style="background: rgba(44, 44, 44, 0.06)"
    role="group"
    [attr.aria-label]="('merge.quantity_of' | t) + ' ' + addOn.name"
  >
    <!-- Quitar uno (deshabilitado cuando no hay ninguna unidad) -->
    <button
      type="button"
      class="w-11 h-11 rounded-full flex items-center justify-center disabled:opacity-30"
      style="color: rgba(44, 44, 44, 0.6)"
      [attr.aria-label]="('merge.remove' | t) + ' ' + addOn.name"
      [disabled]="quantity === 0"
      (click)="changed.emit(-1)"
    >
      −
    </button>
    <!-- aria-live: al cambiar, el lector anuncia la nueva cantidad -->
    <span class="w-8 text-center text-sm font-semibold text-charcoal" aria-live="polite"
      ><span class="sr-only">{{ addOn.name }}: </span>{{ quantity }}</span>
    <!-- Agregar uno (se puede repetir el mismo adicional varias veces) -->
    <button
      type="button"
      class="w-11 h-11 rounded-full flex items-center justify-center"
      style="color: rgba(44, 44, 44, 0.6)"
      [attr.aria-label]="('merge.add' | t) + ' ' + addOn.name"
      (click)="changed.emit(1)"
    >
      +
    </button>
  </div>
</div>
