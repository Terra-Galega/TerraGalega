
<app-navbar></app-navbar>
<main class="min-h-screen pt-32 pb-28 max-w-6xl mx-auto px-6 md:px-8">

  <!-- VOLVER A LA CARTA -->
  <button
    type="button"
    (click)="goBackToMenu()"
    class="inline-flex items-center gap-2 text-[13px] font-medium text-charcoal/45 hover:text-charcoal mb-10 transition-colors group"
  >
    <svg
      class="w-4 h-4 group-hover:-translate-x-0.5 transition-transform"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M19 12H5m0 0l7 7m-7-7l7-7"
      />
    </svg>

    Volver a la carta
  </button>


  <!-- PRODUCTO -->
  @if (product) {
    <app-product-info-card
      [product]="product"
    />
  }


  <!-- TAMBIÉN TE PUEDE GUSTAR -->
  @if (relatedProducts.length > 0) {

    <section class="mt-16">

      <!-- SUBTÍTULO -->
      <p
        class="text-[12px] font-medium tracking-[0.3em] uppercase mb-2"
        style="color: rgba(178, 87, 31, 0.7)"
      >
        De la misma categoría
      </p>

      <!-- TÍTULO -->
      <h2
        class="font-serif text-3xl md:text-4xl font-semibold text-charcoal mb-8"
      >
        También te puede gustar
      </h2>
      


      <!-- PRODUCTOS RELACIONADOS -->
      <div
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"
      >

        @for (related of relatedProducts; track related.id) {

          <app-product-card
            [product]="related"
          />

        }

      </div>

    </section>

  }

</main>
<app-footer></app-footer>
