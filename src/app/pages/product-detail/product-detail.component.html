<app-navbar></app-navbar>
<main class="min-h-screen pt-32 pb-28 max-w-6xl mx-auto px-6 md:px-8">
  <!-- VOLVER A LA CARTA -->
  <button
    type="button"
    (click)="goBackToMenu()"
    class="inline-flex items-center gap-2 min-h-[44px] -my-3 text-[18px] font-medium text-charcoal/45 hover:text-charcoal mb-7 transition-colors group"
  >
    <svg aria-hidden="true" focusable="false"
      class="w-4 h-4 group-hover:-translate-x-0.5 transition-transform"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M19 12H5m0 0l7 7m-7-7l7-7"
      />
    </svg>

    {{ 'product_detail.product_detail.volver_a_la_carta' | t }}
  </button>

  <!-- PRODUCTO (solo se dibuja cuando ya llegó del servidor) -->
  @if (product) {
    <app-product-info-card [product]="product" />
  } @else {
    <!-- Cargando el plato -->
    <div class="flex justify-center py-32">
      <div class="w-10 h-10 rounded-full animate-spin" role="status" aria-label="Cargando"
        style="border: 3px solid rgba(178, 87, 31, 0.2); border-top-color: #b2571f"></div>
    </div>
  }

  <!-- TAMBIÉN TE PUEDE GUSTAR (solo si hay productos relacionados) -->
  @if (relatedProducts.length > 0) {
    <section class="mt-16">
      <!-- SUBTÍTULO -->
      <p
        class="text-[12px] font-medium tracking-[0.3em] uppercase mb-2"
        style="color: rgba(178, 87, 31, 0.7)"
      >
        {{ 'product_detail.product_detail.de_la_misma_categoria' | t }}
      </p>

      <!-- TÍTULO -->
      <h2
        class="font-serif text-3xl md:text-4xl font-semibold text-charcoal mb-8"
      >
        {{ 'product_detail.product_detail.tambien_te_puede_gustar' | t }}
      </h2>

      <!-- PRODUCTOS RELACIONADOS: 1 columna en celular, 2 en pantallas medianas
           y 3 en grandes -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        @for (related of relatedProducts; track related.id) {
          <app-product-card [product]="related" />
        }
      </div>
    </section>
  }
</main>
<app-footer></app-footer>
