<!-- Formulario reactivo para editar la información de la cuenta -->
<form
  [formGroup]="form"
  (ngSubmit)="save.emit()"
  class="glass-card rounded-3xl p-6 md:p-10 space-y-10"
>
  <!-- Sección para editar el nombre y el apellido del cliente -->
  <app-form-section title="Datos personales" tone="terra">
    <!-- Icono de usuario -->
    <svg
      icon
      class="w-5 h-5"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="1.8"
        d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
      />
    </svg>

    <!-- Campos de nombre y apellido organizados en dos columnas -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <app-form-field label="Nombre">
        <input
          type="text"
          formControlName="name"
          aria-label="Nombre"
          class="input-field w-full px-4 py-3 rounded-xl text-charcoal text-sm"
        />
      </app-form-field>

      <app-form-field label="Apellido">
        <input
          type="text"
          formControlName="lastName"
          aria-label="Apellido"
          class="input-field w-full px-4 py-3 rounded-xl text-charcoal text-sm"
        />
      </app-form-field>
    </div>
  </app-form-section>

  <!-- Sección para actualizar los datos de contacto -->
  <app-form-section title="Contacto" tone="gold">
    <!-- Icono de correo electrónico -->
    <svg
      icon
      class="w-5 h-5"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="1.8"
        d="M3 8l7.9 5.3a2 2 0 002.2 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
      />
    </svg>

    <!-- Campos para el correo electrónico, el teléfono y la dirección -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <app-form-field label="Correo electrónico">
        <input
          type="email"
          formControlName="email"
          aria-label="Correo electrónico"
          class="input-field w-full px-4 py-3 rounded-xl text-charcoal text-sm"
        />
      </app-form-field>

      <app-form-field label="Teléfono">
        <input
          type="text"
          formControlName="phone"
          aria-label="Teléfono"
          class="input-field w-full px-4 py-3 rounded-xl text-charcoal text-sm"
        />
      </app-form-field>

      <!-- Campo de dirección que ocupa todo el ancho disponible -->
      <app-form-field label="Dirección" class="sm:col-span-2">
        <input
          type="text"
          formControlName="address"
          aria-label="Dirección"
          class="input-field w-full px-4 py-3 rounded-xl text-charcoal text-sm"
        />
      </app-form-field>
    </div>
  </app-form-section>

  <!-- Sección para gestionar la contraseña de la cuenta -->
  <app-form-section title="Seguridad" tone="sage">
    <!-- Icono de seguridad -->
    <svg
      icon
      class="w-5 h-5"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="1.8"
        d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
      />
    </svg>

    <!-- Explicación y botón para abrir el modal de cambio de contraseña -->
    <div class="flex items-center justify-between gap-4">
      <p class="text-sm" style="color: rgba(44, 44, 44, 0.6)">
        Para cambiarla te pediremos tu contraseña actual.
      </p>
      <app-button
        type="button"
        variant="outline"
        size="md"
        (click)="changePassword.emit()"
      >
        Cambiar contraseña
      </app-button>
    </div>

    <!-- Información sobre la conservación de la contraseña actual -->
    <p class="text-xs mt-2" style="color: rgba(44, 44, 44, 0.45)">
      Si la dejas vacía, conservaremos tu contraseña actual.
    </p>
  </app-form-section>

  <!-- Muestra el mensaje de error cuando existe -->
  @if (errorMessage) {
    <p class="text-sm" style="color: #8a2222" role="alert">
      {{ errorMessage }}
    </p>
  }

  <!-- Botones para cancelar la edición o guardar los cambios -->
  <div
    class="flex flex-col-reverse sm:flex-row sm:justify-end gap-3 pt-6"
    style="border-top: 1px solid rgba(44, 44, 44, 0.08)"
  >
    <app-button
      type="button"
      variant="neutral"
      size="md"
      (click)="cancel.emit()"
    >
      Cancelar
    </app-button>
    <app-button type="submit" variant="primary" size="md">
      Guardar cambios
    </app-button>
  </div>
</form>
