<!-- Barra de navegación principal -->
<app-navbar></app-navbar>

<div class="min-h-screen bg-cream font-sans text-charcoal">
  <main class="pt-32 pb-28 max-w-5xl mx-auto px-6 md:px-8">
    <!-- Botón para cancelar la edición y volver al perfil -->
    <button
      type="button"
      (click)="cancel()"
      class="inline-flex items-center gap-2 text-sm mb-8 cursor-pointer transition-opacity hover:opacity-70"
      style="color: rgba(44, 44, 44, 0.6)"
    >
      <svg
        class="w-4 h-4"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M15 19l-7-7 7-7"
        />
      </svg>
      Volver a mi cuenta
    </button>

    <!-- Encabezado de la página de edición del perfil -->
    <app-page-header
      eyebrow="Mi cuenta"
      title="Editar perfil"
    ></app-page-header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
      <!-- Resumen del perfil con los datos actuales del formulario -->
      <app-profile-summary
        class="lg:sticky lg:top-28"
        [name]="form.value.name ?? ''"
        [lastName]="form.value.lastName ?? ''"
        [email]="form.value.email ?? ''"
      ></app-profile-summary>

      <!-- Formulario para editar los datos personales y gestionar la contraseña -->
      <app-account-form
        class="lg:col-span-2"
        [form]="form"
        [errorMessage]="errorMessage"
        (save)="save()"
        (cancel)="cancel()"
        (changePassword)="passwordModalOpen = true"
      ></app-account-form>
    </div>
  </main>
</div>

<!-- Pie de página -->
<app-footer></app-footer>

<!-- Muestra el modal de cambio de contraseña cuando está abierto y existe un cliente -->
@if (passwordModalOpen && client) {
  <app-change-password-modal
    [userName]="client.name + ' ' + client.lastName"
    [save]="savePassword"
    (closed)="passwordModalOpen = false"
  />
}
