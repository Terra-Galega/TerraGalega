<app-navbar></app-navbar>

<main class="min-h-screen flex items-center justify-center px-6 py-32">
  <div class="w-full max-w-md mx-auto">
    <!-- Encabezado -->

    <div class="text-center mb-10 flex flex-col items-center">
      <p
        id="auth-subtitle"
        class="text-[12px] tracking-widest uppercase mt-4"
        style="color: rgba(44, 44, 44, 0.38)"
      >
        {{
          activeTab === "login" ? "Bienvenido de vuelta" : "Únete a nosotros"
        }}
      </p>
    </div>

    <!-- Selector de pestañas -->

    <div
      id="auth-tabs"
      class="flex rounded-2xl p-1 mb-8"
      style="background-color: rgba(44, 44, 44, 0.06)"
    >
      <button
        type="button"
        id="tab-login-btn"
        (click)="selectTab('login')"
        class="auth-tab flex-1 py-2.5 rounded-full text-sm font-medium transition-all duration-300"
        [class.active]="activeTab === 'login'"
      >
        Iniciar sesión
      </button>

      <button
        type="button"
        id="tab-signup-btn"
        (click)="selectTab('signup')"
        class="auth-tab flex-1 py-2.5 rounded-full text-sm font-medium transition-all duration-300"
        [class.active]="activeTab === 'signup'"
      >
        Registrarse
      </button>
    </div>

    <!-- Formularios -->

    <div class="glass-card rounded-3xl p-8">
      <!-- LOGIN -->

      @if (activeTab === "login") {
        <form
          id="login-form"
          class="space-y-4"
          (submit)="$event.preventDefault(); login()"
        >
          <!-- Correo -->

          <div>
            <label
              class="block text-[11px] font-medium uppercase tracking-wider mb-1.5"
              style="color: rgba(44, 44, 44, 0.4)"
            >
              Correo electrónico
            </label>

            <input
              type="email"
              id="login-email"
              name="email"
              [value]="loginEmail"
              (input)="setLoginEmail($event)"
              placeholder="correo&#64;ejemplo.com"
              class="input-field w-full px-4 py-3 rounded-xl text-charcoal text-sm"
            />
          </div>

          <!-- Contraseña -->

          <div>
            <label
              class="block text-[11px] font-medium uppercase tracking-wider mb-1.5"
              style="color: rgba(44, 44, 44, 0.4)"
            >
              Contraseña
            </label>

            <div class="relative">
              <input
                [type]="showLoginPassword ? 'text' : 'password'"
                id="login-password"
                name="password"
                [value]="loginPassword"
                (input)="setLoginPassword($event)"
                placeholder="••••••••"
                class="password-field input-field w-full px-4 py-3 pr-11 rounded-xl text-charcoal text-sm"
              />

              <button
                type="button"
                (click)="toggleLoginPassword()"
                class="toggle-password absolute right-3 top-1/2 -translate-y-1/2"
                style="color: rgba(44, 44, 44, 0.4)"
                [attr.aria-label]="
                  showLoginPassword
                    ? 'Ocultar contraseña'
                    : 'Mostrar contraseña'
                "
              >
                @if (!showLoginPassword) {
                  <!-- Ojo abierto -->

                  <svg
                    class="eye-open w-4.5 h-4.5"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="1.8"
                      d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"
                    />

                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="1.8"
                      d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                    />
                  </svg>
                } @else {
                  <!-- Ojo cerrado -->

                  <svg
                    class="eye-closed w-4.5 h-4.5"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="1.8"
                      d="M3.98 8.223A10.477 10.477 0 001.934 12c1.292 4.338 5.31 7.5 10.066 7.5.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.5a10.522 10.522 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"
                    />
                  </svg>
                }
              </button>
            </div>
          </div>

          <!-- Error -->

          @if (loginError) {
            <p class="text-xs" style="color: #8a2222">
              {{ loginError }}
            </p>
          }

          <!-- Botón -->

          <button
            type="submit"
            class="w-full py-3.5 rounded-xl font-medium text-white mt-2 btn-terra"
            style="
              background: linear-gradient(135deg, #b2571f 0%, #8a2222 100%);
              box-shadow: 0 4px 20px rgba(178, 87, 31, 0.3);
            "
          >
            Iniciar sesión
          </button>

          <!-- Separador -->

          <div class="flex items-center gap-3 py-1">
            <div
              class="flex-1 h-px"
              style="background-color: rgba(44, 44, 44, 0.08)"
            ></div>

            <span class="text-[11px]" style="color: rgba(44, 44, 44, 0.3)">
              Accesos de prueba
            </span>

            <div
              class="flex-1 h-px"
              style="background-color: rgba(44, 44, 44, 0.08)"
            ></div>
          </div>

          <!-- Usuarios de prueba -->

          <div
            class="rounded-xl p-4 space-y-2"
            style="
              background-color: rgba(44, 44, 44, 0.04);
              border: 1px solid rgba(44, 44, 44, 0.07);
            "
          >
            <button
              type="button"
              (click)="fillDemoUser('cliente@terra.com', 'cliente123')"
              class="demo-login-btn w-full text-left px-3 py-2.5 rounded-lg text-[12px] transition-colors"
              style="color: rgba(44, 44, 44, 0.6)"
            >
              <span class="font-semibold text-charcoal">
                Cliente de prueba:
              </span>

              cliente&#64;terra.com
            </button>

            <button
              type="button"
              (click)="fillDemoUser('admin@terra.com', 'admin123')"
              class="demo-login-btn w-full text-left px-3 py-2.5 rounded-lg text-[12px] transition-colors"
              style="color: rgba(44, 44, 44, 0.6)"
            >
              <span class="font-semibold text-charcoal">
                Admin de prueba:
              </span>

              admin&#64;terra.com
            </button>
          </div>
        </form>
      }

      <!-- REGISTRO -->

      @if (activeTab === "signup") {
        <form id="signup-form" class="space-y-4">
          <!-- Nombre + Apellido -->

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label
                class="block text-[11px] font-medium uppercase tracking-wider mb-1.5"
                style="color: rgba(44, 44, 44, 0.4)"
              >
                Nombre
              </label>

              <input
                type="text"
                id="signup-name"
                name="name"
                placeholder="Juan"
                class="input-field w-full px-4 py-3 rounded-xl text-charcoal text-sm"
              />
            </div>

            <div>
              <label
                class="block text-[11px] font-medium uppercase tracking-wider mb-1.5"
                style="color: rgba(44, 44, 44, 0.4)"
              >
                Apellido
              </label>

              <input
                type="text"
                id="signup-lastname"
                name="lastName"
                placeholder="García"
                class="input-field w-full px-4 py-3 rounded-xl text-charcoal text-sm"
              />
            </div>
          </div>

          <!-- Correo -->

          <div>
            <label
              class="block text-[11px] font-medium uppercase tracking-wider mb-1.5"
              style="color: rgba(44, 44, 44, 0.4)"
            >
              Correo electrónico
            </label>

            <input
              type="email"
              id="signup-email"
              name="email"
              placeholder="correo&#64;ejemplo.com"
              class="input-field w-full px-4 py-3 rounded-xl text-charcoal text-sm"
            />
          </div>

          <!-- Contraseña -->

          <div>
            <label
              class="block text-[11px] font-medium uppercase tracking-wider mb-1.5"
              style="color: rgba(44, 44, 44, 0.4)"
            >
              Contraseña
            </label>

            <div class="relative">
              <input
                [type]="showSignupPassword ? 'text' : 'password'"
                id="signup-password"
                name="password"
                placeholder="••••••••"
                class="password-field input-field w-full px-4 py-3 pr-11 rounded-xl text-charcoal text-sm"
              />

              <button
                type="button"
                (click)="toggleSignupPassword()"
                class="toggle-password absolute right-3 top-1/2 -translate-y-1/2"
                style="color: rgba(44, 44, 44, 0.4)"
                [attr.aria-label]="
                  showSignupPassword
                    ? 'Ocultar contraseña'
                    : 'Mostrar contraseña'
                "
              >
                @if (!showSignupPassword) {
                  <svg
                    class="eye-open w-4.5 h-4.5"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="1.8"
                      d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"
                    />

                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="1.8"
                      d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                    />
                  </svg>
                } @else {
                  <svg
                    class="eye-closed w-4.5 h-4.5"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="1.8"
                      d="M3.98 8.223A10.477 10.477 0 001.934 12c1.292 4.338 5.31 7.5 10.066 7.5.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.5a10.522 10.522 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"
                    />
                  </svg>
                }
              </button>
            </div>
          </div>

          <!-- Teléfono -->

          <div>
            <label
              class="block text-[11px] font-medium uppercase tracking-wider mb-1.5"
              style="color: rgba(44, 44, 44, 0.4)"
            >
              Teléfono
            </label>

            <input
              type="tel"
              id="signup-phone"
              name="phone"
              placeholder="+57 300 000 0000"
              class="input-field w-full px-4 py-3 rounded-xl text-charcoal text-sm"
            />
          </div>

          <!-- Error registro -->

          @if (signupError) {
            <p class="text-xs" style="color: #8a2222">
              {{ signupError }}
            </p>
          }

          <!-- Crear cuenta -->

          <button
            type="submit"
            class="w-full py-3.5 rounded-xl font-medium text-white mt-2"
            style="
              background: linear-gradient(135deg, #b2571f 0%, #8a2222 100%);
              box-shadow: 0 4px 20px rgba(178, 87, 31, 0.3);
            "
          >
            Crear cuenta
          </button>
        </form>
      }
    </div>
  </div>
</main>

<app-footer></app-footer>
