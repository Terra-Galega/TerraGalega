<app-navbar></app-navbar>

<main class="min-h-screen flex items-center justify-center px-6 py-32">
  <!-- Columna flexible: ocupa el ancho disponible hasta 400 px, que es el máximo del botón oficial
       de Google. Así las pestañas, el botón de Google y el formulario miden siempre lo mismo,
       también en móvil (el botón se vuelve a dibujar cuando cambia el ancho). -->
  <div id="auth-card" class="w-full max-w-[400px] mx-auto">
    <!--Barra para login o register-->
    <app-login-header
      [activeTab]="activeTab"
      (tabChange)="selectTab($event)"
    ></app-login-header>
    <!-- Acceso con Google encima del formulario, en las dos pestañas (oculto mientras se espera
         la confirmación del correo). Se recrea al cambiar de pestaña para que cambie su texto. -->
    @if (!pendingEmail) {
      <!--
        LOGIN CON MICROSOFT DESACTIVADO (no se puede usar).
        La universidad no nos da permisos en Azure (Microsoft Entra ID) para registrar la
        aplicación y obtener el Client ID, así que no lo podemos usar. También se intentó
        con una cuenta personal de Microsoft, pero tampoco lo permitió.
        Se deja comentado por si en el futuro se consiguen los permisos.

        Acceso con Microsoft: la primera vez el back envía un código al correo de la cuenta
        para vincularla; mientras tanto el botón se cambia por el campo del código.
      @if (!microsoftToken) {
        <app-microsoft-button [disabled]="microsoftBusy" (credential)="microsoftLogin($event)" />
      } @else {
        <form
          id="microsoft-code-form"
          class="mb-3 space-y-3"
          (submit)="$event.preventDefault(); confirmMicrosoftCode(code.value)"
        >
          <label
            for="ms-code"
            class="block text-[11px] font-medium uppercase tracking-wider mb-1.5"
            style="color: rgba(44, 44, 44, 0.4)"
          >
            {{ 'microsoft.code' | t }} {{ microsoftEmail || 'tu correo' }}
          </label>
          <input
            #code
            id="ms-code"
            name="code"
            required
            minlength="12"
            maxlength="12"
            autocomplete="one-time-code"
            spellcheck="false"
            class="input-field w-full px-4 py-3 rounded-full text-charcoal text-sm text-center tracking-widest"
          />
          <div class="flex justify-center gap-3">
            <app-button type="button" variant="danger" [disabled]="microsoftBusy" (click)="cancelMicrosoft()">
              {{ 'microsoft.cancel' | t }}
            </app-button>
            <app-button type="submit" variant="primary" [disabled]="microsoftBusy">
              {{ 'microsoft.confirm' | t }}
            </app-button>
          </div>
        </form>
      }
      @if (microsoftError) {
        <p id="microsoft-error" role="status" class="text-sm text-center mb-3" style="color: #8a2222">{{ microsoftError }}</p>
      }
      -->
      @if (activeTab === "login") {
        <app-google-button mode="login" position="top" (credential)="googleLogin($event)"></app-google-button>
      } @else {
        <app-google-button mode="signup" position="top" (credential)="googleLogin($event)"></app-google-button>
      }
      @if (googleError) {
        <p id="google-error" class="text-sm text-center -mt-3 mb-5" style="color: #8a2222">{{ googleError }}</p>
      }
    }
    <!--Formulario-->
    <app-login-forms
      [activeTab]="activeTab"
      [loginEmail]="loginEmail"
      [loginPassword]="loginPassword"
      [loginError]="loginError"
      [signupError]="signupError"
      [showLoginPassword]="showLoginPassword"
      [showSignupPassword]="showSignupPassword"
      (loginEmailChange)="loginEmail = $event"
      (loginPasswordChange)="loginPassword = $event"
      (loginSubmit)="login()"
      (loginPasswordToggle)="toggleLoginPassword()"
      (signupPasswordToggle)="toggleSignupPassword()"
      (demoUser)="fillDemoUser($event.email, $event.password)"
      [signupName]="signupName"
      [signupLastName]="signupLastName"
      [signupEmail]="signupEmail"
      [signupPassword]="signupPassword"
      [signupPhone]="signupPhone"
      [signupAddress]="signupAddress"
      [pendingEmail]="pendingEmail"
      [emailNotVerified]="emailNotVerified"
      [resendMessage]="resendMessage"
      [resendError]="resendError"
      [resendCooldown]="resendCooldown"
      (resendVerification)="resendVerification()"
      (backToLogin)="backToLogin()"
      (signupNameChange)="setSignupName($event)"
      (signupLastNameChange)="setSignupLastName($event)"
      (signupEmailChange)="setSignupEmail($event)"
      (signupPasswordChange)="setSignupPassword($event)"
      (signupPhoneChange)="setSignupPhone($event)"
      (signupAddressChange)="setSignupAddress($event)"
      (signupSubmit)="signup()"
    ></app-login-forms>
  </div>
</main>

<app-footer></app-footer>
