<app-navbar></app-navbar>

<main class="min-h-screen pt-32 pb-28 bg-cream">
  <div class="max-w-md mx-auto px-6">
    <div class="text-center mb-10">
      <p
        class="text-sm font-medium tracking-[0.25em] uppercase mb-3"
        style="color: #b2571f"
      >
        Bienvenido
      </p>

      <h1 class="font-serif text-4xl text-charcoal font-semibold">Tu cuenta</h1>

      <div
        class="w-12 h-px mx-auto mt-5"
        style="background-color: #d99a21"
      ></div>
    </div>

    <div class="glass-card rounded-3xl p-8">
      <!-- TABS -->

      <div
        class="flex mb-8 rounded-xl p-1"
        style="background-color: rgba(44, 44, 44, 0.05)"
      >
        <button
          type="button"
          (click)="selectTab('login')"
          class="flex-1 py-2.5 rounded-lg text-sm font-medium transition-all"
          [style.background-color]="
            activeTab === 'login' ? 'white' : 'transparent'
          "
          [style.color]="
            activeTab === 'login' ? '#2c2c2c' : 'rgba(44,44,44,0.5)'
          "
        >
          Iniciar sesión
        </button>

        <button
          type="button"
          (click)="selectTab('signup')"
          class="flex-1 py-2.5 rounded-lg text-sm font-medium transition-all"
          [style.background-color]="
            activeTab === 'signup' ? 'white' : 'transparent'
          "
          [style.color]="
            activeTab === 'signup' ? '#2c2c2c' : 'rgba(44,44,44,0.5)'
          "
        >
          Crear cuenta
        </button>
      </div>

      <!-- LOGIN -->

      @if (activeTab === "login") {
        <div class="space-y-5">
          <div>
            <label
              class="block text-[11px] font-medium uppercase tracking-wider mb-1.5"
            >
              Correo electrónico
            </label>

            <input
              type="email"
              placeholder="correo&#64;ejemplo.com"
              [value]="loginEmail"
              (input)="setLoginEmail($event)"
              class="input-field w-full px-4 py-3 rounded-xl text-charcoal text-sm"
            />
          </div>

          <div>
            <label
              class="block text-[11px] font-medium uppercase tracking-wider mb-1.5"
            >
              Contraseña
            </label>

            <div class="relative">
              <input
                [type]="showLoginPassword ? 'text' : 'password'"
                placeholder="••••••••"
                [value]="loginPassword"
                (input)="setLoginPassword($event)"
                class="input-field w-full px-4 py-3 pr-11 rounded-xl text-charcoal text-sm"
              />

              <button
                type="button"
                (click)="toggleLoginPassword()"
                class="absolute right-3 top-1/2 -translate-y-1/2"
                style="color: rgba(44, 44, 44, 0.45)"
              >
                @if (showLoginPassword) {
                  <svg
                    class="w-5 h-5"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="1.5"
                      d="M3 3l18 18M10.584 10.587a2 2 0 002.828 2.828M9.88 4.24A9.77 9.77 0 0112 4c5 0 9 4 10 8a10.08 10.08 0 01-4.056 5.166M6.228 6.228C4.408 7.538 3.174 9.421 2 12c1.5 4 5.5 8 10 8 1.43 0 2.76-.35 3.944-.966"
                    />
                  </svg>
                } @else {
                  <svg
                    class="w-5 h-5"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="1.5"
                      d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"
                    />

                    <circle cx="12" cy="12" r="3" stroke-width="1.5" />
                  </svg>
                }
              </button>
            </div>
          </div>

          @if (loginError) {
            <p class="text-xs" style="color: #8a2222">
              {{ loginError }}
            </p>
          }

          <button
            type="button"
            (click)="login()"
            class="w-full py-3.5 rounded-xl font-medium text-white mt-2"
            style="
              background: linear-gradient(135deg, #b2571f 0%, #8a2222 100%);
              box-shadow: 0 4px 20px rgba(178, 87, 31, 0.3);
            "
          >
            Iniciar sesión
          </button>
        </div>

        <!-- USUARIOS DE PRUEBA -->

        <div
          class="mt-8 pt-6 border-t"
          style="border-color: rgba(44, 44, 44, 0.1)"
        >
          <p
            class="text-[10px] uppercase tracking-widest mb-3"
            style="color: rgba(44, 44, 44, 0.4)"
          >
            Usuarios de prueba
          </p>

          <div class="space-y-1">
            <button
              type="button"
              (click)="fillDemoUser('cliente@terra.com', 'cliente123')"
              class="w-full text-left px-3 py-2.5 rounded-lg text-[12px] transition-colors"
              style="color: rgba(44, 44, 44, 0.6)"
            >
              <span class="font-semibold text-charcoal">
                Cliente de prueba:
              </span>

              cliente&#64;terra.com
            </button>

            <button
              type="button"
              (click)="fillDemoUser('admin@terra.com', 'admin123')"
              class="w-full text-left px-3 py-2.5 rounded-lg text-[12px] transition-colors"
              style="color: rgba(44, 44, 44, 0.6)"
            >
              <span class="font-semibold text-charcoal">
                Admin de prueba:
              </span>

              admin&#64;terra.com
            </button>
          </div>
        </div>
      }

      <!-- CREAR CUENTA -->

      @if (activeTab === "signup") {
        <div class="space-y-5">
          <div>
            <label
              class="block text-[11px] font-medium uppercase tracking-wider mb-1.5"
            >
              Nombre
            </label>

            <input
              type="text"
              placeholder="Tu nombre"
              class="input-field w-full px-4 py-3 rounded-xl text-charcoal text-sm"
            />
          </div>

          <div>
            <label
              class="block text-[11px] font-medium uppercase tracking-wider mb-1.5"
            >
              Apellido
            </label>

            <input
              type="text"
              placeholder="Tu apellido"
              class="input-field w-full px-4 py-3 rounded-xl text-charcoal text-sm"
            />
          </div>

          <div>
            <label
              class="block text-[11px] font-medium uppercase tracking-wider mb-1.5"
            >
              Correo electrónico
            </label>

            <input
              type="email"
              placeholder="correo&#64;ejemplo.com"
              class="input-field w-full px-4 py-3 rounded-xl text-charcoal text-sm"
            />
          </div>

          <div>
            <label
              class="block text-[11px] font-medium uppercase tracking-wider mb-1.5"
            >
              Contraseña
            </label>

            <div class="relative">
              <input
                [type]="showSignupPassword ? 'text' : 'password'"
                placeholder="••••••••"
                class="input-field w-full px-4 py-3 pr-11 rounded-xl text-charcoal text-sm"
              />

              <button
                type="button"
                (click)="toggleSignupPassword()"
                class="absolute right-3 top-1/2 -translate-y-1/2"
                style="color: rgba(44, 44, 44, 0.45)"
              >
                @if (showSignupPassword) {
                  <svg
                    class="w-5 h-5"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="1.5"
                      d="M3 3l18 18M10.584 10.587a2 2 0 002.828 2.828M9.88 4.24A9.77 9.77 0 0112 4c5 0 9 4 10 8a10.08 10.08 0 01-4.056 5.166M6.228 6.228C4.408 7.538 3.174 9.421 2 12c1.5 4 5.5 8 10 8 1.43 0 2.76-.35 3.944-.966"
                    />
                  </svg>
                } @else {
                  <svg
                    class="w-5 h-5"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="1.5"
                      d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"
                    />

                    <circle cx="12" cy="12" r="3" stroke-width="1.5" />
                  </svg>
                }
              </button>
            </div>
          </div>

          <button
            type="button"
            class="w-full py-3.5 rounded-xl font-medium text-white mt-2"
            style="
              background: linear-gradient(135deg, #b2571f 0%, #8a2222 100%);
              box-shadow: 0 4px 20px rgba(178, 87, 31, 0.3);
            "
          >
            Crear cuenta
          </button>
        </div>
      }
    </div>
  </div>
</main>

<app-footer></app-footer>
