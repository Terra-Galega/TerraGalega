<div class="text-center mb-10 flex flex-col items-center">
  <!-- Título principal para lectores de pantalla; cambia con la pestaña elegida -->
  <h1 class="sr-only">{{ activeTab === "login" ? "Iniciar sesión" : "Crear cuenta" }}</h1>
  <p class="text-[12px] font-medium tracking-[0.3em] uppercase mb-2" style="color: #b2571f">
    {{ activeTab === "login" ? "Bienvenido de vuelta" : "Únete a nosotros" }}
  </p>
  <!-- Si se llegó aquí desde una acción (pagar, reservar...), se explica para qué -->
  @if (reasonKey) {
    <p id="login-reason" class="text-sm max-w-xs mt-1 leading-relaxed" style="color: rgba(44, 44, 44, 0.72)">
      {{ reasonKey | t }}
    </p>
  }
</div>

<div id="auth-tabs" class="relative flex w-full rounded-full p-1 mb-8" style="background-color: rgba(44, 44, 44, 0.06)">
  <!--Pastilla deslizante: hace que las dos opciones se vean como un switch-->
  <span class="auth-thumb" [class.signup]="activeTab === 'signup'" aria-hidden="true"></span>
  <!--Botones de opción-->
  <button [attr.aria-pressed]="activeTab === 'login'" type="button" id="tab-login-btn" (click)="selectTab('login')"
    class="auth-tab flex-1 py-2.5 rounded-full whitespace-nowrap text-sm font-medium transition-colors duration-300"
    [class.active]="activeTab === 'login'">
    {{ 'login.login_header.login_header.iniciar_sesion' | t }}
  </button>

  <button [attr.aria-pressed]="activeTab === 'signup'" type="button" id="tab-signup-btn" (click)="selectTab('signup')"
    class="auth-tab flex-1 py-2.5 rounded-full whitespace-nowrap text-sm font-medium transition-colors duration-300"
    [class.active]="activeTab === 'signup'">
    {{ 'login.login_header.login_header.registrarse' | t }}
  </button>
</div>
