<!-- Carrusel de anuncios: solo existe si hay al menos uno -->
@if (announcements.length > 0) {
<section
    class="py-28 md:py-36"
    style="background-color: #f7f4ec"
    aria-roledescription="carousel"
    aria-label="Anuncios"
>
    <div class="max-w-7xl mx-auto px-6">
    <!-- Mismo encabezado que "Favoritos de la casa" -->
    <app-section-heading appReveal eyebrow="Lo último en casa" title="Novedades" />

    <!-- Marco del carrusel: recorta lo que queda fuera de la diapositiva -->
    <div
        appReveal
        class="relative overflow-hidden rounded-[2rem]"
        style="
        background-color: rgba(255, 255, 255, 0.7);
        box-shadow: 0 1px 2px rgba(44, 44, 44, 0.04), 0 20px 50px rgba(44, 44, 44, 0.07);
        "
        (mouseenter)="paused = true"
        (mouseleave)="paused = false"
        (focusin)="paused = true"
        (focusout)="paused = false"
    >
        <!-- Pista horizontal: se desplaza 100% por cada anuncio -->
        <div
        class="flex"
        style="transition: transform 0.7s ease"
        [style.transform]="'translateX(-' + current * 100 + '%)'"
        >
        @for (announcement of announcements; track announcement.id; let i = $index) {
            <article
            class="w-full flex-shrink-0 grid md:grid-cols-2"
            [attr.aria-hidden]="i !== current"
            [attr.aria-label]="i + 1 + ' de ' + announcements.length"
            role="group"
            >
            <!-- Imagen -->
            <img
                [src]="announcement.imageUrl"
                [alt]="announcement.title"
                class="w-full h-64 md:h-[30rem] object-cover"
            />

            <!-- Texto -->
            <div class="flex flex-col justify-center p-8 md:p-14">
                <h2
                class="font-serif text-3xl md:text-5xl font-semibold tracking-tight leading-[1.1] text-charcoal mb-5"
                >
                {{ announcement.title }}
                </h2>
                <p
                class="text-base md:text-lg leading-relaxed"
                style="color: rgba(44, 44, 44, 0.7)"
                >
                {{ announcement.description }}
                </p>
            </div>
            </article>
        }
        </div>

        <!-- Flechas: solo si hay más de un anuncio -->
        @if (announcements.length > 1) {
        <button
            type="button"
            aria-label="Anuncio anterior"
            class="absolute left-3 top-1/2 -translate-y-1/2 w-11 h-11 rounded-full flex items-center justify-center"
            style="
            background-color: rgba(245, 242, 235, 0.92);
            box-shadow: 0 4px 16px rgba(44, 44, 44, 0.15);
            color: #2c2c2c;
            "
            (click)="prev()"
        >
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 18l-6-6 6-6" />
            </svg>
        </button>

        <button
            type="button"
            aria-label="Anuncio siguiente"
            class="absolute right-3 top-1/2 -translate-y-1/2 w-11 h-11 rounded-full flex items-center justify-center"
            style="
            background-color: rgba(245, 242, 235, 0.92);
            box-shadow: 0 4px 16px rgba(44, 44, 44, 0.15);
            color: #2c2c2c;
            "
            (click)="next()"
        >
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18l6-6-6-6" />
            </svg>
        </button>

        <!-- Puntos indicadores -->
        <div class="absolute bottom-4 left-1/2 -translate-x-1/2 flex gap-2">
            @for (announcement of announcements; track announcement.id; let i = $index) {
            <button
                type="button"
                [attr.aria-label]="'Ir al anuncio ' + (i + 1)"
                class="h-2 rounded-full"
                style="transition: all 0.3s ease"
                [style.width]="i === current ? '24px' : '8px'"
                [style.background-color]="
                i === current ? '#b2571f' : 'rgba(44, 44, 44, 0.25)'
                "
                (click)="goTo(i)"
            ></button>
            }
        </div>
        }
    </div>
    </div>
</section>
}
