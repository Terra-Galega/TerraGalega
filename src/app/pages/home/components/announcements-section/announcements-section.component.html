<!-- Carrusel de anuncios: solo existe si hay al menos uno.
     Mismo fondo que "Favoritos de la casa" y sin espacio inferior: las dos secciones se leen
     como un solo bloque con un único respiro entre ellas. -->
@if (announcements.length > 0) {
<section class="section-y section-y--flush-bottom bg-cream" aria-roledescription="carousel" aria-label="Anuncios">
  <div class="max-w-[90rem] mx-auto px-4 md:px-6">
    <!-- Mismo encabezado que "Favoritos de la casa" -->
    <app-section-heading appReveal [tight]="true" eyebrow="Lo último en casa" title="Novedades" />

    <!-- Marco del carrusel: recorta lo que queda fuera de la diapositiva. En pantalla táctil se
         cambia de anuncio deslizando el dedo a los lados. -->
    <div appReveal class="relative overflow-hidden rounded-[28px] md:rounded-[32px] bg-white"
      style="box-shadow: 0 1px 2px rgba(44, 44, 44, 0.04), 0 24px 60px rgba(44, 44, 44, 0.08)"
      (mouseenter)="paused = true" (mouseleave)="paused = false" (focusin)="paused = true" (focusout)="paused = false"
      (touchstart)="onTouchStart($event)" (touchend)="onTouchEnd($event)">
      <!-- Pista horizontal: se desplaza 100% por cada anuncio -->
      <div class="flex" style="transition: transform 0.8s cubic-bezier(0.32, 0.72, 0, 1)"
        [style.transform]="'translateX(-' + current * 100 + '%)'">
        @for (announcement of announcements; track announcement.id; let i = $index) {
        <!-- Imagen más ancha que el texto (5 de 9 partes). La imagen guarda siempre la
             proporción 4:3 (16:10 en móvil): el admin ve el mismo recorte en su vista previa. -->
        <article class="w-full flex-shrink-0 grid md:grid-cols-[1.25fr_1fr]" [attr.aria-hidden]="i !== current"
          [attr.aria-label]="i + 1 + ' de ' + announcements.length" role="group">
          <img [src]="announcement.imageUrl" [alt]="announcement.title" [attr.loading]="i === 0 ? 'eager' : 'lazy'"
            class="w-full aspect-[16/10] md:aspect-[4/3] object-cover" />

          <div class="flex flex-col justify-center px-7 py-8 md:px-12 md:py-12 lg:px-16">
            <p class="text-xs md:text-[13px] font-semibold tracking-[0.22em] uppercase mb-4" style="color: #b2571f">
              Novedad
            </p>
            <h2 class="font-serif fluid-headline font-semibold tracking-tight text-charcoal mb-4 md:mb-5">
              {{ announcement.title }}
            </h2>
            <p class="text-lg md:text-xl leading-snug max-w-prose" style="color: rgba(44, 44, 44, 0.7)">
              {{ announcement.description }}
            </p>
          </div>
        </article>
        }
      </div>
    </div>

    <!-- Controles debajo del carrusel (sin tapar la imagen ni el texto): flecha, puntos en una
         píldora translúcida, flecha y botón de pausa. Todos miden 44 px para pulsarlos con el dedo. -->
    @if (announcements.length > 1) {
    <div class="mt-5 flex items-center justify-center gap-3">
      <button type="button" aria-label="Anuncio anterior"
        class="w-11 h-11 rounded-full flex items-center justify-center transition-colors hover:bg-black/10"
        style="background-color: rgba(44, 44, 44, 0.07); color: #2c2c2c" (click)="prev()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 18l-6-6 6-6" />
        </svg>
      </button>

      <div class="flex items-center gap-2.5 h-11 px-5 rounded-full" style="background-color: rgba(44, 44, 44, 0.07)">
        @for (announcement of announcements; track announcement.id; let i = $index) {
        <button type="button" [attr.aria-label]="'Ir al anuncio ' + (i + 1)" [attr.aria-current]="i === current"
          class="h-2 rounded-full" style="transition: all 0.35s ease" [style.width]="i === current ? '28px' : '8px'"
          [style.background-color]="i === current ? '#2c2c2c' : 'rgba(44, 44, 44, 0.28)'" (click)="goTo(i)"></button>
        }
      </div>

      <button type="button" aria-label="Anuncio siguiente"
        class="w-11 h-11 rounded-full flex items-center justify-center transition-colors hover:bg-black/10"
        style="background-color: rgba(44, 44, 44, 0.07); color: #2c2c2c" (click)="next()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 18l6-6-6-6" />
        </svg>
      </button>

      <!-- Pausa / reanudar el avance automático -->
      <button type="button" [attr.aria-label]="userPaused ? 'Reanudar avance automático' : 'Pausar avance automático'"
        class="w-11 h-11 rounded-full flex items-center justify-center transition-colors hover:bg-black/10"
        style="background-color: rgba(44, 44, 44, 0.07); color: #2c2c2c" (click)="userPaused = !userPaused">
        @if (userPaused) {
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z" />
        </svg>
        } @else {
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <rect x="6" y="4" width="4" height="16" rx="1.2" />
          <rect x="14" y="4" width="4" height="16" rx="1.2" />
        </svg>
        }
      </button>
    </div>
    }
  </div>
</section>
}
