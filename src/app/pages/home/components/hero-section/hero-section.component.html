<!-- Portada a pantalla completa: la imagen de fondo ocupa todo el espacio y el contenido va por encima. -->
<section id="hero" class="relative min-h-screen flex flex-col overflow-hidden pt-28 pb-8">
  <!-- Decoración de la festividad del día (no muestra nada si no hay ninguna). -->
  <app-celebration-scene />
  <app-celebration-switcher />
  <!-- Imagen de fondo y degradado oscuro -->
  <img src="https://images.unsplash.com/photo-1691089667845-841645e16c43?w=1600&h=900&fit=crop&auto=format"
    alt="Interior elegante del restaurante Terra Galega" class="absolute inset-0 w-full h-full object-cover" />
  <!-- Capa oscura con degradado para que el texto claro se lea bien sobre la foto. -->
  <div class="absolute inset-0" style="
      background: linear-gradient(
        to bottom,
        rgba(44, 44, 44, 0.55) 0%,
        rgba(44, 44, 44, 0.45) 50%,
        rgba(44, 44, 44, 0.75) 100%
      );
    "></div>

  <!-- Contenedor central: flex-1 toma el espacio sobrante y centra el contenido -->
  <div class="relative z-10 flex-1 flex flex-col justify-center items-center text-center px-6 max-w-4xl mx-auto w-full">
    <!-- Etiqueta superior con el tipo de restaurante y la ciudad. -->
    <p class="text-xs md:text-sm font-medium tracking-[0.35em] uppercase" style="color: #d99a21">
      Restaurante gallego · Bogotá
    </p>

    <!-- Logotipo principal. Entrada: aparece como una marea que avanza sobre la piedra (borde
         ondulado), se enfoca y un destello dorado recorre el trazo, más intenso en el pulpo.
         Al bajar: primero se va el pulpo, luego "Terra" se centra sobre "GALEGA" y por último
         las dos palabras suben hasta el logo de la navbar. -->
    <span #logoBox class="hero-logo mx-auto my-6 md:my-10">
      <span #logoFade class="logo-fade">
        <span class="logo-reveal">
          <!-- GALEGA (define el tamaño de la caja) y Terra: el mismo dibujo recortado en dos -->
          <span #galega class="logo-part logo-part--galega">
            <img src="/images/logo-hero-text.svg" alt="Terra Galega" class="logo-img" />
          </span>
          <span #terra class="logo-part logo-part--terra" aria-hidden="true">
            <img src="/images/logo-hero-text.svg" alt="" class="logo-img" />
          </span>
          <span class="logo-shine logo-shine--text" aria-hidden="true"></span>
          <span #octopus class="logo-part logo-octopus" aria-hidden="true">
            <img src="/images/logo-hero-octopus.svg" alt="" class="logo-img" />
            <span class="logo-shine logo-shine--octopus"></span>
          </span>
        </span>
      </span>
    </span>

    <!-- Descripción breve del restaurante. -->
    <p class="text-base md:text-lg lg:text-xl max-w-xl mx-auto leading-relaxed"
      style="color: rgba(245, 242, 235, 0.8)">
      Tradición culinaria gallega en el corazón de Bogotá. Mariscos frescos,
      carnes seleccionadas y los auténticos sabores del noroeste de España.
    </p>
  </div>

  <!-- Indicador para seguir bajando: texto pequeño y una línea fina que se ilumina despacio. -->
  <div class="scroll-cue relative z-10 flex flex-col items-center gap-3 mt-8" aria-hidden="true">
    <span class="text-[11px] tracking-[0.3em] uppercase">Descubrir</span>
    <span class="scroll-cue-line"></span>
  </div>
</section>
