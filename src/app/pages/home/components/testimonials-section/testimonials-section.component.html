<!-- Sección "La crítica opina" con fondo beige. -->
<section class="section-y" style="background-color: #ede9e0">
  <div class="critics-wrap mx-auto px-6">
    <app-section-heading appReveal eyebrow="Prensa y crítica" title="Lo que opina la crítica" />

    <!-- Cuatro reseñas fijas: 1 columna en móvil, 2 en tablet y 4 en escritorio.
         Cada tarjeta se desvanece al aparecer con un pequeño retraso respecto a la anterior. -->
    <div class="critics" [class.visible]="visible">
      @for (review of reviews; track review.author; let i = $index) {
      <figure class="critic glass-card" [style.animation-delay.ms]="i * 180">
        <span class="quote-mark" aria-hidden="true">“</span>
        <!-- Calificación solo con estrellas -->
        <p class="stars" [attr.aria-label]="review.stars + ' de 5 estrellas'">
          @for (slot of starSlots; track slot) {
          <svg viewBox="0 0 24 24" aria-hidden="true" [class.empty]="slot > review.stars">
            <path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z" />
          </svg>
          }
        </p>
        <blockquote>{{ review.quote }}</blockquote>
        <figcaption>
          <span class="author">{{ review.author }}</span>
          <span class="outlet">{{ review.outlet }}</span>
        </figcaption>
      </figure>
      }
    </div>
  </div>
</section>
