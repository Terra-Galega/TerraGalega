<div class="grid grid-cols-1 md:grid-cols-3 gap-8">
  @for (testimonial of testimonials; track testimonial.name) {
    <div
      class="bg-cream p-8 shadow-sm"
      style="background-color: rgb(251, 247, 242); border-radius: 2px"
    >
      <div class="flex gap-1 mb-5">
        @for (star of [1, 2, 3, 4, 5]; track star) {
          <svg class="w-4 h-4" fill="#d99a21" viewBox="0 0 20 20">
            <path
              d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"
            />
          </svg>
        }
      </div>

      <p
        class="text-sm leading-relaxed mb-6 italic"
        style="color: rgba(44, 44, 44, 0.68)"
      >
        "{{ testimonial.text }}"
      </p>

      <div class="pt-5 border-t" style="border-color: rgba(44, 44, 44, 0.1)">
        <p class="font-semibold text-charcoal text-sm">
          {{ testimonial.name }}
        </p>

        <p class="text-xs mt-0.5" style="color: rgba(44, 44, 44, 0.45)">
          {{ testimonial.role }}
        </p>
      </div>
    </div>
  }
</div>
