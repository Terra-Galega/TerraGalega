<app-navbar></app-navbar>
<style type="text/tailwindcss">
  @theme {
    --color-terra: #b2571f;
    --color-gold: #d99a21;
    --color-burgundy: #8a2222;
    --color-cream: #f5f2eb;
    --color-forest: #556141;
    --color-charcoal: #2c2c2c;
    --font-sans: "Source Sans 3", ui-sans-serif, system-ui, sans-serif;
    --font-serif: "Playfair Display", ui-serif, Georgia, serif;
  }
</style>
<section
  id="hero"
  class="relative min-h-screen flex flex-col overflow-hidden pt-28 pb-8"
>
  <!-- Imagen de fondo y degradado oscuro -->
  <img
    src="https://images.unsplash.com/photo-1691089667845-841645e16c43?w=1600&h=900&fit=crop&auto=format"
    alt="Interior elegante del restaurante Terra Galega"
    class="absolute inset-0 w-full h-full object-cover"
  />
  <div
    class="absolute inset-0"
    style="
      background: linear-gradient(
        to bottom,
        rgba(44, 44, 44, 0.55) 0%,
        rgba(44, 44, 44, 0.45) 50%,
        rgba(44, 44, 44, 0.75) 100%
      );
    "
  ></div>

  <!-- 1. CONTENEDOR CENTRAL: Con 'flex-1' toma el espacio sobrante y se centra dinámicamente -->
  <div
    class="relative z-10 flex-1 flex flex-col justify-center items-center text-center px-6 max-w-4xl mx-auto w-full"
  >
    <!-- Texto superior -->
    <p
      class="text-xs md:text-sm font-medium tracking-[0.35em] uppercase"
      style="color: #d99a21"
    >
      Restaurante Gallego · Bogotá
    </p>

    <!-- Logo del restaurante -->
    <img
      src="../../../images/logo-hero.svg"
      alt="Terra Galega"
      class="mx-auto w-72 md:w-[400px] lg:w-[480px] my-6 md:my-10 object-contain drop-shadow-2xl"
    />

    <!-- Texto descriptivo -->
    <p
      class="text-base md:text-lg lg:text-xl max-w-2xl mx-auto mb-8 md:mb-10 leading-relaxed"
      style="color: rgba(245, 242, 235, 0.8)"
    >
      Tradición culinaria gallega en el corazón de Bogotá. Mariscos frescos,
      carnes seleccionadas y los auténticos sabores del noroeste de España.
    </p>

    <!-- Botones de acción -->
    <div class="flex flex-wrap items-center justify-center gap-4">
      <a
        href=""
        class="px-8 py-3.5 rounded-full font-medium text-charcoal transition-all duration-300 hover:scale-105"
        style="
          background-color: rgba(245, 242, 235, 0.92);
          backdrop-filter: blur(16px);
          box-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
        "
      >
        Explorar Menú
      </a>
      <a
        href=""
        class="px-8 py-3.5 rounded-full font-medium text-cream transition-all duration-300 hover:scale-105"
        style="
          background-color: rgba(255, 255, 255, 0.1);
          backdrop-filter: blur(16px);
          border: 1px solid rgba(255, 255, 255, 0.25);
        "
      >
        Nuestra Historia
      </a>
    </div>
  </div>
</section>

<section id="menu" class="py-24 bg-cream">
  <!-- Contenedor principal con un diseño de cuadrícula para organizar el contenido -->
  <div class="max-w-7xl mx-auto px-6">
    <!-- Título de la sección con estilo centrado y decorativo -->
    <div class="text-center mb-14">
      <p
        class="text-sm font-medium tracking-[0.25em] uppercase mb-3"
        style="color: #b2571f"
      >
        Más solicitados
      </p>
      <h2
        class="font-serif text-4xl md:text-5xl text-charcoal font-semibold mb-4"
      >
        Favoritos de la casa
      </h2>
      <div class="w-12 h-px mx-auto" style="background-color: #d99a21"></div>
    </div>

    <!-- Grilla con los productos marcados como populares (${popularProducts}, viene del ProductService) -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
      <!--recorres each en ese div-->
      <div></div>
    </div>
    <!-- Botón para ver la carta completa (página /menu, se construye en el siguiente paso) -->
  </div>
</section>
<app-footer></app-footer>
