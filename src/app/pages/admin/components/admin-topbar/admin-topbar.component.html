<!-- Barra superior con título, campo de búsqueda y botón de acción -->
<div
  class="h-[60px] flex items-center justify-between gap-3 px-4 md:px-8 border-b flex-shrink-0"
  style="
    background-color: rgba(245, 242, 235, 0.85);
    backdrop-filter: blur(16px);
    border-color: rgba(44, 44, 44, 0.08);
    position: sticky;
    top: 0;
    z-index: 10;
  "
>
  <div class="flex items-center gap-2 min-w-0">
    <!-- Botón del menú: solo en móvil y tablet, abre la barra lateral -->
    <button
      id="btn-admin-menu"
      type="button"
      class="lg:hidden w-11 h-11 -ml-2 flex items-center justify-center rounded-full flex-shrink-0 cursor-pointer hover:bg-black/5"
      aria-label="Abrir menú"
      (click)="menuClicked.emit()"
    >
      <svg aria-hidden="true" focusable="false" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M4 7h16M4 12h16M4 17h16" />
      </svg>
    </button>

    <!-- Título definido desde el componente padre -->
    <h1 class="font-serif text-lg md:text-xl font-semibold text-charcoal truncate">
      {{ title }}
    </h1>
  </div>

  <div class="flex items-center gap-2 md:gap-3 min-w-0">
    <!-- Campo de búsqueda visible cuando showSearch está habilitado (en Orders no )-->
    @if (showSearch) {
      <app-search-input
        class="w-32 sm:w-48 min-w-0"
        variant="soft"
        placeholder="Buscar."
        (valueChange)="searchChanged.emit($event)"
      />
    }

    <!-- Botón de añadir visible cuando showAddButton está habilitado -->
    @if (showAddButton) {
      <app-button id="btn-add" size="sm" [attr.aria-label]="addLabel" (click)="addClicked.emit()">
        <!-- Icono de suma del botón -->
        <svg aria-hidden="true" focusable="false"
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M12 5v14M5 12h14" />
        </svg>

        <!-- En móvil el botón muestra solo el "+" para dejar sitio al buscador -->
        <span class="hidden md:inline">{{ addLabel }}</span>
      </app-button>
    }

    <!-- Paleta para daltonismo (el panel se abre debajo) -->
    <app-palette-picker variant="bar" class="flex-shrink-0" />

    <!-- Interruptor de tema claro / oscuro, en la esquina derecha -->
    <app-theme-switch [compact]="true" class="flex-shrink-0" />
  </div>
</div>
