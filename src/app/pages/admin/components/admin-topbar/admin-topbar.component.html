<!-- Barra superior con título, campo de búsqueda y botón de acción -->
<div
  class="min-h-[60px] flex flex-wrap items-center justify-between gap-x-3 gap-y-2 px-4 md:px-8 py-2 sm:py-0 border-b flex-shrink-0"
  style="
    background-color: rgba(245, 242, 235, 0.85);
    backdrop-filter: blur(16px);
    border-color: rgba(44, 44, 44, 0.08);
    position: sticky;
    top: 0;
    z-index: 10;
  "
>
  <div class="flex items-center gap-2 min-w-0">
    <!-- Botón del menú: solo en móvil y tablet, abre la barra lateral -->
    <button
      id="btn-admin-menu"
      type="button"
      class="lg:hidden w-11 h-11 -ml-2 flex items-center justify-center rounded-full flex-shrink-0 cursor-pointer hover:bg-black/5"
      aria-label="Abrir menú"
      (click)="menuClicked.emit()"
    >
      <svg aria-hidden="true" focusable="false" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M4 7h16M4 12h16M4 17h16" />
      </svg>
    </button>

    <!-- Título definido desde el componente padre -->
    <h1 class="font-serif text-lg md:text-xl font-semibold text-charcoal truncate">
      {{ title }}
    </h1>
  </div>

  <div class="flex items-center gap-2 md:gap-3 min-w-0">
    <!-- Campo de búsqueda visible cuando showSearch está habilitado (en Orders no )-->
    @if (showSearch) {
      <!-- Desde 640 px va en la fila; en pantallas más pequeñas, en su propia fila (abajo) -->
      <!-- (El div lleva las clases: el buscador fija su propio display y las anularía) -->
      <div class="hidden sm:block sm:w-48 min-w-0">
        <app-search-input
          variant="soft"
          placeholder="Buscar."
          (valueChange)="searchChanged.emit($event)"
        />
      </div>
    }

    <!-- Botón de añadir visible cuando showAddButton está habilitado -->
    @if (showAddButton) {
      <app-button id="btn-add" size="sm" [attr.aria-label]="addLabel" (click)="addClicked.emit()">
        <!-- Icono de suma del botón -->
        <svg aria-hidden="true" focusable="false"
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M12 5v14M5 12h14" />
        </svg>

        <!-- En móvil el botón muestra solo el "+" para dejar sitio al buscador -->
        <span class="hidden md:inline">{{ addLabel }}</span>
      </app-button>
    }

    <!-- Configuración (igual que en la web del cliente, pero sin idioma): tema claro/oscuro
         y paleta de accesibilidad se despliegan desde este único botón -->
    <app-settings-menu [showLanguage]="false" class="flex-shrink-0" />
  </div>

  <!-- Celular: el buscador ocupa una segunda fila completa. Junto al título, el "+", la
       paleta y el tema solo le quedaban unos 54 px y casi no se podía escribir. -->
  @if (showSearch) {
    <div class="sm:hidden basis-full min-w-0">
      <app-search-input
        variant="soft"
        placeholder="Buscar."
        (valueChange)="searchChanged.emit($event)"
      />
    </div>
  }
</div>
