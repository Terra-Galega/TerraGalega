<div
  class="h-[60px] flex items-center justify-between px-8 border-b flex-shrink-0"
  style="
    background-color: rgba(245, 242, 235, 0.85);
    backdrop-filter: blur(16px);
    border-color: rgba(44, 44, 44, 0.08);
    position: sticky;
    top: 0;
    z-index: 10;
  "
>
  <h1 class="font-serif text-xl font-semibold text-charcoal">
    {{ title }}
  </h1>

  <div class="flex items-center gap-3">
    <!-- BUSCADOR -->

    <div class="relative">
      <svg
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        class="absolute left-3 top-1/2 -translate-y-1/2"
        style="color: rgba(44, 44, 44, 0.35)"
      >
        <circle cx="11" cy="11" r="8" />

        <path d="M21 21l-4.35-4.35" />
      </svg>

      <input
        type="text"
        placeholder="Buscar…"
        (input)="onSearch($event)"
        class="pl-9 pr-4 py-2 rounded-full text-sm outline-none w-48"
        style="
          background-color: rgba(44, 44, 44, 0.07);
          border: 1px solid rgba(44, 44, 44, 0.1);
          color: #2c2c2c;
        "
      />
    </div>

    <!-- AÑADIR -->

    @if (showAddButton) {
      <button
        type="button"
        (click)="addProduct()"
        class="flex items-center gap-2 px-4 py-2 rounded-full text-sm font-medium text-white"
        style="
          background: linear-gradient(135deg, #b2571f, #8a2222);
          box-shadow: 0 2px 12px rgba(178, 87, 31, 0.3);
        "
      >
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M12 5v14M5 12h14" />
        </svg>

        Añadir producto
      </button>
    }
  </div>
</div>
