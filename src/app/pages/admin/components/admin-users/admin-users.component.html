<div id="admin-panel-users" class="admin-panel hidden-modal space-y-3">
  <!-- Mensaje si la lista de clientes está vacía -->
  @if (filteredClients.length === 0) {
    <p class="py-12 text-center" style="color: rgba(44, 44, 44, 0.45)">
      No se encontraron usuarios registrados.
    </p>
  } @else {
    <!-- Iteración dinámica sobre la lista de clientes filtrados. En móvil cada fila se reparte
         en dos líneas (datos arriba; rol y teléfono abajo); desde tablet, en una sola. -->
    @for (client of filteredClients; track client.id) {
      <div
        class="flex flex-wrap md:flex-nowrap items-center gap-x-4 md:gap-x-5 gap-y-3 px-4 md:px-6 py-4 rounded-2xl"
        style="
          background-color: rgba(255, 255, 255, 0.72);
          backdrop-filter: blur(20px);
          border: 1px solid rgba(255, 255, 255, 0.55);
        "
      >
        <!-- Avatar generado con la primera letra del nombre -->
        <div
          class="w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0 font-semibold text-white text-sm uppercase"
          style="background-color: #556141"
        >
          {{ client.name.substring(0, 1) }}
        </div>

        <!-- Información básica del cliente -->
        <!-- En móvil ocupa el resto de la primera línea, así lo demás baja a la segunda -->
        <div class="flex-1 min-w-0 basis-[calc(100%-3.5rem)] md:basis-0">
          <p
            class="font-medium text-charcoal text-sm"

          >{{ client.name }}</p>
          <p
            class="truncate"
            style="font-size: 12px; color: rgba(44, 44, 44, 0.45)"

          >{{ client.email }}</p>
        </div>

        <!-- Rol y teléfono del usuario -->
        <div class="flex items-center gap-3 md:gap-6 flex-shrink-0 pl-14 md:pl-0">
          <span
            class="text-[11px] font-medium px-3 py-1 rounded-full"
            style="
              background-color: rgba(44, 44, 44, 0.07);
              color: rgba(44, 44, 44, 0.55);
            "
            >Cliente</span
          >

          <!-- Muestra el teléfono o un mensaje si no está registrado -->
          <p
            style="font-size: 11px; color: rgba(44, 44, 44, 0.35)"
          >{{ client.phone != null ? client.phone : 'Sin teléfono' }}</p>
        </div>
      </div>
    }
  }
</div>
