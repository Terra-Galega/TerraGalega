<div
  class="fixed inset-0 z-50 flex items-center justify-center p-6"
  style="background-color: rgba(44, 44, 44, 0.65)"
>
  <div
    class="bg-cream w-full max-w-2xl rounded-3xl shadow-2xl overflow-hidden"
    style="max-height: 90vh"
  >
    <!-- HEADER -->

    <div
      class="p-6 border-b flex items-center justify-between"
      style="border-color: rgba(44, 44, 44, 0.1)"
    >
      <div>
        <h2 class="font-serif text-2xl font-semibold text-charcoal">
          @if (product) {
            Editar producto
          } @else {
            Añadir producto
          }
        </h2>

        <p class="text-xs mt-1" style="color: rgba(44, 44, 44, 0.5)">
          Completa la información del producto.
        </p>
      </div>

      <button
        type="button"
        (click)="close()"
        class="w-9 h-9 rounded-full flex items-center justify-center"
        style="color: rgba(44, 44, 44, 0.5)"
      >
        <svg
          class="w-5 h-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>
    </div>

    <!-- BODY -->

    <div class="p-6 overflow-y-auto" style="max-height: 65vh">
      <div class="grid md:grid-cols-2 gap-5">
        <!-- NOMBRE -->

        <div class="md:col-span-2">
          <label
            class="block text-[11px] font-medium uppercase tracking-wider mb-1.5"
          >
            Nombre
          </label>

          <input
            type="text"
            [value]="name"
            (input)="setName($event)"
            class="input-field w-full px-4 py-3 rounded-xl text-charcoal text-sm"
          />
        </div>

        <!-- PRECIO -->

        <div>
          <label
            class="block text-[11px] font-medium uppercase tracking-wider mb-1.5"
          >
            Precio
          </label>

          <input
            type="number"
            [value]="price"
            (input)="setPrice($event)"
            class="input-field w-full px-4 py-3 rounded-xl text-charcoal text-sm"
          />
        </div>

        <!-- CATEGORÍA -->

        <div>
          <label
            class="block text-[11px] font-medium uppercase tracking-wider mb-1.5"
          >
            Categoría
          </label>

          <input
            type="text"
            [value]="categoryName"
            (input)="setCategory($event)"
            class="input-field w-full px-4 py-3 rounded-xl text-charcoal text-sm"
          />
        </div>

        <!-- IMAGEN -->

        <div class="md:col-span-2">
          <label
            class="block text-[11px] font-medium uppercase tracking-wider mb-1.5"
          >
            URL de imagen
          </label>

          <input
            type="text"
            [value]="imageUrl"
            (input)="setImageUrl($event)"
            class="input-field w-full px-4 py-3 rounded-xl text-charcoal text-sm"
          />
        </div>

        <!-- DESCRIPCIÓN -->

        <div class="md:col-span-2">
          <label
            class="block text-[11px] font-medium uppercase tracking-wider mb-1.5"
          >
            Descripción
          </label>

          <textarea
            [value]="description"
            (input)="setDescription($event)"
            rows="4"
            class="input-field w-full px-4 py-3 rounded-xl text-charcoal text-sm resize-none"
          ></textarea>
        </div>
      </div>

      <!-- CARACTERÍSTICAS -->

      <div class="mt-7">
        <p class="text-[11px] font-medium uppercase tracking-wider mb-4">
          Características
        </p>

        <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
          <label class="flex items-center gap-2 text-sm">
            <input
              type="checkbox"
              [checked]="popular"
              (change)="popular = !popular"
            />

            Popular
          </label>

          <label class="flex items-center gap-2 text-sm">
            <input
              type="checkbox"
              [checked]="vegetarian"
              (change)="vegetarian = !vegetarian"
            />

            Vegetariano
          </label>

          <label class="flex items-center gap-2 text-sm">
            <input
              type="checkbox"
              [checked]="spicyMild"
              (change)="spicyMild = !spicyMild"
            />

            Picante suave
          </label>

          <label class="flex items-center gap-2 text-sm">
            <input
              type="checkbox"
              [checked]="spicyHot"
              (change)="spicyHot = !spicyHot"
            />

            Picante fuerte
          </label>

          <label class="flex items-center gap-2 text-sm">
            <input
              type="checkbox"
              [checked]="containsNuts"
              (change)="containsNuts = !containsNuts"
            />

            Frutos secos
          </label>

          <label class="flex items-center gap-2 text-sm">
            <input
              type="checkbox"
              [checked]="containsSeafood"
              (change)="containsSeafood = !containsSeafood"
            />

            Mariscos
          </label>

          <label class="flex items-center gap-2 text-sm">
            <input
              type="checkbox"
              [checked]="containsGluten"
              (change)="containsGluten = !containsGluten"
            />

            Gluten
          </label>

          <label class="flex items-center gap-2 text-sm">
            <input
              type="checkbox"
              [checked]="active"
              (change)="active = !active"
            />

            Activo
          </label>
        </div>
      </div>
    </div>

    <!-- FOOTER -->

    <div
      class="p-6 border-t flex justify-end gap-3"
      style="border-color: rgba(44, 44, 44, 0.1)"
    >
      <button
        type="button"
        (click)="close()"
        class="px-5 py-3 rounded-full text-sm font-medium"
        style="background-color: rgba(44, 44, 44, 0.06); color: #2c2c2c"
      >
        Cancelar
      </button>

      <button
        type="button"
        (click)="save()"
        class="px-6 py-3 rounded-full text-sm font-medium text-white btn-terra"
      >
        @if (product) {
          Guardar cambios
        } @else {
          Crear producto
        }
      </button>
    </div>
  </div>
</div>
