<div
  class="fixed inset-0 z-50 flex items-center justify-center p-4"
  style="background-color: rgba(44, 44, 44, 0.55)"
>
  <div
    class="bg-cream w-full max-w-xl max-h-[90vh] overflow-y-auto rounded-3xl p-8 relative"
  >
    <div class="flex items-center justify-between mb-7">
      <h2 class="font-serif text-2xl font-semibold text-charcoal">
        @if (product) {
          Editar producto
        } @else {
          Añadir producto
        }
      </h2>

      <button
        type="button"
        (click)="close()"
        class="w-9 h-9 rounded-full flex items-center justify-center"
        style="
          background-color: rgba(44, 44, 44, 0.06);
          color: rgba(44, 44, 44, 0.6);
        "
      >
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <div class="space-y-4">
      <!-- Nombre -->
      <div>
        <label
          class="block text-[11px] font-medium uppercase tracking-wider mb-1.5"
          style="color: rgba(44, 44, 44, 0.4)"
        >
          Nombre
        </label>

        <input
          type="text"
          [value]="name"
          (input)="setName($event)"
          required
          placeholder="Nombre del plato"
          class="input-field w-full px-4 py-3 rounded-xl text-sm text-charcoal"
        />
      </div>

      <!-- Precio + Categoría -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label
            class="block text-[11px] font-medium uppercase tracking-wider mb-1.5"
            style="color: rgba(44, 44, 44, 0.4)"
          >
            Precio (COP)
          </label>

          <input
            type="number"
            [value]="price"
            (input)="setPrice($event)"
            required
            placeholder="38900"
            class="input-field w-full px-4 py-3 rounded-xl text-sm text-charcoal"
          />
        </div>

        <div>
          <label
            class="block text-[11px] font-medium uppercase tracking-wider mb-1.5"
            style="color: rgba(44, 44, 44, 0.4)"
          >
            Categoría
          </label>

          <select
            [value]="categoryName"
            (change)="setCategory($event)"
            class="input-field w-full px-4 py-3 rounded-xl text-sm text-charcoal"
          >
            <option value="">Seleccionar categoría</option>

            @for (category of categories; track category.id) {
              <option [value]="category.name">
                {{ category.name }}
              </option>
            }
          </select>
        </div>
      </div>

      <!-- Descripción -->
      <div>
        <label
          class="block text-[11px] font-medium uppercase tracking-wider mb-1.5"
          style="color: rgba(44, 44, 44, 0.4)"
        >
          Descripción
        </label>

        <textarea
          [value]="description"
          (input)="setDescription($event)"
          rows="3"
          placeholder="Descripción del plato…"
          class="input-field w-full px-4 py-3 rounded-xl text-sm text-charcoal resize-none"
        ></textarea>
      </div>

      <!-- URL de imagen -->
      <div>
        <label
          class="block text-[11px] font-medium uppercase tracking-wider mb-1.5"
          style="color: rgba(44, 44, 44, 0.4)"
        >
          URL de imagen
        </label>

        <input
          type="url"
          [value]="imageUrl"
          (input)="setImageUrl($event)"
          required
          placeholder="https://images.unsplash.com/…"
          class="input-field w-full px-4 py-3 rounded-xl text-sm text-charcoal"
        />

        @if (imageUrl) {
          <img
            [src]="imageUrl"
            alt="preview"
            class="mt-2 w-full h-28 object-cover rounded-xl"
          />
        }
      </div>

      <!-- Características -->
      <div>
        <label
          class="block text-[11px] font-medium uppercase tracking-wider mb-2"
          style="color: rgba(44, 44, 44, 0.4)"
        >
          Características
        </label>

        <div class="grid grid-cols-2 gap-y-2 gap-x-3">
          <label class="flex items-center gap-3 cursor-pointer">
            <input
              type="checkbox"
              [checked]="popular"
              (change)="popular = !popular"
              class="w-4 h-4"
            />

            <span class="text-sm" style="color: rgba(44, 44, 44, 0.7)">
              Popular
            </span>
          </label>

          <label class="flex items-center gap-3 cursor-pointer">
            <input
              type="checkbox"
              [checked]="vegetarian"
              (change)="vegetarian = !vegetarian"
              class="w-4 h-4"
            />

            <span class="text-sm" style="color: rgba(44, 44, 44, 0.7)">
              Vegetariano
            </span>
          </label>

          <label class="flex items-center gap-3 cursor-pointer">
            <input
              type="checkbox"
              [checked]="spicyMild"
              (change)="spicyMild = !spicyMild"
              class="w-4 h-4"
            />

            <span class="text-sm" style="color: rgba(44, 44, 44, 0.7)">
              Picante ligero
            </span>
          </label>

          <label class="flex items-center gap-3 cursor-pointer">
            <input
              type="checkbox"
              [checked]="spicyHot"
              (change)="spicyHot = !spicyHot"
              class="w-4 h-4"
            />

            <span class="text-sm" style="color: rgba(44, 44, 44, 0.7)">
              Picante intenso
            </span>
          </label>

          <label class="flex items-center gap-3 cursor-pointer">
            <input
              type="checkbox"
              [checked]="containsNuts"
              (change)="containsNuts = !containsNuts"
              class="w-4 h-4"
            />

            <span class="text-sm" style="color: rgba(44, 44, 44, 0.7)">
              Contiene nueces
            </span>
          </label>

          <label class="flex items-center gap-3 cursor-pointer">
            <input
              type="checkbox"
              [checked]="containsSeafood"
              (change)="containsSeafood = !containsSeafood"
              class="w-4 h-4"
            />

            <span class="text-sm" style="color: rgba(44, 44, 44, 0.7)">
              Mariscos
            </span>
          </label>

          <label class="flex items-center gap-3 cursor-pointer">
            <input
              type="checkbox"
              [checked]="containsGluten"
              (change)="containsGluten = !containsGluten"
              class="w-4 h-4"
            />

            <span class="text-sm" style="color: rgba(44, 44, 44, 0.7)">
              Contiene gluten
            </span>
          </label>
        </div>
      </div>

      <!-- Botones -->
      <div class="flex gap-3 pt-2">
        <button
          type="button"
          (click)="close()"
          class="flex-1 py-3 rounded-xl text-sm font-medium"
          style="
            color: rgba(44, 44, 44, 0.6);
            border: 1px solid rgba(44, 44, 44, 0.12);
          "
        >
          Cancelar
        </button>

        <button
          type="button"
          (click)="save()"
          class="flex-1 py-3 rounded-xl text-sm font-medium text-white"
          style="
            background: linear-gradient(135deg, #b2571f, #8a2222);
            box-shadow: 0 4px 16px rgba(178, 87, 31, 0.3);
          "
        >
          @if (product) {
            Guardar cambios
          } @else {
            Añadir producto
          }
        </button>
      </div>
    </div>
  </div>
</div>
