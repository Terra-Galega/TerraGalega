<div
  class="fixed inset-0 z-50 flex items-center justify-center p-4"
  style="background-color: rgba(44, 44, 44, 0.55)"
>
  <div
    class="bg-cream w-full max-w-xl max-h-[90vh] overflow-y-auto rounded-3xl p-8 relative"
  >
    <div class="flex items-center justify-between mb-7">
      <h2 class="font-serif text-2xl font-semibold text-charcoal">
        {{ product ? "Editar producto" : "Añadir producto" }}
      </h2>

      <app-icon-button variant="soft" label="Cerrar" (click)="close()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 18L18 6M6 6l12 12" />
        </svg>
      </app-icon-button>
    </div>

    <div class="space-y-4">
      <app-form-field label="Nombre">
        <input
          type="text"
          [value]="name"
          (input)="setName($event)"
          required
          placeholder="Nombre del plato"
          class="input-field w-full px-4 py-3 rounded-xl text-sm text-charcoal"
        />
      </app-form-field>

      <div class="grid grid-cols-2 gap-3">
        <app-form-field label="Precio (COP)">
          <input
            type="number"
            [value]="price"
            (input)="setPrice($event)"
            required
            placeholder="38900"
            class="input-field w-full px-4 py-3 rounded-xl text-sm text-charcoal"
          />
        </app-form-field>

        <app-form-field label="Categoría">
          <select
            [value]="categoryName"
            (change)="setCategory($event)"
            class="input-field w-full px-4 py-3 rounded-xl text-sm text-charcoal"
          >
            <option value="">Seleccionar categoría</option>
            @for (category of categories; track category.id) {
              <option [value]="category.name">{{ category.name }}</option>
            }
          </select>
        </app-form-field>
      </div>

      <app-form-field label="Descripción">
        <textarea
          [value]="description"
          (input)="setDescription($event)"
          rows="3"
          placeholder="Descripción del plato…"
          class="input-field w-full px-4 py-3 rounded-xl text-sm text-charcoal resize-none"
        ></textarea>
      </app-form-field>

      <app-form-field label="URL de imagen">
        <input
          type="url"
          [value]="imageUrl"
          (input)="setImageUrl($event)"
          required
          placeholder="https://images.unsplash.com/…"
          class="input-field w-full px-4 py-3 rounded-xl text-sm text-charcoal"
        />

        @if (imageUrl) {
          <img [src]="imageUrl" alt="preview" class="mt-2 w-full h-28 object-cover rounded-xl" />
        }
      </app-form-field>

      <app-form-field label="Características">
        <div class="grid grid-cols-2 gap-y-2 gap-x-3">
          @for (check of checks; track check.key) {
            <app-check-option
              [label]="check.label"
              [checked]="isChecked(check.key)"
              (changed)="toggle(check.key)"
            />
          }
        </div>
      </app-form-field>

      <div class="flex gap-3 pt-2">
        <app-button class="flex-1" variant="neutral" [fullWidth]="true" (click)="close()">
          Cancelar
        </app-button>

        <app-button class="flex-1" [fullWidth]="true" (click)="save()">
          {{ product ? "Guardar cambios" : "Añadir producto" }}
        </app-button>
      </div>
    </div>
  </div>
</div>
