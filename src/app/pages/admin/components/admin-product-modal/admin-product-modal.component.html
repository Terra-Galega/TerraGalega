<!-- Fondo oscuro que cubre toda la pantalla y centra la ventana -->
<div
  class="fixed inset-0 z-50 flex items-center justify-center p-4"
  style="background-color: rgba(44, 44, 44, 0.55)"
>
  <!-- Ventana: si el formulario es muy alto, se desplaza por dentro -->
  <div
    class="bg-cream w-full max-w-xl max-h-[90vh] overflow-y-auto rounded-3xl p-8 relative"
  >
    <!-- Encabezado: el título cambia según se edite o se cree -->
    <div class="flex items-center justify-between mb-7">
      <h2 class="font-serif text-2xl font-semibold text-charcoal">
        {{ product ? "Editar producto" : "Añadir producto" }}
      </h2>

      <!-- Botón X para cerrar -->
      <app-icon-button variant="soft" label="Cerrar" (click)="close()">
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M6 18L18 6M6 6l12 12" />
        </svg>
      </app-icon-button>
    </div>

    <div class="space-y-4">
      <!-- Nombre -->
      <app-form-field label="Nombre">
        <input
          type="text"
          [value]="name"
          (input)="setName($event)"
          required
          placeholder="Nombre del plato"
          class="input-field w-full px-4 py-3 rounded-xl text-sm text-charcoal"
        />
      </app-form-field>

      <!-- Precio y categoría, lado a lado -->
      <div class="grid grid-cols-2 gap-3">
        <!-- El precio se redondea a múltiplos de 100 al salir del campo (blur) -->
        <app-form-field label="Precio (COP)">
          <input
            type="number"
            [value]="price"
            (blur)="setPrice($event)"
            required
            placeholder="38900"
            class="input-field w-full px-4 py-3 rounded-xl text-sm text-charcoal"
          />
        </app-form-field>

        <!-- La primera opción (valor vacío) muestra la categoría actual al
             editar; las demás salen de las categorías cargadas -->
        <app-form-field label="Categoría">
          <select
            [value]="categoryName"
            (change)="setCategory($event)"
            class="input-field w-full px-4 py-3 rounded-xl text-sm text-charcoal"
          >
            <option value="">{{ categoryName }}</option>
            @for (category of categories; track category.id) {
              <option [value]="category.name">{{ category.name }}</option>
            }
          </select>
        </app-form-field>
      </div>

      <!-- Descripción -->
      <app-form-field label="Descripción">
        <textarea
          [value]="description"
          (input)="setDescription($event)"
          rows="3"
          placeholder="Descripción del plato…"
          class="input-field w-full px-4 py-3 rounded-xl text-sm text-charcoal resize-none"
        ></textarea>
      </app-form-field>

      <!-- URL de la imagen, con vista previa si ya hay una URL escrita -->
      <app-form-field label="URL de imagen">
        <input
          type="url"
          [value]="imageUrl"
          (input)="setImageUrl($event)"
          required
          placeholder="https://images.unsplash.com/…"
          class="input-field w-full px-4 py-3 rounded-xl text-sm text-charcoal"
        />

        @if (imageUrl) {
          <img
            [src]="imageUrl"
            alt="preview"
            class="mt-2 w-full h-28 object-cover rounded-xl"
          />
        }
      </app-form-field>

      <!-- Características: casillas generadas desde la lista "checks"
           (Popular + características del plato), en 2 columnas -->
      <app-form-field label="Características">
        <div class="grid grid-cols-2 gap-y-2 gap-x-3">
          @for (check of checks; track check.key) {
            <app-check-option
              [label]="check.label"
              [checked]="isChecked(check.key)"
              (changed)="toggle(check.key)"
            />
          }
        </div>
      </app-form-field>

      <!-- Estado: si el producto está activo (visible en la carta) -->
      <app-form-field label="Estado">
        <app-check-option
          label="Activo"
          [checked]="active"
          (changed)="toggleActive()"
        />
      </app-form-field>

      <!-- Error de validación o del servidor -->
      @if (errorMessage) {
        <p class="text-sm text-red-600">{{ errorMessage }}</p>
      }

      <!-- Botones: Cancelar y Guardar -->
      <div class="flex gap-3 pt-2">
        <app-button
          class="flex-1"
          variant="neutral"
          [fullWidth]="true"
          (click)="close()"
        >
          Cancelar
        </app-button>

        <app-button class="flex-1" [fullWidth]="true" (click)="save()">
          {{ product ? "Guardar cambios" : "Añadir producto" }}
        </app-button>
      </div>
    </div>
  </div>
</div>
