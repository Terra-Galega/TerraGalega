<!-- Fondo oscuro que cubre toda la pantalla y centra la ventana -->
<div
  class="fixed inset-0 z-50 flex items-center justify-center p-4"
  style="background-color: rgba(44, 44, 44, 0.55)"
>
  <!-- Ventana: si el formulario es muy alto, se desplaza por dentro -->
  <div
    class="bg-cream w-full max-w-xl max-h-[90vh] overflow-y-auto rounded-3xl p-8 relative"
  >
    <!-- Encabezado: el título cambia según se edite o se cree -->
    <div class="flex items-center justify-between mb-7">
      <h2 class="font-serif text-2xl font-semibold text-charcoal">
        {{ addon ? "Editar adicional" : "Añadir adicional" }}
      </h2>

      <!-- Botón X para cerrar -->
      <app-icon-button variant="soft" label="Cerrar" (click)="close()">
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M6 18L18 6M6 6l12 12" />
        </svg>
      </app-icon-button>
    </div>

    <div class="space-y-4">
      <!-- Nombre -->
      <app-form-field label="Nombre">
        <input
          type="text"
          [value]="name"
          (input)="setName($event)"
          required
          placeholder="Nombre del adicional"
          class="input-field w-full px-4 py-3 rounded-xl text-sm text-charcoal"
        />
      </app-form-field>

      <!-- Precio: se redondea a múltiplos de 50 al salir del campo (blur) -->
      <app-form-field label="Precio (COP)">
        <input
          type="number"
          min="0"
          [value]="price"
          (blur)="setPrice($event)"
          required
          placeholder="3000"
          class="input-field w-full px-4 py-3 rounded-xl text-sm text-charcoal"
        />
      </app-form-field>

      <!-- Descripción -->
      <app-form-field label="Descripción">
        <textarea
          [value]="description"
          (input)="setDescription($event)"
          rows="3"
          placeholder="Descripción del adicional…"
          class="input-field w-full px-4 py-3 rounded-xl text-sm text-charcoal resize-none"
        ></textarea>
      </app-form-field>

      <!-- Categorías donde se ofrece el adicional: una casilla por categoría,
           en 2 columnas -->
      <app-form-field label="Categorías donde aparece">
        <div class="grid grid-cols-2 gap-y-2 gap-x-3">
          @for (category of categories; track category.id) {
            <app-check-option
              [label]="category.name"
              [checked]="isCategorySelected(category.id)"
              (changed)="toggleCategory(category.id)"
            />
          }
        </div>
      </app-form-field>

      <!-- Estado: si el adicional está activo (disponible para los clientes) -->
      <app-form-field label="Estado">
        <app-check-option
          label="Activo"
          [checked]="active"
          (changed)="toggleActive()"
        />
      </app-form-field>

      <!-- Error de validación o del servidor -->
      @if (errorMessage) {
        <p class="text-sm" style="color: #da5858">{{ errorMessage }}</p>
      }

      <!-- Botones: Cancelar y Guardar -->
      <div class="flex gap-3 pt-2">
        <app-button
          class="flex-1"
          variant="neutral"
          [fullWidth]="true"
          (click)="close()"
        >
          Cancelar
        </app-button>

        <app-button class="flex-1" [fullWidth]="true" (click)="save()">
          {{ addon ? "Guardar cambios" : "Añadir adicional" }}
        </app-button>
      </div>
    </div>
  </div>
</div>
