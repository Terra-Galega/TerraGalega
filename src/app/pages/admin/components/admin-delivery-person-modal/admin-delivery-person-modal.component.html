<div
  class="fixed inset-0 z-50 flex items-center justify-center p-4"
  style="background-color: rgba(44, 44, 44, 0.55)"
>
  <div
    class="bg-cream w-full max-w-xl max-h-[90vh] overflow-y-auto rounded-3xl p-8 relative"
  >
    <div class="flex items-center justify-between mb-7">
      <h2 class="font-serif text-2xl font-semibold text-charcoal">
        {{ deliveryPerson ? "Editar domiciliario" : "Añadir domiciliario" }}
      </h2>

      <app-icon-button variant="soft" label="Cerrar" (click)="close()">
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M6 18L18 6M6 6l12 12" />
        </svg>
      </app-icon-button>
    </div>

    <div class="space-y-4">
      <div class="grid grid-cols-2 gap-4">
        <app-form-field label="Nombre">
          <input
            type="text"
            [value]="form.name"
            (input)="form.name = $any($event.target).value"
            placeholder="Pedro"
            class="input-field w-full px-4 py-3 rounded-xl text-sm text-charcoal"
          />
        </app-form-field>

        <app-form-field label="Apellido">
          <input
            type="text"
            [value]="form.lastName"
            (input)="form.lastName = $any($event.target).value"
            placeholder="Sánchez"
            class="input-field w-full px-4 py-3 rounded-xl text-sm text-charcoal"
          />
        </app-form-field>
      </div>

      <app-form-field label="Correo electrónico">
        <input
          type="email"
          [value]="form.email"
          (input)="form.email = $any($event.target).value"
          placeholder="domiciliario@terragalega.com"
          class="input-field w-full px-4 py-3 rounded-xl text-sm text-charcoal"
        />
      </app-form-field>

      <div class="grid grid-cols-2 gap-4">
        <app-form-field label="Identificación">
          <input
            type="text"
            [value]="form.identification"
            (input)="form.identification = $any($event.target).value"
            placeholder="1000123456"
            class="input-field w-full px-4 py-3 rounded-xl text-sm text-charcoal"
          />
        </app-form-field>

        <app-form-field label="Teléfono">
          <input
            type="tel"
            [value]="form.phone"
            (input)="form.phone = $any($event.target).value"
            placeholder="3001234567"
            class="input-field w-full px-4 py-3 rounded-xl text-sm text-charcoal"
          />
        </app-form-field>
      </div>

      <app-form-field
        [label]="deliveryPerson ? 'Nueva contraseña (opcional)' : 'Contraseña'"
      >
        <input
          type="password"
          [value]="form.password"
          (input)="form.password = $any($event.target).value"
          [placeholder]="
            deliveryPerson
              ? 'Déjala vacía para conservar la actual'
              : 'Contraseña'
          "
          class="input-field w-full px-4 py-3 rounded-xl text-sm text-charcoal"
        />
      </app-form-field>

      <app-form-field label="Estado">
        <app-check-option
          label="Activo (disponible para recibir pedidos)"
          [checked]="form.active"
          (changed)="toggleActive()"
        />
      </app-form-field>

      @if (errorMessage) {
        <p class="text-sm" style="color: #da5858">{{ errorMessage }}</p>
      }

      <div class="flex gap-3 pt-2">
        <app-button
          class="flex-1"
          variant="neutral"
          [fullWidth]="true"
          (click)="close()"
        >
          Cancelar
        </app-button>

        <app-button class="flex-1" [fullWidth]="true" (click)="save()">
          {{ deliveryPerson ? "Guardar cambios" : "Añadir domiciliario" }}
        </app-button>
      </div>
    </div>
  </div>
</div>
