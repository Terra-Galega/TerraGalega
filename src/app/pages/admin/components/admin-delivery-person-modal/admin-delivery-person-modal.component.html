<!-- Fondo oscuro que cubre toda la pantalla) -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-4" style="background-color: rgba(44, 44, 44, 0.55)">
  <!-- Caja del modal -->
  <div class="bg-cream w-full max-w-xl max-h-[90vh] overflow-y-auto rounded-3xl p-8 relative">
    <!-- Encabezado: el título cambia según sea edición o creación, y botón X para cerrar -->
    <div class="flex items-center justify-between mb-7">
      <h2 class="font-serif text-2xl font-semibold text-charcoal">
        {{ deliveryPerson ? "Editar domiciliario" : "Añadir domiciliario" }}
      </h2>

      <app-icon-button variant="soft" label="Cerrar" (click)="close()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 18L18 6M6 6l12 12" />
        </svg>
      </app-icon-button>
    </div>

    <!-- Formulario. Los inputs usan [value] + (input) para actualizar `form` a mano (sin ngModel) -->
    <div class="space-y-4">
      <!-- Nombre y apellido en dos columnas -->
      <div class="grid grid-cols-2 gap-4">
        <app-form-field label="Nombre">
          <input type="text" [value]="form.name" (input)="form.name = $any($event.target).value" placeholder="Pedro"
            class="input-field w-full px-4 py-3 rounded-xl text-sm text-charcoal" />
        </app-form-field>

        <app-form-field label="Apellido">
          <input type="text" [value]="form.lastName" (input)="form.lastName = $any($event.target).value"
            placeholder="Sánchez" class="input-field w-full px-4 py-3 rounded-xl text-sm text-charcoal" />
        </app-form-field>
      </div>

      <!-- Correo (se valida el formato en save()) -->
      <app-form-field label="Correo electrónico">
        <input type="email" [value]="form.email" (input)="form.email = $any($event.target).value"
          placeholder="domiciliario@terragalega.com"
          class="input-field w-full px-4 py-3 rounded-xl text-sm text-charcoal" />
      </app-form-field>

      <!-- Identificación y teléfono en dos columnas -->
      <div class="grid grid-cols-2 gap-4">
        <app-form-field label="Identificación">
          <input type="text" [value]="form.identification" (input)="form.identification = $any($event.target).value"
            placeholder="1000123456" class="input-field w-full px-4 py-3 rounded-xl text-sm text-charcoal" />
        </app-form-field>

        <app-form-field label="Teléfono">
          <input type="tel" [value]="form.phone" (input)="form.phone = $any($event.target).value"
            placeholder="3001234567" class="input-field w-full px-4 py-3 rounded-xl text-sm text-charcoal" />
        </app-form-field>
      </div>

      <!-- Contraseña:
          - Editando: no se muestra el valor; solo un botón que le pide al padre abrir el modal de cambio de contraseña.
          - Creando: campo normal, obligatorio. -->
      @if (deliveryPerson) {
      <app-form-field label="Contraseña">
        <div class="input-field w-full px-4 py-2.5 rounded-xl text-sm flex items-center justify-between gap-3">
          <span class="flex items-center gap-2" style="color: rgba(44, 44, 44, 0.4)">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round">
              <path
                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
            ••••••••
          </span>

          <button type="button" (click)="changePassword.emit()"
            class="text-xs font-semibold px-3 py-1.5 rounded-lg cursor-pointer whitespace-nowrap transition-opacity hover:opacity-70"
            style="background-color: rgba(178, 87, 31, 0.1); color: #b2571f">
            Cambiar contraseña
          </button>
        </div>
      </app-form-field>
      } @else {
      <app-form-field label="Contraseña">
        <input type="password" [value]="form.password" (input)="form.password = $any($event.target).value"
          placeholder="Contraseña" class="input-field w-full px-4 py-3 rounded-xl text-sm text-charcoal" />
      </app-form-field>
      }

      <!-- Si está inactivo no aparecerá al asignar pedidos -->
      <app-form-field label="Estado">
        <app-check-option label="Activo (disponible para recibir pedidos)" [checked]="form.active"
          (changed)="toggleActive()" />
      </app-form-field>

      <!-- Mensaje de validación o de error del servidor -->
      @if (errorMessage) {
      <p class="text-sm" style="color: #da5858">{{ errorMessage }}</p>
      }

      <!-- Botones de acción: cancelar y guardar (el texto cambia según el modo) -->
      <div class="flex gap-3 pt-2">
        <app-button class="flex-1" variant="neutral" [fullWidth]="true" (click)="close()">
          Cancelar
        </app-button>

        <app-button class="flex-1" [fullWidth]="true" (click)="save()">
          {{ deliveryPerson ? "Guardar cambios" : "Añadir domiciliario" }}
        </app-button>
      </div>
    </div>
  </div>
</div>
