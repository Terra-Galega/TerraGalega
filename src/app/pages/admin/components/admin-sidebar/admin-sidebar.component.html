<!-- Fondo oscuro detrás del menú en móvil y tablet: al tocarlo se cierra -->
@if (open) {
  <div
    class="admin-sidebar-backdrop"
    (click)="closed.emit()"
    aria-hidden="true"
  ></div>
}

<!-- Barra lateral del panel. En escritorio (1024 px o más) está siempre fija a la izquierda;
     en móvil y tablet es un panel deslizante que se abre con el botón de la barra superior. -->
<aside
  id="admin-sidebar"
  class="admin-sidebar flex flex-col py-7 px-4"
  [class.open]="open"
>
  <!-- Logotipo y nombre del panel administrativo -->
  <div class="px-3 mb-10 flex flex-col items-start">
    <a class="flex flex-col items-start leading-none select-none">
      <span class="font-terra text-2xl leading-[0.6]" style="color: #f5f2eb">
        Terra
      </span>

      <span
        class="font-galega text-sm tracking-[0.22em] uppercase font-semibold -mt-1"
        style="color: #f5f2eb"
      >
        Galega
      </span>
    </a>

    <p
      class="text-[10px] tracking-widest uppercase mt-2"
      style="color: rgba(245, 242, 235, 0.25)"
    >
      Panel admin
    </p>
  </div>

  <!-- Opciones de navegación entre las secciones del panel -->
  <nav class="flex flex-col gap-1 flex-1 min-h-0 overflow-y-auto">
    <!-- Acceso al dashboard (resumen de ventas) -->
    <button
      [attr.aria-current]="activeTab === 'dashboard' ? 'page' : null"
      id="tab-dashboard"
      type="button"
      (click)="changeTab('dashboard')"
      class="admin-tab-btn flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-left"
      [class.active]="activeTab === 'dashboard'"
    >
      <svg
        aria-hidden="true"
        focusable="false"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
      >
        <rect x="3" y="3" width="7" height="9" rx="1" />
        <rect x="14" y="3" width="7" height="5" rx="1" />
        <rect x="14" y="12" width="7" height="9" rx="1" />
        <rect x="3" y="16" width="7" height="5" rx="1" />
      </svg>

      Dashboard
    </button>
    <!-- Acceso a la sección de productos -->
    <button
      [attr.aria-current]="activeTab === 'products' ? 'page' : null"
      id="tab-products"
      type="button"
      (click)="changeTab('products')"
      class="admin-tab-btn flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-left"
      [class.active]="activeTab === 'products'"
    >
      <svg
        aria-hidden="true"
        focusable="false"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
      >
        <path
          d="M20 7H4a1 1 0 00-1 1v11a1 1 0 001 1h16a1 1 0 001-1V8a1 1 0 00-1-1z"
        />
        <path d="M16 3H8a1 1 0 00-1 1v3h10V4a1 1 0 00-1-1z" />
      </svg>

      Productos
    </button>

    <!-- Acceso a la sección de categorías -->
    <button
      [attr.aria-current]="activeTab === 'categories' ? 'page' : null"
      type="button"
      (click)="changeTab('categories')"
      class="admin-tab-btn flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-left"
      [class.active]="activeTab === 'categories'"
    >
      <svg
        aria-hidden="true"
        focusable="false"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
      >
        <path d="M4 6h16M4 12h16M4 18h16" />
      </svg>

      Categorías
    </button>

    <!-- Acceso a la sección de adicionales -->
    <button
      [attr.aria-current]="activeTab === 'addons' ? 'page' : null"
      id="tab-addons"
      type="button"
      (click)="changeTab('addons')"
      class="admin-tab-btn flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-left"
      [class.active]="activeTab === 'addons'"
    >
      <svg
        aria-hidden="true"
        focusable="false"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
      >
        <circle cx="12" cy="12" r="9" />
        <path d="M12 8v8M8 12h8" />
      </svg>

      Adicionales
    </button>

    <!-- Acceso a la sección de cupones -->
    <button
      [attr.aria-current]="activeTab === 'coupons' ? 'page' : null"
      id="tab-coupons"
      type="button"
      (click)="changeTab('coupons')"
      class="admin-tab-btn flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-left"
      [class.active]="activeTab === 'coupons'"
    >
      <svg
        aria-hidden="true"
        focusable="false"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
      >
        <path
          d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"
        />
        <circle cx="7" cy="7" r="1" />
      </svg>

      Cupones
    </button>

    <!-- Acceso a la sección de anuncios del inicio -->
    <button
      [attr.aria-current]="activeTab === 'announcements' ? 'page' : null"
      id="tab-announcements"
      type="button"
      (click)="changeTab('announcements')"
      class="admin-tab-btn flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-left"
      [class.active]="activeTab === 'announcements'"
    >
      <svg
        aria-hidden="true"
        focusable="false"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
      >
        <path d="M3 11v2a1 1 0 001 1h2l5 4V6L6 10H4a1 1 0 00-1 1z" />
        <path d="M15.5 8.5a5 5 0 010 7M18.5 5.5a9 9 0 010 13" />
      </svg>

      Anuncios
    </button>

    <!-- Acceso a la sección de reseñas -->
    <button
      [attr.aria-current]="activeTab === 'reviews' ? 'page' : null"
      id="tab-reviews"
      type="button"
      (click)="changeTab('reviews')"
      class="admin-tab-btn flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-left"
      [class.active]="activeTab === 'reviews'"
    >
      <svg
        aria-hidden="true"
        focusable="false"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
      >
        <path
          d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"
        />
      </svg>

      Reseñas
    </button>

    <!-- Acceso a la sección de órdenes -->
    <button
      [attr.aria-current]="activeTab === 'orders' ? 'page' : null"
      type="button"
      (click)="changeTab('orders')"
      class="admin-tab-btn flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-left"
      [class.active]="activeTab === 'orders'"
    >
      <svg
        aria-hidden="true"
        focusable="false"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
      >
        <path
          d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"
        />
      </svg>

      Órdenes a domicilio
    </button>

    <!-- Acceso a las órdenes en punto físico (las que toman los meseros desde la app) -->
    <button
      [attr.aria-current]="activeTab === 'tableOrders' ? 'page' : null"
      id="tab-table-orders"
      type="button"
      (click)="changeTab('tableOrders')"
      class="admin-tab-btn flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-left"
      [class.active]="activeTab === 'tableOrders'"
    >
      <svg
        aria-hidden="true"
        focusable="false"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
      >
        <path d="M3 10h18M5 10v10M19 10v10M8 10V6h8v4" />
      </svg>

      Órdenes a la mesa
    </button>

    <!-- Acceso a la sección de usuarios -->
    <button
      [attr.aria-current]="activeTab === 'users' ? 'page' : null"
      type="button"
      (click)="changeTab('users')"
      class="admin-tab-btn flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-left"
      [class.active]="activeTab === 'users'"
    >
      <svg
        aria-hidden="true"
        focusable="false"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
      >
        <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" />
        <circle cx="9" cy="7" r="4" />
        <path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75" />
      </svg>

      Usuarios
    </button>

    <!-- Acceso a la sección de operadores -->
    <button
      [attr.aria-current]="activeTab === 'operators' ? 'page' : null"
      type="button"
      (click)="changeTab('operators')"
      class="admin-tab-btn flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-left"
      [class.active]="activeTab === 'operators'"
    >
      <svg
        aria-hidden="true"
        focusable="false"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
      >
        <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" />
        <circle cx="9" cy="7" r="4" />
        <path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75" />
      </svg>

      Operadores
    </button>

    <!-- Acceso a la sección de domiciliarios -->
    <button
      [attr.aria-current]="activeTab === 'deliveries' ? 'page' : null"
      type="button"
      (click)="changeTab('deliveries')"
      class="admin-tab-btn flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-left"
      [class.active]="activeTab === 'deliveries'"
    >
      <svg
        aria-hidden="true"
        focusable="false"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
      >
        <circle cx="6" cy="17" r="3" />
        <circle cx="18" cy="17" r="3" />
        <path d="M6 17l3-7h5l4 7M9 10L8 7H5" />
      </svg>

      Domiciliarios
    </button>
  </nav>

  <!-- Información del administrador y opción para cerrar sesión -->
  <div
    class="px-4 py-4 rounded-xl mt-4 flex-shrink-0"
    style="background-color: rgba(255, 255, 255, 0.04)"
  >
    <p class="text-sm font-medium" style="color: rgba(245, 242, 235, 0.8)">
      {{ adminName }}
    </p>

    <p class="text-[11px] mb-3" style="color: rgba(245, 242, 235, 0.4)">
      Administrador
    </p>

    <!-- Solicita al componente padre gestionar el cierre de sesión -->
    <button
      type="button"
      (click)="logout()"
      class="admin-logout-btn flex items-center gap-2 px-4 py-1 text-[12px] font-medium rounded-xl"
      style="color: #da5858"
    >
      <svg
        aria-hidden="true"
        focusable="false"
        width="13"
        height="13"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" />
        <path d="M16 17l5-5-5-5" />
        <path d="M21 12H9" />
      </svg>

      Cerrar sesión
    </button>
  </div>
</aside>
