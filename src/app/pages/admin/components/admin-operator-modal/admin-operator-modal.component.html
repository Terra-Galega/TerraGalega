<div class="fixed inset-0 z-50 flex items-center justify-center p-4" style="background-color: rgba(44, 44, 44, 0.55)">
  <div class="bg-cream w-full max-w-xl max-h-[90vh] overflow-y-auto rounded-3xl p-8 relative">
    <div class="flex items-center justify-between mb-7">
      <h2 class="font-serif text-2xl font-semibold text-charcoal">
        {{ operator ? "Editar operador" : "Añadir operador" }}
      </h2>

      <app-icon-button variant="soft" label="Cerrar" (click)="close()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 18L18 6M6 6l12 12" />
        </svg>
      </app-icon-button>
    </div>

    <div class="space-y-4">
      <div class="grid grid-cols-2 gap-4">
        <app-form-field label="Nombre">
          <input type="text" [value]="name" (input)="setName($event)" required placeholder="Nombre"
            class="input-field w-full px-4 py-3 rounded-xl text-sm text-charcoal" />
        </app-form-field>

        <app-form-field label="Apellido">
          <input type="text" [value]="lastName" (input)="setLastName($event)" required placeholder="Apellido"
            class="input-field w-full px-4 py-3 rounded-xl text-sm text-charcoal" />
        </app-form-field>
      </div>

      <app-form-field label="Usuario">
        <input type="text" [value]="username" (input)="setUsername($event)" required placeholder="Nombre de usuario"
          class="input-field w-full px-4 py-3 rounded-xl text-sm text-charcoal" />
      </app-form-field>

      <app-form-field label="Correo electrónico">
        <input type="email" [value]="email" (input)="setEmail($event)" required placeholder="correo@terra.com"
          class="input-field w-full px-4 py-3 rounded-xl text-sm text-charcoal" />
      </app-form-field>

      @if (operator) {<app-form-field label="Contraseña">
        <div class="input-field w-full px-4 py-2.5 rounded-xl text-sm flex items-center justify-between gap-3">
          <span class="flex items-center gap-2" style="color: rgba(44, 44, 44, 0.4)">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round">
              <path
                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
            ••••••••
          </span>

          <button type="button" (click)="changePassword.emit()"
            class="text-xs font-semibold px-3 py-1.5 rounded-lg cursor-pointer whitespace-nowrap transition-opacity hover:opacity-70"
            style="background-color: rgba(178, 87, 31, 0.1); color: #b2571f">
            Cambiar contraseña
          </button>
        </div>
      </app-form-field>} @else {
      <app-form-field label="Contraseña">
        <input type="password" [value]="password" (input)="setPassword($event)" placeholder="Contraseña"
          class="input-field w-full px-4 py-3 rounded-xl text-sm text-charcoal" />
      </app-form-field>
      }

      <app-form-field label="Estado">
        <select (change)="setActive($event)" class="input-field w-full px-4 py-3 rounded-xl text-sm text-charcoal">
          <option value="true" [selected]="active">Activo</option>
          <option value="false" [selected]="!active">Inactivo</option>
        </select>
      </app-form-field>

      @if (errorMessage) {
      <p class="text-sm" style="color: #da5858">{{ errorMessage }}</p>
      }

      <div class="flex gap-3 pt-2">
        <app-button class="flex-1" variant="neutral" [fullWidth]="true" (click)="close()">
          Cancelar
        </app-button>

        <app-button class="flex-1" [fullWidth]="true" (click)="save()">
          {{ operator ? "Guardar cambios" : "Añadir operador" }}
        </app-button>
      </div>
    </div>
  </div>
</div>
