<div class="rounded-2xl overflow-hidden" style="background-color: rgba(255, 255, 255, 0.6); box-shadow: 0 2px 12px rgba(44, 44, 44, 0.05)">
  <div class="overflow-x-auto">
    <table class="w-full text-sm" style="border-collapse: collapse">
      <thead>
        <tr style="background-color: rgba(44, 44, 44, 0.04)">
          @for (column of columns; track column) {
            <th class="text-left font-medium uppercase tracking-wider py-3 px-5" style="font-size: 11px; color: rgba(44, 44, 44, 0.45)">
              {{ column }}
            </th>
          }
        </tr>
      </thead>

      <tbody>
        @for (product of filteredProducts; track product.id) {
          <tr
            app-admin-product-row
            [product]="product"
            (toggle)="toggleProduct($event)"
            (edit)="openEdit($event)"
            (remove)="removeProduct($event)"
          ></tr>
        } @empty {
          <tr>
            <td [attr.colspan]="columns.length">
             <app-empty-state [compact]="true" message="No se encontraron productos" />
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
