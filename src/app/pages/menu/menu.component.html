<app-navbar></app-navbar>

<main class="min-h-screen pt-32 pb-28 max-w-7xl mx-auto px-6 md:px-8">
  <!-- =========================================================
       ENCABEZADO
       ========================================================= -->

  <div
    class="flex flex-col md:flex-row md:items-end justify-between gap-6 mb-14"
  >
    <div>
      <p
        class="text-[12px] font-medium tracking-[0.3em] uppercase mb-2"
        style="color: #b2571f"
      >
        Lo que ofrecemos
      </p>

      <h1 class="font-serif text-5xl font-bold text-charcoal">Nuestra Carta</h1>
    </div>

    <!-- Buscador -->
    <div class="relative w-full md:w-72">
      <svg
        class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4"
        style="color: rgba(44, 44, 44, 0.35)"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M21 21l-4.35-4.35M11 19a8 8 0 100-16 8 8 0 000 16z"
        ></path>
      </svg>
      <input
        type="text"
        id="menu-search"
        placeholder="Buscar platos…"
        class="search-glass w-full pl-11 pr-5 py-3 rounded-full text-sm text-charcoal border border-charcoal/30"
      />
    </div>
  </div>

  <!-- =========================================================
       CATEGORÍAS + FILTRO
       ========================================================= -->

  <div class="flex items-center gap-3 mb-12">
    <!-- Categorías -->
    <div class="flex gap-2.5 overflow-x-auto pb-1 flex-1">
      @for (category of categories; track category) {
        <button
          type="button"
          class="category-btn whitespace-nowrap px-6 py-2.5 rounded-full text-[13px] font-medium"
          [class.active]="currentCategory === category"
          (click)="selectCategory(category)"
        >
          {{ category }}
        </button>
      }
    </div>

    <!-- Botón filtro -->
    <div class="relative flex-shrink-0">
      <button
        type="button"
        class="feature-filter-btn w-12 h-12 rounded-full flex items-center justify-center"
        [class.active]="hasActiveFeatureFilters"
        [attr.aria-expanded]="featureFilterOpen"
        aria-haspopup="true"
        title="Filtrar por características"
        (click)="toggleFeatureFilter()"
      >
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
          <path
            fill-rule="evenodd"
            clip-rule="evenodd"
            d="M2.25 6C2.25 5.58579 2.58579 5.25 3 5.25H21C21.4142 5.25 21.75 5.58579 21.75 6C21.75 6.41421 21.4142 6.75 21 6.75H3C2.58579 6.75 2.25 6.41421 2.25 6Z"
          />

          <path
            fill-rule="evenodd"
            clip-rule="evenodd"
            d="M4.25 12C4.25 11.5858 4.58579 11.25 5 11.25H19C19.4142 11.25 19.75 11.5858 19.75 12C19.75 12.41421 19.4142 12.75 19 12.75H5C4.58579 12.75 4.25 12.41421 4.25 12Z"
          />

          <path
            fill-rule="evenodd"
            clip-rule="evenodd"
            d="M6.25 18C6.25 17.58579 6.58579 17.25 7 17.25H17C17.4142 17.25 17.75 17.58579 17.75 18C17.75 18.41421 17.4142 18.75 17 18.75H7C6.58579 18.75 6.25 18.41421 6.25 18Z"
          />
        </svg>
      </button>

      <!-- =====================================================
           PANEL DE FILTROS
           ===================================================== -->

      @if (featureFilterOpen) {
        <div
          class="feature-filter-panel rounded-2xl p-5 absolute right-0 mt-3 z-30"
        >
          <p
            class="text-[11px] font-semibold tracking-[0.2em] uppercase mb-4"
            style="color: rgba(44, 44, 44, 0.4)"
          >
            Filtrar por
          </p>

          <div class="flex items-center justify-between mb-3">
            <p class="text-sm font-semibold text-charcoal">Características</p>

            <button
              type="button"
              class="text-[12px] font-medium hover:underline"
              style="color: rgba(44, 44, 44, 0.4)"
              (click)="clearFeatureFilters()"
            >
              Limpiar
            </button>
          </div>

          <div class="space-y-2.5 mb-5">
            <!-- Vegetariano -->
            <label
              class="feature-filter-option flex items-center gap-3 cursor-pointer"
            >
              <input
                type="checkbox"
                class="w-4 h-4"
                [checked]="isFeatureSelected('vegetarian')"
                (change)="toggleFeature('vegetarian')"
              />

              <svg
                class="w-4 h-4 flex-shrink-0"
                viewBox="0 0 512 512"
                style="fill: #556141"
              >
                <path
                  d="M389.053,126.3A302.909,302.909,0,0,0,280.012,18.15L272,13.516l-8.012,4.634A301.084,301.084,0,0,0,113.4,279.042c0,3.445.06,6.944.177,10.4,1.592,46.856,19.511,86.283,51.82,114.018,24.724,21.225,56.438,34.182,90.607,37.273V496h32V240H256V408.528c-54.064-6.263-107.873-44.455-110.444-120.174-.106-3.095-.16-6.228-.16-9.312A270.286,270.286,0,0,1,272,50.673,270.286,270.286,0,0,1,398.6,279.042c0,3.084-.054,6.217-.16,9.313-2.056,60.573-36.907,97.127-78.444,112.536v33.867a156.188,156.188,0,0,0,58.607-31.3c32.309-27.735,50.228-67.162,51.82-114.017.117-3.456.177-6.955.177-10.4A300.948,300.948,0,0,0,389.053,126.3Z"
                />
              </svg>

              <span class="text-sm" style="color: rgba(44, 44, 44, 0.75)">
                Vegetariano
              </span>
            </label>

            <!-- Picante ligero -->
            <label
              class="feature-filter-option flex items-center gap-3 cursor-pointer"
            >
              <input
                type="checkbox"
                class="w-4 h-4"
                [checked]="isFeatureSelected('spicyMild')"
                (change)="toggleFeature('spicyMild')"
              />

              <span
                class="flex items-center flex-shrink-0"
                style="color: #556141"
              >
                <svg class="w-4 h-4" viewBox="0 0 32 32" fill="none">
                  <path
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M19,8.1c0-2,1.1-3.8,2.8-5.1"
                  />
                  <path
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M15.1,12v2.7c0,5.1-2.3,9.9-6.1,13L7.3,29l4.1-1.5C17.7,25.2,22,19,22,12v0c0-2-1.6-3.6-3.5-3.6h0 C16.6,8.4,15.1,10,15.1,12z"
                  />
                  <path
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M22,13L22,13c-2.3-0.7-4.7-0.7-7,0l0,0"
                  />
                </svg>
              </span>

              <span class="text-sm" style="color: rgba(44, 44, 44, 0.75)">
                Picante ligero
              </span>
            </label>

            <!-- Picante intenso -->
            <label
              class="feature-filter-option flex items-center gap-3 cursor-pointer"
            >
              <input
                type="checkbox"
                class="w-4 h-4"
                [checked]="isFeatureSelected('spicyHot')"
                (change)="toggleFeature('spicyHot')"
              />

              <span
                class="flex items-center flex-shrink-0"
                style="color: #556141"
              >
                <svg class="w-4 h-4" viewBox="0 0 32 32" fill="none">
                  <path
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M19,8.1c0-2,1.1-3.8,2.8-5.1"
                  />
                  <path
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M15.1,12v2.7c0,5.1-2.3,9.9-6.1,13L7.3,29l4.1-1.5C17.7,25.2,22,19,22,12v0c0-2-1.6-3.6-3.5-3.6h0 C16.6,8.4,15.1,10,15.1,12z"
                  />
                  <path
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M22,13L22,13c-2.3-0.7-4.7-0.7-7,0l0,0"
                  />
                </svg>

                <svg class="w-4 h-4 -ml-1.5" viewBox="0 0 32 32" fill="none">
                  <path
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M19,8.1c0-2,1.1-3.8,2.8-5.1"
                  />
                  <path
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M15.1,12v2.7c0,5.1-2.3,9.9-6.1,13L7.3,29l4.1-1.5C17.7,25.2,22,19,22,12v0c0-2-1.6-3.6-3.5-3.6h0 C16.6,8.4,15.1,10,15.1,12z"
                  />
                  <path
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M22,13L22,13c-2.3-0.7-4.7-0.7-7,0l0,0"
                  />
                </svg>
              </span>

              <span class="text-sm" style="color: rgba(44, 44, 44, 0.75)">
                Picante intenso
              </span>
            </label>

            <!-- Nueces -->
            <label
              class="feature-filter-option flex items-center gap-3 cursor-pointer"
            >
              <input
                type="checkbox"
                class="w-4 h-4"
                [checked]="isFeatureSelected('containsNuts')"
                (change)="toggleFeature('containsNuts')"
              />

              <svg
                class="w-4 h-4 flex-shrink-0"
                viewBox="0 0 24 24"
                fill="none"
                style="color: #556141"
              >
                <path
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="square"
                  d="M12,21 C16,19.6666667 18,17.4411765 18,14.3235294 L18,12 L18,12 L6,12 L6,14.3235294 L6,14.3235294 C6,17.4411765 8,19.6666667 12,21 Z M7.5,7 L10.2747211,6.20722253 C10.7040227,6.08456495 11,5.69217895 11,5.24569859 L11,4 L13,4 L12.5575036,4.88499271 C12.3105144,5.3789712 12.5107387,5.97964425 13.0047172,6.22663349 C13.0699767,6.25926325 13.1386113,6.28465283 13.2093952,6.3023488 L16,7 C18.1421954,7.53554885 19.4700868,9.65673819 19.0450148,11.7991358 L19,12 L5,12 L4.882843,11.531372 C4.39057566,9.56230266 5.54842347,7.55759329 7.5,7 Z"
                />
              </svg>

              <span class="text-sm" style="color: rgba(44, 44, 44, 0.75)">
                Contiene nueces
              </span>
            </label>

            <!-- Mariscos -->
            <label
              class="feature-filter-option flex items-center gap-3 cursor-pointer"
            >
              <input
                type="checkbox"
                class="w-4 h-4"
                [checked]="isFeatureSelected('containsSeafood')"
                (change)="toggleFeature('containsSeafood')"
              />

              <span class="text-sm" style="color: rgba(44, 44, 44, 0.75)">
                Mariscos
              </span>
            </label>

            <!-- Gluten -->
            <label
              class="feature-filter-option flex items-center gap-3 cursor-pointer"
            >
              <input
                type="checkbox"
                class="w-4 h-4"
                [checked]="isFeatureSelected('containsGluten')"
                (change)="toggleFeature('containsGluten')"
              />

              <svg
                class="w-4 h-4 flex-shrink-0"
                viewBox="0 0 24 24"
                style="fill: #556141"
              >
                <path
                  fill-rule="evenodd"
                  clip-rule="evenodd"
                  d="M13 3C13 2.44772 12.5523 2 12 2C11.4477 2 11 2.44772 11 3V6.52779C10.1738 5.78835 9.14157 5.27448 8 5.08296V5C8 4.44772 7.55228 4 7 4C6.44772 4 6 4.44772 6 5V7V10V12V13C6 15.973 8.16229 18.441 11 18.917V21C11 21.5523 11.4477 22 12 22C12.5523 22 13 21.5523 13 21V18.917C15.8377 18.441 18 15.973 18 13V12V10V7V5C18 4.44772 17.5523 4 17 4C16.4477 4 16 4.44772 16 5V5.08296C14.8584 5.27448 13.8262 5.78835 13 6.52779V3Z"
                />
              </svg>

              <span class="text-sm" style="color: rgba(44, 44, 44, 0.75)">
                Contiene gluten
              </span>
            </label>
          </div>

          <button
            type="button"
            class="w-full py-2.5 rounded-full text-sm font-medium text-white transition-all"
            style="background-color: #556141"
            (click)="applyFeatureFilters()"
          >
            Aplicar
          </button>
        </div>
      }
    </div>
  </div>

  <!-- =========================================================
       GRILLA DE PRODUCTOS
       ========================================================= -->

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-7">
    @for (product of filteredProducts; track product.id) {
      <app-product-card-menu [product]="product"></app-product-card-menu>
    }

    <!-- SIN RESULTADOS -->
    @if (filteredProducts.length === 0) {
      <div
        class="col-span-full py-24 text-center"
        style="color: rgba(44, 44, 44, 0.35)"
      >
        <p class="text-lg mb-2">No se encontraron platos</p>

        <button
          type="button"
          class="text-sm font-medium hover:underline"
          style="color: #b2571f"
          (click)="resetMenu()"
        >
          Ver todos los platos
        </button>
      </div>
    }
  </div>
</main>

<app-footer></app-footer>
