<app-navbar />

<main class="min-h-screen pt-32 pb-28 max-w-7xl mx-auto px-6 md:px-8">
  <app-page-header eyebrow="Lo que ofrecemos" title="Nuestra Carta">
    <app-search-input
      class="w-full md:w-72"
      placeholder="Buscar platos…"
      [value]="currentSearch"
      (valueChange)="onSearch($event)"
    />
  </app-page-header>

  <div class="flex items-center gap-3 mb-12">
    <app-category-filter
      class="flex-1 min-w-0"
      [categories]="categories"
      [selected]="currentCategory"
      (selectedChange)="selectCategory($event)"
    />
    <app-feature-filter [active]="activeFeatureFilters" (filtersApplied)="applyFeatureFilters($event)" />
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-7">
    @for (product of filteredProducts; track product.id) {
      <app-product-card-menu [product]="product" />
    } @empty {
      <app-empty-state
        class="col-span-full"
        message="No se encontraron platos"
        actionLabel="Ver todos los platos"
        (action)="resetMenu()"
      />
    }
  </div>
</main>

<app-footer />
