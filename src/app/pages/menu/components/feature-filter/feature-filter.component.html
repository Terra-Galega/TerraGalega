<button
  type="button"
  class="feature-filter-btn w-12 h-12 rounded-full flex items-center justify-center"
  [class.active]="hasActive"
  [attr.aria-expanded]="open"
  aria-haspopup="true"
  title="Filtrar por características"
  (click)="open = !open"
>
  <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
    <path fill-rule="evenodd" clip-rule="evenodd" d="M2.25 6C2.25 5.58579 2.58579 5.25 3 5.25H21C21.4142 5.25 21.75 5.58579 21.75 6C21.75 6.41421 21.4142 6.75 21 6.75H3C2.58579 6.75 2.25 6.41421 2.25 6Z" />
    <path fill-rule="evenodd" clip-rule="evenodd" d="M4.25 12C4.25 11.5858 4.58579 11.25 5 11.25H19C19.4142 11.25 19.75 11.5858 19.75 12C19.75 12.4142 19.4142 12.75 19 12.75H5C4.58579 12.75 4.25 12.4142 4.25 12Z" />
    <path fill-rule="evenodd" clip-rule="evenodd" d="M6.25 18C6.25 17.5858 6.58579 17.25 7 17.25H17C17.4142 17.25 17.75 17.5858 17.75 18C17.75 18.4142 17.4142 18.75 17 18.75H7C6.58579 18.75 6.25 18.4142 6.25 18Z" />
  </svg>
</button>

@if (open) {
  <div class="feature-filter-panel rounded-2xl p-5 absolute right-0 mt-3 z-30">
    <p class="text-[11px] font-semibold tracking-[0.2em] uppercase mb-4" style="color: rgba(44, 44, 44, 0.4)">
      Filtrar por
    </p>

    <div class="flex items-center justify-between mb-3">
      <p class="text-sm font-semibold text-charcoal">Características</p>
      <button
        type="button"
        class="text-[12px] font-medium hover:underline"
        style="color: rgba(44, 44, 44, 0.4)"
        (click)="clear()"
      >
        Limpiar
      </button>
    </div>

    <div class="space-y-2.5 mb-5">
      @for (feature of features; track feature.key) {
        <app-check-option
          accent="sage"
          [label]="feature.filterLabel"
          [checked]="selected.has(feature.key)"
          (changed)="toggle(feature.key)"
        >
          <app-feature-icon [name]="feature.key" />
        </app-check-option>
      }
    </div>

    <app-button variant="sage" size="sm" [fullWidth]="true" (click)="apply()">Aplicar</app-button>
  </div>
}
