<!-- Tarjeta completa: toda el área es clicable y lleva al detalle del producto.
     Al pasar el mouse se levanta y se agranda la imagen.
     Accesibilidad: el nombre del plato es un enlace de verdad (se alcanza con Tab y se abre
     con Enter) y su ::after cubre toda la tarjeta, así el clic en cualquier parte sigue
     funcionando. El lector lee el contenido normal: nombre, descripción, etiquetas y precio.
     El botón "+" lleva al mismo detalle, donde se eligen cantidad y adicionales. -->
<article
  [id]="'menu-card-' + product.id"
  class="product-card glass-card relative rounded-3xl overflow-hidden cursor-pointer group transition-all duration-500 hover:-translate-y-1 hover:shadow-xl flex flex-col h-full"
  [attr.aria-labelledby]="'menu-product-' + product.id"
>
  <!-- Imagen del producto: siempre con la misma proporción, tenga o no etiquetas el plato -->
  <div class="relative aspect-[4/3] flex-shrink-0 overflow-hidden">
    <img
      [src]="product.imageUrl"
      [alt]="product.name"
      class="absolute inset-0 w-full h-full object-cover group-hover:scale-105 transition-transform duration-700"
    />

    <!-- Insignia Popular (arriba a la izquierda, solo en productos populares) -->
    @if (product.popular) {
      <span
        class="absolute top-3 left-3 flex items-center gap-1 px-3 py-1 rounded-full text-[11px] font-bold tracking-wider"
        style="
          background-color: rgba(245, 242, 235, 0.88);
          backdrop-filter: blur(12px);
          color: #b2571f;
        "
      >
        <app-star-icon />

        Popular
      </span>
    }

    <!-- Categoría (arriba a la derecha; el "?" evita error si no tiene categoría) -->
    <span
      class="absolute top-3 right-3 px-2.5 py-1 rounded-full text-[11px] font-medium"
      style="
        background-color: rgba(44, 44, 44, 0.65);
        backdrop-filter: blur(8px);
        color: #f5f2eb;
      "
    >
      {{ product.category?.name }}
    </span>
  </div>

  <!-- Información: ocupa el alto que sobra en la fila y el precio queda siempre abajo -->
  <div class="px-5 pt-4 pb-5 flex flex-col flex-grow">
    <!-- Nombre -->
    <h3
      [id]="'menu-product-' + product.id"
      class="menu-product-name font-serif text-xl font-semibold text-charcoal group-hover:text-terra transition-colors leading-snug mb-1"
    >
      <a class="card-link" [routerLink]="['/productDetails', product.id]">{{ product.name }}</a>
    </h3>

    <!-- Descripción (se recorta a 2 líneas) -->
    <p
      class="text-sm leading-relaxed line-clamp-2 mb-2.5"
      style="color: rgba(44, 44, 44, 0.75)"
    >
      {{ product.description }}
    </p>

    <!-- Características del plato -->
    <!-- Reserva el alto de una fila de etiquetas para que los precios queden alineados -->
    <app-feature-chips
      class="flex flex-wrap content-start gap-1.5 mb-3 min-h-[1.625rem]"
      [product]="product"
    />

    <!-- Precio (sin decimales, ej. 38.900) y botón "+" que abre el detalle para añadirlo.
         El lector de pantalla oye "Precio: 38.900 pesos" (el "$" lo leería como dólares). -->
    <div class="flex items-center justify-between mt-auto">
      <p class="font-bold text-lg" style="color: #b2571f">
        <span class="sr-only">Precio: {{ product.price | number: "1.0-0" }} pesos</span>
        <span aria-hidden="true">${{ product.price | number: "1.0-0" }}</span>
      </p>

      <button
        type="button"
        class="menu-plus-btn card-action w-10 h-10 rounded-full flex items-center justify-center cursor-pointer"
        [attr.aria-label]="'Añadir ' + product.name + ' al pedido'"
        (click)="openProductDetail()"
      >
        <svg aria-hidden="true" focusable="false"
          class="w-[17px] h-[17px]"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 4v16m8-8H4"
          />
        </svg>
      </button>
    </div>
  </div>
</article>
