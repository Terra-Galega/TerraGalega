<section class="glass-card rounded-3xl p-6 md:p-8 h-full">
  <div class="flex items-center justify-between mb-6">
    <div>
      <!--Info del cliente-->
      <p
        class="text-[12px] tracking-widest uppercase mb-1"
        style="color: rgba(44, 44, 44, 0.38)"
      >
        Datos
      </p>
      <h3 class="font-serif text-2xl font-semibold">Información personal</h3>
    </div>
    <!--btn de editar-->
    <button
      type="button"
      (click)="edit.emit()"
      class="text-sm font-medium cursor-pointer transition-opacity hover:opacity-70"
      style="color: #556141"
    >
      Editar
    </button>
  </div>
  <!--Mostrar bonito la info del cliente, nombre correo...-->
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <app-info-tile label="Nombre" [value]="client.name" tone="terra">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
      </svg>
    </app-info-tile>

    <app-info-tile label="Apellido" [value]="client.lastName" tone="terra">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0" />
      </svg>
    </app-info-tile>

    <app-info-tile label="Correo" [value]="client.email" tone="gold">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 8l7.9 5.3a2 2 0 002.2 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
      </svg>
    </app-info-tile>

    <app-info-tile label="Teléfono" [value]="client.phone" tone="gold">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 5a2 2 0 012-2h3.3a1 1 0 01.95.68l1.5 4.5a1 1 0 01-.5 1.2l-2.26 1.13a11 11 0 005.52 5.52l1.13-2.26a1 1 0 011.2-.5l4.5 1.5a1 1 0 01.68.95V19a2 2 0 01-2 2h-1C9.72 21 3 14.28 3 6V5z" />
      </svg>
    </app-info-tile>
  </div>
</section>
