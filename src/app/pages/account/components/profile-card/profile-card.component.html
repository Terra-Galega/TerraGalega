<section class="glass-card rounded-3xl overflow-hidden h-full">
  <div
    class="relative overflow-hidden h-36 md:h-44"
    style="background: #556141"
  >
        <!--Plan del cliente: Premium (dorado) o Freemium-->
    <div
      id="profile-plan"
      class="absolute top-6 right-6 md:top-8 md:right-8 px-4 py-1.5 rounded-full text-[11px] tracking-widest uppercase flex items-center gap-2"
      style="color: #f5f2eb"
      [style.background]="
        client.subscribed
          ? 'rgba(217, 154, 33, 0.28)'
          : 'rgba(255, 255, 255, 0.15)'
      "
      [style.border]="
        client.subscribed
          ? '1px solid rgba(217, 154, 33, 0.7)'
          : '1px solid rgba(255, 255, 255, 0.25)'
      "
    >
      <span
        class="w-1.5 h-1.5 rounded-full"
        [style.background-color]="
          client.subscribed ? '#d99a21' : 'rgba(245, 242, 235, 0.55)'
        "
      ></span>
      {{ client.subscribed ? "Premium" : "Freemium" }}
    </div>
  </div>
  <!--Info-->
  <div class="px-6 md:px-10 pb-8">
    <div class="flex flex-col md:flex-row md:items-start gap-5 -mt-12 md:-mt-14">
      <app-user-avatar
        size="lg"
        [name]="client.name"
        [lastName]="client.lastName"
      />
      <!--Mostrar datos del cliente-->
      <div class="md:pt-16">
        <h2 class="font-serif text-3xl md:text-4xl font-semibold">
          {{ client.name }} {{ client.lastName }}
        </h2>
        <p class="text-sm mt-1" style="color: rgba(44, 44, 44, 0.55)">
          {{ client.email }}
        </p>
      </div>
    </div>
  </div>
</section>
