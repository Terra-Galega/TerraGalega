<aside class="glass-card rounded-3xl p-6 md:p-8 h-full">
  <p
    class="text-[12px] tracking-widest uppercase mb-1"
    style="color: rgba(44, 44, 44, 0.38)"
  >
    Accesos
  </p>
  <h3 class="font-serif text-2xl font-semibold mb-6">Acciones</h3>

  <div class="flex flex-col gap-3">
    <!--Btns para navegar o cerrar sesión-->
    <app-button routerLink="/orders" variant="neutral" size="md" [fullWidth]="true">
      Mis pedidos
    </app-button>
    <app-button routerLink="/coupons" variant="neutral" size="md" [fullWidth]="true">
      Mis cupones
    </app-button>
        <!--Suscripción Premium: suscribirme / premium activo (deshabilitado) / renovar-->
    <div>
      <app-button
        id="premium-btn"
        variant="primary"
        size="md"
        [fullWidth]="true"
        [disabled]="premiumDisabled"
        (click)="onUpgrade()"
      >
        {{ premiumLabel }}
      </app-button>
      @if (premiumHint) {
        <p
          id="premium-hint"
          class="text-[12px] text-center mt-2"
          style="color: rgba(44, 44, 44, 0.55)"
        >
          {{ premiumHint }}
        </p>
      }
    </div>
    <app-button variant="danger" size="md" [fullWidth]="true" (click)="logout.emit()">
      Cerrar sesión
    </app-button>
  </div>
</aside>
