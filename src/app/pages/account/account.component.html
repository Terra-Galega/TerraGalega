<app-navbar></app-navbar>

<body class="min-h-screen bg-cream font-sans text-charcoal">
  <!-- Modal de carrito -->

  <main class="min-h-screen flex items-center justify-center px-6 py-32">
    <div class="w-full max-w-md mx-auto glass-card rounded-3xl p-8">
      <p
        class="text-[12px] tracking-widest uppercase mb-2"
        style="color: rgba(44, 44, 44, 0.38)"
      >
        Sesión iniciada
      </p>
      <h1 class="font-serif text-3xl font-semibold mb-6">
        {{ client?.name }} {{ client?.lastName }}
      </h1>

      <div class="space-y-3 text-sm mb-8" style="color: rgba(44, 44, 44, 0.7)">
        <p>
          <span class="font-semibold text-charcoal">Correo:</span>
          <span> {{ client?.email }}</span>
        </p>
        <p>
          <span class="font-semibold text-charcoal">Teléfono:</span>
          <span> {{ client?.phone }}</span>
        </p>
      </div>

      <div class="flex flex-col gap-3">
        <!-- Ver la carta -->
        <app-button
          routerLink="/menu"
          variant="primary"
          size="lg"
          [fullWidth]="true"
        >
          Ver la carta
        </app-button>

        <!-- Editar perfil -->
        <app-button
          variant="neutral"
          size="lg"
          [fullWidth]="true"
          (click)="editProfile()"
        >
          Editar perfil
        </app-button>

        <!-- Cerrar sesión -->
        <app-button
          variant="neutral"
          size="lg"
          [fullWidth]="true"
          (click)="logout()"
        >
          Cerrar sesión
        </app-button>

        <!-- Eliminar cuenta -->
        <app-button
          variant="danger"
          size="lg"
          [fullWidth]="true"
          (click)="deleteAccount()"
        >
          Eliminar mi cuenta
        </app-button>
      </div>
    </div>
  </main>
</body>

<app-footer></app-footer>
