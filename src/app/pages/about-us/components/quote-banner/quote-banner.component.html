<section class="max-w-4xl mx-auto px-6 pt-20">
  <div class="relative rounded-3xl overflow-hidden shadow-2xl mx-auto">
    <img
      [src]="image"
      [alt]="imageAlt"
      class="absolute inset-0 w-full h-full object-cover"
    />
    <div
      class="absolute inset-0"
      style="background-color: rgba(44, 44, 44, 0.75)"
    ></div>

    <div class="relative z-10 py-16 px-8 text-center max-w-3xl mx-auto">
      <!-- Icono de comillas doradas -->
      <svg
        class="w-10 h-10 mx-auto mb-6 opacity-90"
        style="color: #d99a21"
        fill="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          d="M14.017 21v-7.391c0-5.704 3.731-9.57 8.983-10.609l.995 2.151c-2.432.917-3.995 3.638-3.995 5.849h4v10h-9.983zm-14.017 0v-7.391c0-5.704 3.748-9.57 9-10.609l.996 2.151c-2.433.917-3.996 3.638-3.996 5.849h3.983v10h-9.983z"
        />
      </svg>
      <p
        class="font-serif italic text-2xl md:text-3xl leading-relaxed text-white"
      >
        "{{ quote }}"
      </p>
    </div>
  </div>
</section>
