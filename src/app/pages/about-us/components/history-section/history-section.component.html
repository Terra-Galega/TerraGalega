<!-- Texto de la historia y, debajo, las tres cifras del restaurante -->
<div class="h-full flex flex-col justify-center">
  <div class="w-10 h-0.5 mb-6" style="background-color: #d99a21"></div>
  <p
    class="leading-relaxed mb-5 text-justify"
    style="color: rgba(44, 44, 44, 0.75)"
  >
    {{ 'about_us.history_section.history_section.terra_galega_nacio_del_amor_por_la_gastronomia_gallega_' | t }}
  </p>
  <p
    class="leading-relaxed mb-8 text-justify"
    style="color: rgba(44, 44, 44, 0.75)"
  >
    {{ 'about_us.history_section.history_section.nuestros_ingredientes_viajan_directamente_desde_la_cost' | t }}
  </p>

  <!-- Tarjetas con estadísticas del restaurante -->
  <app-stat-cards [stats]="stats" />
</div>
