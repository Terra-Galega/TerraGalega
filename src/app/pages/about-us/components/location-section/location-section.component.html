<!-- Datos de contacto del restaurante y mapa con su ubicación -->
<div class="max-w-6xl mx-auto px-6 grid md:grid-cols-2 gap-10 items-center">
  <div>
    <!-- Elemento decorativo que acompaña al título -->
    <div class="w-10 h-0.5 mb-6" style="background-color: #d99a21"></div>

    <!-- Título de la sección de ubicación -->
    <h2 class="font-serif text-3xl md:text-4xl font-bold mb-8 text-charcoal">
      {{ 'about_us.location_section.location_section.donde_nos_ubicamos' | t }}
    </h2>

    <!-- Dirección, teléfono, correo y horario (los mismos datos que tenía Contacto) -->
    <app-contact-info [contactItems]="locationItems" layout="stack" />
  </div>

  <!-- Mapa interactivo con la ubicación del restaurante en Bogotá -->
  <app-location-map
    [src]="mapUrl"
    mapTitle="Ubicación de Terra Galega en Bogotá"
  />
</div>
