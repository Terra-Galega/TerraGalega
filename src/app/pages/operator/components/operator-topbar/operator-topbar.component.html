<header class="sticky top-0 z-30" style="
    background-color: #2c2c2c;
    border-bottom: 1px solid rgba(245, 242, 235, 0.08);
    color: #f5f2eb;
  ">
  <!-- Móvil: barra más baja y con menos margen; el botón de salir muestra solo el icono -->
  <div class="max-w-7xl mx-auto h-16 md:h-20 px-4 md:px-8 flex items-center justify-between gap-3">
    <!-- Agrupa la marca y el nombre del portal para mantenerlos alineados en la cabecera. -->
    <div class="flex items-center gap-4">
      <a class="flex flex-col items-start gap-0.5 leading-none select-none" aria-label="Terra Galega">
        <!-- Separa el nombre de la marca en dos líneas y aplica los estilos tipográficos propios del proyecto. -->
        <!-- Mismo logo que la barra del home (también lo usa la cocina) -->
        <span class="font-terra text-[24px] leading-[1.15]" style="color: #e58e57">
          Terra
        </span>
        <span class="font-galega text-[22px] tracking-[0.05em] uppercase mt-0.5" style="color: #f5f2eb">
          Galega
        </span>
      </a>

      <!-- Separador visual que solo aparece en pantallas pequeñas en adelante. -->
      <span class="hidden sm:block h-8 w-px" style="background-color: rgba(245, 242, 235, 0.2)"
        aria-hidden="true"></span>

      <!-- Identifica el área actual sin ocupar espacio en pantallas extra pequeñas. -->
      <span class="hidden sm:block text-xs tracking-widest uppercase">
        {{ panelLabel }}
      </span>
    </div>

    <!-- Reúne la información del operador y la acción para cerrar sesión. -->
    <div class="flex items-center gap-2 md:gap-4">
      <div class="flex items-center gap-3">
        <!-- Genera el avatar a partir de la primera letra del nombre, sin necesitar una imagen de perfil. -->
        <div
          class="w-11 h-11 rounded-full flex items-center justify-center text-base font-semibold text-white flex-shrink-0"
          style="background-color: #b2571f" aria-hidden="true">
          {{ operatorName.charAt(0).toUpperCase() }}
        </div>

        <!-- Oculta los datos textuales del operador en pantallas pequeñas para conservar espacio. -->
        <div class="hidden md:block leading-tight min-w-0">
          <p class="text-[15px] font-semibold truncate" style="color: #f5f2eb">
            {{ operatorName }}
          </p>
          @if (operatorUsername) {
            <p class="text-[13px]" style="color: rgba(245, 242, 235, 0.6)">
              <!-- El símbolo @ se codifica como entidad HTML para evitar conflictos con la sintaxis de Angular. -->
              &#64;{{ operatorUsername }}
            </p>
          }
        </div>
      </div>

      <ng-content select="app-operator-contact-requests"></ng-content>

      <!-- Cerrar sesión con el mismo estilo que el del panel de administración (icono y texto en
           rojo suave, fondo al pasar el cursor). Emite el evento al padre, que cierra la sesión. -->
      <button type="button" class="operator-logout-btn flex items-center gap-2 min-h-[44px] px-4 text-[13px] font-medium rounded-full whitespace-nowrap"
        (click)="logoutClicked.emit()">
        <svg aria-hidden="true" focusable="false" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" />
          <path d="M16 17l5-5-5-5" />
          <path d="M21 12H9" />
        </svg>
        Cerrar sesión
      </button>

      <!-- Configuración (sin idioma): tema claro/oscuro y paleta de accesibilidad -->
      <app-settings-menu [showLanguage]="false" class="flex-shrink-0" />
    </div>
  </div>
</header>
