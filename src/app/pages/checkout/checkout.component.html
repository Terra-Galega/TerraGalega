<div style="min-height: 100vh; background: #f5f2eb">
  <app-navbar></app-navbar>

  <main class="min-h-screen pt-32 pb-28 max-w-5xl mx-auto px-6 md:px-8">
    <app-page-header eyebrow="Paso 1 de 2 · Pasarela de pago" title="Entrega y pago" />

    @if (items.length === 0) {
      <div class="glass-card rounded-3xl">
        <app-empty-state
          message="Tu carrito está vacío. Agrega algo de la carta antes de pagar."
          actionLabel="Explorar la carta"
          (action)="goToMenu()"
        ></app-empty-state>
      </div>
    } @else {
      <form
        [formGroup]="form"
        (ngSubmit)="goToReview()"
        class="grid grid-cols-1 md:grid-cols-5 gap-10 items-start"
      >
        <!-- Izquierda: dirección y método de pago -->
        <div class="md:col-span-3 flex flex-col gap-10">
          <app-delivery-address
            [form]="form"
            [error]="errors['address'] || ''"
            [notice]="addressNotice"
            [savedAddress]="savedAddress"
            (useSavedAddress)="useSavedAddress()"
          ></app-delivery-address>

          <app-payment-form
            [form]="form"
            [errors]="errors"
            (fillTestData)="fillTestData()"
          ></app-payment-form>
        </div>

        <!-- Derecha: resumen y botón (queda fijo al hacer scroll en escritorio) -->
        <aside class="md:col-span-2 md:sticky md:top-28">
          <app-order-summary
            [items]="items"
            [total]="total"
            [unitPrice]="unitPrice"
          >
            <div class="mt-6 flex flex-col items-center gap-4">
              <app-button type="submit" size="lg" [fullWidth]="true">
                Continuar
              </app-button>

              <button
                type="button"
                class="text-sm underline underline-offset-4 cursor-pointer"
                style="color: rgba(44, 44, 44, 0.65)"
                (click)="cancel()"
              >
                Cancelar compra
              </button>
            </div>
          </app-order-summary>
        </aside>
      </form>
    }
  </main>

  <app-footer></app-footer>
</div>

<app-modal
  [open]="showCancelModal"
  [title]="confirmTitle"
  [message]="confirmMessage"
  confirmLabel="Sí, cancelar compra"
  cancelLabel="Continuar comprando"
  variant="danger"
  (confirm)="confirmCancel()"
  (cancel)="closeCancelModal()"
></app-modal>

<app-modal
  [open]="showErrorModal"
  [title]="errorTitle"
  [message]="errorMessage"
  confirmLabel="Aceptar"
  variant="error"
  (confirm)="closeErrorModal()"
  (cancel)="closeErrorModal()"
></app-modal>
