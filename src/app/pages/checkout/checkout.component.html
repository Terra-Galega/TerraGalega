<!-- Página del paso 1: navbar + contenido + footer -->
<div style="min-height: 100vh; background: #f5f2eb">
  <app-navbar></app-navbar>

  <main class="min-h-screen pt-32 pb-28 max-w-5xl mx-auto px-6 md:px-8">
    <app-page-header eyebrow="Paso 1 de 2 - Pasarela de pago" title="{{ 'checkout.checkout.entrega_y_pago' | t }}" />

    <!-- Sin productos en el carrito no tiene sentido pagar: se invita a ir a la carta -->
    @if (items.length === 0) {
    <div class="glass-card rounded-3xl">
      <app-empty-state message="Tu carrito está vacío. Agrega algo de la carta antes de pagar."
        actionLabel="Explorar la carta" (action)="goToMenu()"></app-empty-state>
    </div>
    } @else {
    <!-- Formulario reactivo; al enviarlo (Enter o botón Continuar) se ejecuta goToReview().
        Los hijos reciben el mismo `form` y escriben directamente en él. -->
    <form [formGroup]="form" (ngSubmit)="goToReview()" class="grid grid-cols-1 md:grid-cols-5 gap-10 items-start">
      <!-- Izquierda: dirección, cupón y método de pago.
           "block" en los componentes: así el tutorial mide bien su recuadro -->
      <div class="md:col-span-3 flex flex-col gap-10">
        <!-- Dirección: direcciones guardadas, errores de los campos y estado de carga -->
        <app-delivery-address id="checkout-address" class="block" [form]="form" [error]="errors.address"
          [nameError]="errors.addressName" [addresses]="addresses" [loading]="!addressesLoaded"></app-delivery-address>

        <!-- Cupón de descuento: avisa con (couponChange) cuando se aplica o se quita -->
        @if (clientId !== null) {
        <app-checkout-coupon id="checkout-coupon" class="block" [clientId]="clientId" [subtotal]="total"
          [initialCode]="initialCouponCode" (couponChange)="onCouponChange($event)"></app-checkout-coupon>
        }

        <!-- Método de pago: efectivo o tarjeta (la tarjeta se escribe en Stripe) -->
        <app-payment-form id="checkout-payment" class="block" [form]="form" [errors]="errors"></app-payment-form>
      </div>

      <!-- Derecha: resumen y botón (queda fijo al hacer scroll en escritorio) -->
      <aside class="md:col-span-2 md:sticky md:top-28">
        <!-- El resumen proyecta aquí dentro (ng-content) los botones propios de esta página -->
        <app-order-summary id="checkout-summary" class="block" [items]="items" [total]="total" [unitPrice]="unitPrice"
          [discount]="discount" [couponCode]="coupon?.code ?? ''">
          <div class="mt-6 flex flex-col items-center gap-4">
            <app-button id="btn-continue" type="submit" size="lg" [fullWidth]="true">
              {{ 'checkout.checkout.continuar' | t }}
            </app-button>

            <button type="button" class="danger-pill" (click)="cancel()">
              {{ 'checkout.checkout.cancelar_compra' | t }}
            </button>
          </div>
        </app-order-summary>
      </aside>
    </form>
    }
  </main>

  <app-footer></app-footer>
</div>

<app-modal [open]="showCancelModal" [title]="confirmTitle" [message]="confirmMessage" confirmLabel="Sí, cancelar compra"
  cancelLabel="Continuar comprando" variant="danger" (confirm)="confirmCancel()"
  (cancel)="closeCancelModal()"></app-modal>

<app-modal [open]="showErrorModal" [title]="errorTitle" [message]="errorMessage" confirmLabel="Aceptar" variant="error"
  (confirm)="closeErrorModal()" (cancel)="closeErrorModal()"></app-modal>
