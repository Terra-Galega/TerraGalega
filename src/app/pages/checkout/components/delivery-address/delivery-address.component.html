<section [formGroup]="form">
  <h2 class="font-serif text-xl font-semibold text-charcoal">Dirección de entrega</h2>
  <p class="text-[15px] mt-1 mb-4" style="color: rgba(44, 44, 44, 0.65)">
    ¿Dónde quieres recibir tu pedido?
  </p>

  <div
    class="rounded-2xl overflow-hidden"
    style="background-color: rgba(255, 255, 255, 0.85)"
    [style.border]="error ? '1px solid #8a2222' : '1px solid rgba(44, 44, 44, 0.12)'"
  >
    <label class="block px-4 pt-2.5 pb-2">
      <span class="block text-xs" style="color: rgba(44, 44, 44, 0.55)">Dirección</span>
      <input
        type="text"
        formControlName="address"
        maxlength="120"
        placeholder="Ej: Calle 123 #45-67, apto 8"
        autocomplete="street-address"
        class="w-full bg-transparent outline-none text-[15px] text-charcoal py-1"
      />
    </label>
  </div>

  <!-- Error o aviso a la izquierda y contador a la derecha -->
  <div class="flex items-start justify-between gap-4 mt-2">
    <div class="text-sm min-w-0">
      @if (error) {
        <p style="color: #8a2222">{{ error }}</p>
      } @else if (notice) {
        <p style="color: rgba(44, 44, 44, 0.7)">{{ notice }}</p>
      }
    </div>

    <span class="text-xs flex-shrink-0 pt-0.5" style="color: rgba(44, 44, 44, 0.5)">
      {{ length }}/120
    </span>
  </div>

  @if (canRestore) {
    <button
      type="button"
      class="mt-2 text-sm font-medium underline underline-offset-4 cursor-pointer"
      style="color: #b2571f"
      (click)="useSavedAddress.emit()"
    >
      Usar mi dirección guardada
    </button>
  }
</section>
