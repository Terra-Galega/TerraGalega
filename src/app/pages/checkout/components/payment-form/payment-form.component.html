<div [formGroup]="form">
  <div class="glass-card rounded-3xl p-7">
    <h2 class="font-serif text-xl font-semibold text-charcoal mb-1">
      Datos de pago
    </h2>

    <p class="text-[15px] mb-6" style="color: rgba(44, 44, 44, 0.65)">
      Ingresa los datos de tu tarjeta de crédito/débito para finalizar el pago.
    </p>

    <div class="space-y-4">
      <app-form-field label="Nombre en la tarjeta">
        <input
          type="text"
          formControlName="cardName"
          placeholder="Juan García"
          autocomplete="cc-name"
          class="input-field w-full px-4 py-3 rounded-xl text-charcoal text-sm"
        />
      </app-form-field>

      <app-form-field label="Número de tarjeta">
        <input
          type="text"
          formControlName="cardNumber"
          placeholder="4111 1111 1111 1111"
          inputmode="numeric"
          maxlength="19"
          autocomplete="cc-number"
          class="input-field w-full px-4 py-3 rounded-xl text-charcoal text-sm"
          (input)="formatCardNumber($event)"
        />
      </app-form-field>

      <div class="grid grid-cols-2 gap-4">
        <app-form-field label="Vencimiento">
          <input
            type="text"
            formControlName="cardExpiry"
            placeholder="MM/AA"
            inputmode="numeric"
            maxlength="5"
            autocomplete="cc-exp"
            class="input-field w-full px-4 py-3 rounded-xl text-charcoal text-sm"
            (input)="formatExpiry($event)"
          />
        </app-form-field>

        <app-form-field label="CVV">
          <input
            type="text"
            formControlName="cardCvv"
            placeholder="123"
            inputmode="numeric"
            maxlength="3"
            autocomplete="cc-csc"
            class="input-field w-full px-4 py-3 rounded-xl text-charcoal text-sm"
            (input)="formatCvv($event)"
          />
        </app-form-field>
      </div>
    </div>

    @if (cardError || serverError) {
      <p class="text-xs mt-4" style="color: #8a2222">
        {{ cardError || serverError }}
      </p>
    }

    <div class="mt-6">
      <app-button
        type="submit"
        size="lg"
        [fullWidth]="true"
        [disabled]="paying"
      >
        {{ paying ? 'Procesando pago...' : 'Pagar' }}
      </app-button>
    </div>

    <div class="mt-3">
      <app-button
        variant="neutral"
        [fullWidth]="true"
        [disabled]="paying"
        (click)="cancel.emit()"
      >
        Cancelar compra
      </app-button>
    </div>
  </div>
</div>
