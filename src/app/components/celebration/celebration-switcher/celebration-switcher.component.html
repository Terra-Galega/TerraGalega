@if (visible) {
  <aside class="switcher">
    <button
      class="toggle"
      type="button"
      [attr.aria-expanded]="menuOpen"
      aria-controls="festival-switcher-menu"
      (click)="menuOpen = !menuOpen"
    >
      {{ language.t('celebrations.ui.preview') }}
    </button>

    @if (menuOpen) {
      <div class="menu" id="festival-switcher-menu">
        <p>{{ language.t('celebrations.ui.previewTitle') }}</p>
        <div class="options">
          @for (option of options; track option.id) {
            <button type="button" [attr.aria-pressed]="selected() === option.id" (click)="choose(option.id)">
              {{ option.id === '' ? language.t('celebrations.ui.realDate') : option.id === 'none' ? language.t('celebrations.ui.noEffect') : language.t('celebrations.' + option.id + '.name') }}
            </button>
          }
        </div>
      </div>
    }
  </aside>
}
