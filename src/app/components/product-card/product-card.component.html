<!-- Tarjeta completa: toda el área es clicable y lleva al detalle del producto.
     Al pasar el mouse se levanta un poco y se agranda la imagen. -->
<div
  class="rounded-2xl bg-white overflow-hidden cursor-pointer group transition-all duration-500 hover:-translate-y-1 hover:shadow-xl"
  style="box-shadow: 0 4px 24px rgba(44, 44, 44, 0.06)"
  (click)="goToProductDetail()"
>
  <!-- Imagen del producto -->
  <div class="card-image relative h-48 overflow-hidden">
    <img
      [src]="product.imageUrl"
      [alt]="product.name"
      class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700"
    />
  </div>

  <!-- Información del producto -->
  <div class="p-6">
    <!-- Categoría (el "?" evita error si el producto no tiene categoría) -->
    <span
      class="text-[11px] font-medium tracking-widest uppercase"
      style="color: rgba(178, 87, 31, 0.7)"
    >
      {{ product.category?.name }}
    </span>

    <!-- Nombre y precio (el precio se muestra sin decimales, ej. 38.900) -->
    <div class="flex justify-between items-start gap-3 mt-1 mb-2">
      <h3
        class="font-serif text-xl font-semibold text-charcoal group-hover:text-terra transition-colors"
      >
        {{ product.name }}
      </h3>

      <span class="font-bold text-lg flex-shrink-0" style="color: #b2571f">
        ${{ product.price | number: "1.0-0" }}
      </span>
    </div>

    <!-- Descripción (se recorta a 2 líneas) -->
    <p
      class="text-sm leading-relaxed line-clamp-2"
      style="color: rgba(44, 44, 44, 0.68)"
    >
      {{ product.description }}
    </p>
  </div>
</div>
