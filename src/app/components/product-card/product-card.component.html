<!-- Tarjeta completa: toda el área es clicable y lleva al detalle del producto.
     Al pasar el mouse se levanta un poco y se agranda la imagen.
     Estructura (todas las tarjetas de una fila miden lo mismo):
     1. Imagen con proporción fija 4:3, así nunca se ve aplastada ni estirada.
     2. Categoría, nombre (hasta 2 líneas) y descripción (2 líneas) con altura reservada.
     3. Precio siempre al fondo, alineado entre tarjetas. -->
<div
  class="h-full flex flex-col rounded-[22px] bg-white overflow-hidden cursor-pointer group transition-all duration-500 hover:-translate-y-1 hover:shadow-xl"
  style="box-shadow: 0 1px 2px rgba(44, 44, 44, 0.04), 0 8px 28px rgba(44, 44, 44, 0.06)"
  (click)="goToProductDetail()"
>
  <!-- Imagen del producto (fondo beige mientras carga) -->
  <div class="card-image relative aspect-[4/3] flex-shrink-0 overflow-hidden" style="background-color: #ede9e0">
    <img
      [src]="product.imageUrl"
      [alt]="product.name"
      loading="lazy"
      class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700"
    />
  </div>

  <!-- Información del producto -->
  <div class="flex flex-col flex-grow p-5 md:p-6">
    <!-- Categoría (el "?" evita error si el producto no tiene categoría) -->
    <span class="text-[11px] font-semibold tracking-[0.14em] uppercase" style="color: #b2571f">
      {{ product.category?.name }}
    </span>

    <!-- Nombre: hasta 2 líneas, sin cortarse con puntos suspensivos a la mitad de una palabra -->
    <h3
      class="font-serif text-xl md:text-[22px] leading-snug tracking-tight font-semibold text-charcoal group-hover:text-terra transition-colors line-clamp-2 min-h-[2lh] mt-1.5"
      [attr.data-tooltip]="product.name"
    >
      {{ product.name }}
    </h3>

    <!-- Descripción (se recorta a 2 líneas) -->
    <p
      class="text-[15px] leading-relaxed line-clamp-2 min-h-[2lh] mt-2"
      style="color: rgba(44, 44, 44, 0.68)"
    >
      {{ product.description }}
    </p>

    <!-- Precio al fondo, sin decimales (ej. $38.900), con cifras de ancho fijo -->
    <p class="mt-auto pt-5 text-lg font-semibold tabular-nums text-charcoal">
      ${{ product.price | number: "1.0-0" }}
    </p>
  </div>
</div>
