<div class="glass-card rounded-3xl p-10 text-center">
  <h2 class="font-serif text-2xl font-semibold text-charcoal mb-3">
    ¿Listo para pedir?
  </h2>

  <p class="text-[15px] mb-8" style="color: rgba(44, 44, 44, 0.7)">
    Inicia sesión si ya tienes cuenta, o regístrate en un minuto.
  </p>

  <div class="flex flex-col sm:flex-row gap-3 justify-center">
    <app-button variant="outline" size="lg" routerLink="/login">Iniciar sesión</app-button>

    <app-button variant="outline" size="lg" [routerLink]="['/login']"
      [queryParams]="{ tab: 'register' }">Crear una cuenta</app-button>

    <app-button variant="outline" size="lg" routerLink="/menu">Ver la carta</app-button>
  </div>
</div>
