<div class="glass-card rounded-3xl p-10 text-center">
  <h2 class="font-serif text-2xl font-semibold text-charcoal mb-3">
    ¿Listo para pedir?
  </h2>

  <p class="text-[15px] mb-8" style="color: rgba(44, 44, 44, 0.7)">
    Inicia sesión si ya tienes cuenta, o regístrate en un minuto.
  </p>

  <div class="flex flex-col sm:flex-row gap-3 justify-center">
    <a
      routerLink="/login"
      class="px-10 py-4 rounded-full font-medium transition-all duration-300 hover:scale-105 border border-charcoal/20 text-charcoal/70 hover:text-white hover:border-transparent hover:shadow-[0_6px_28px_rgba(178,87,31,0.3)] hover:bg-[linear-gradient(135deg,#b2571f_0%,#8a2222_100%)]"
    >
      Iniciar sesión
    </a>

    <a
      [routerLink]="['/login']"
      [queryParams]="{ tab: 'register' }"
      class="px-10 py-4 rounded-full font-medium transition-all duration-300 hover:scale-105 border border-charcoal/20 text-charcoal/70 hover:text-white hover:border-transparent hover:shadow-[0_6px_28px_rgba(178,87,31,0.3)] hover:bg-[linear-gradient(135deg,#b2571f_0%,#8a2222_100%)]"
    >
      Crear una cuenta
    </a>

    <a
      routerLink="/menu"
      class="px-10 py-4 rounded-full font-medium transition-all duration-300 hover:scale-105 border border-charcoal/20 text-charcoal/70 hover:text-white hover:border-transparent hover:shadow-[0_6px_28px_rgba(178,87,31,0.3)] hover:bg-[linear-gradient(135deg,#b2571f_0%,#8a2222_100%)]"
    >
      Ver la carta
    </a>
  </div>
</div>
