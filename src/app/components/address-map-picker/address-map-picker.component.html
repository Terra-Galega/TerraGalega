<div class="map-frame">
  <div
    data-address-map
    class="map"
    [attr.aria-label]="'merge.map_accessible_label' | t"
  ></div>

  <!-- La punta del marcador queda en el centro del mapa. -->
  <svg class="pin" viewBox="0 0 32 44" aria-hidden="true">
    <path
      d="M16 43C13 36 1 24 1 16a15 15 0 1 1 30 0c0 8-12 20-15 27Z"
      fill="#b2571f"
      stroke="white"
      stroke-width="2"
    />
    <circle cx="16" cy="16" r="5" fill="white" />
  </svg>
</div>

<div class="status" aria-live="polite">
  @if (loadingMap) {
    <p>{{ 'address_map_picker.address_map_picker.cargando_mapa' | t }}</p>
  }

  @if (resolving) {
    <p>{{ 'address_map_picker.address_map_picker.buscando_la_direccion' | t }}</p>
  }

  @if (mapError) {
    <p class="error">{{ mapError }}</p>
  }

  @if (error) {
    <p class="error">{{ error | t }}</p>
  }
</div>

<p class="hint">
  {{ 'merge.map_hint' | t }}
</p>
