<!-- Pegado al borde derecho, centrado en vertical. En celular solo se ve el ícono. -->
<button
    id="tutorial-fab"
    type="button"
    class="fixed right-0 top-1/2 -translate-y-1/2 z-40 flex items-center gap-2 rounded-l-full pl-4 pr-3 py-3 text-white shadow-xl cursor-pointer transition-all duration-300 hover:pr-5"
    style="background-color: #b2571f"
    aria-label="Aprende a hacer un pedido"
    (click)="startOrderTour()"
>
<!-- Ícono de signo de pregunta -->
<svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
    <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
    />
    </svg>
    <span class="hidden md:inline text-sm font-medium tracking-wide">¿Cómo hago un pedido?</span>
</button>
