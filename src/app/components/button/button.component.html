@if (routerLink) {
  <a [routerLink]="routerLink" [queryParams]="queryParams" [class]="classes">
    <ng-container *ngTemplateOutlet="content" />
  </a>
} @else {
  <button [type]="type" [disabled]="disabled" [class]="classes">
    <ng-container *ngTemplateOutlet="content" />
  </button>
}

<ng-template #content><ng-content /></ng-template>
