<!-- Gráfica de barras o líneas (Chart.js; se ajusta al ancho de la tarjeta) -->
<div class="relative h-[260px] w-full">
    <canvas baseChart [type]="chartType" [data]="data" [options]="options" [plugins]="plugins" role="img"
        aria-label="Gráfica de ventas"></canvas>

    <!-- Aviso cuando no hay datos -->
    @if (!hasData) {
    <div class="absolute inset-0 flex items-center justify-center text-(length:--dfs-14) leading-[1.43] pointer-events-none"
        style="color: rgba(44, 44, 44, 0.45)">
        {{ emptyText }}
    </div>
    }
</div>
