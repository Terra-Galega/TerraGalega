@if (open) {
<div class="fixed inset-0 z-[100] flex items-center justify-center p-4"
    style="background-color: rgba(44, 44, 44, 0.45); backdrop-filter: blur(4px)" (click)="cancel.emit()">
    <div class="glass-card w-full max-w-md rounded-3xl p-6 md:p-8" style="background: rgba(255, 255, 255, 0.98)"
        [attr.role]="variant === 'error' ? 'alertdialog' : 'dialog'" aria-modal="true"
        (click)="$event.stopPropagation()">
        <h3 class="font-serif text-xl font-semibold mb-2" [style.color]="titleColor">
            {{ title }}
        </h3>

        <p class="text-sm mb-7 whitespace-pre-line" style="color: rgba(44, 44, 44, 0.7)">
            {{ message }}
        </p>

        <div class="flex justify-end gap-3">
            @if (cancelLabel) {
            <app-button variant="neutral" size="sm" (click)="cancel.emit()">
                {{ cancelLabel }}
            </app-button>
            }

            <app-button [variant]="confirmVariant" size="sm" (click)="confirm.emit()">
                {{ confirmLabel }}
            </app-button>
        </div>
    </div>
</div>
}
