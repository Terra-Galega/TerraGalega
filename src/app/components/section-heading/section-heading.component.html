<!-- Encabezado de sección centrado: texto pequeño arriba y título grande, con mucho aire alrededor -->
<div class="text-center mb-14 md:mb-16">
  <!-- Texto pequeño superior, en mayúsculas -->
  <p class="text-xs md:text-[13px] font-semibold tracking-[0.22em] uppercase mb-4" style="color: #b2571f">
    {{ eyebrow }}
  </p>
  <!-- Título principal -->
  <h2 class="font-serif text-4xl md:text-6xl text-charcoal font-semibold tracking-tight leading-[1.05]">
    {{ title }}
  </h2>
</div>
