<!-- Versión centrada: eyebrow, título y una línea dorada decorativa debajo. -->
@if (align === 'center') {
<div class="text-center mb-16">
  <p class="text-[12px] font-medium tracking-[0.3em] uppercase mb-3" style="color: #b2571f">
    {{ eyebrow }}
  </p>
  <h1 class="font-serif text-4xl md:text-5xl font-bold text-charcoal">
    {{ title }}
  </h1>
  <!-- Línea dorada decorativa bajo el título. -->
  <div class="w-10 h-0.5 mx-auto mt-5" style="background-color: #d99a21"></div>
</div>
} @else {
<!-- Versión alineada a la izquierda: en pantallas medianas el título queda a un lado y el contenido proyectado al otro. -->
<div class="flex flex-col md:flex-row md:items-end justify-between gap-6 mb-14">
  <div>
    <p class="text-[12px] font-medium tracking-[0.3em] uppercase mb-2" style="color: #b2571f">
      {{ eyebrow }}
    </p>
    <h1 class="font-serif text-5xl font-bold text-charcoal">{{ title }}</h1>
  </div>

  <!-- Lo que se ponga dentro (como un el search-input) queda a la derecha -->
  <ng-content />
</div>
}
