@if (align === 'center') {
  <div class="text-center mb-16">
    <p
      class="text-[12px] font-medium tracking-[0.3em] uppercase mb-3"
      style="color: #b2571f"
    >
      {{ eyebrow }}
    </p>
    <h1 class="font-serif text-4xl md:text-5xl font-bold text-charcoal">
      {{ title }}
    </h1>
    <div
      class="w-10 h-0.5 mx-auto mt-5"
      style="background-color: #d99a21"
    ></div>
  </div>
} @else {
  <div class="flex flex-col md:flex-row md:items-end justify-between gap-6 mb-14">
    <div>
      <p class="text-[12px] font-medium tracking-[0.3em] uppercase mb-2" style="color: #b2571f">
        {{ eyebrow }}
      </p>
      <h1 class="font-serif text-5xl font-bold text-charcoal">{{ title }}</h1>
    </div>

    <!-- Lo que se ponga dentro (como un el search-input) queda a la derecha -->
    <ng-content />
  </div>
}
