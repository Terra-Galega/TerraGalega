<!-- Tres columnas iguales, una tarjeta por cifra. En móvil se juntan y llevan menos relleno
     para que las tres quepan sin apretar el texto. -->
<div class="grid grid-cols-3 gap-2.5 sm:gap-5">
  @for (stat of stats; track stat.label) {
    <div class="glass-card rounded-2xl px-2 py-4 sm:p-5 text-center">
      <!-- Cifra destacada -->
      <p class="font-serif font-bold text-2xl mb-1" style="color: #b2571f">
        {{ stat.value }}
      </p>
      <!-- Descripción de la cifra -->
      <p class="text-[11px] leading-snug" style="color: rgba(44, 44, 44, 0.55)">
        {{ stat.label }}
      </p>
    </div>
  }
</div>
