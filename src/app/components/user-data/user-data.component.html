<!-- Solo mostramos la tarjeta si la variable user tiene datos -->
<article class="card col-md-8 col-lg-6 mx-auto shadow-sm border-0 rounded-4 overflow-hidden" *ngIf="user">
  <div class="row g-0">

    <!-- Imagen de perfil -->
    <figure class="col-md-4 bg-light d-flex align-items-center justify-content-center p-3 m-0">
      <img
        [src]="user.image"
        [alt]="'Foto de perfil de ' + user.firstName"
        class="img-fluid rounded-circle border border-3 border-white shadow-sm"
        style="max-width: 120px;">
    </figure>

    <!-- Datos del usuario -->
    <section class="col-md-8 py-4 px-3">
      <header>
        <h2 class="h4 text-primary mb-1 fw-bold">
          {{ user.firstName }} {{ user.lastName }}
        </h2>
        <p class="text-muted mb-3">
          <i class="bi bi-person-badge me-2" aria-hidden="true"></i>{{ '@' + user.username }}
        </p>
      </header>

      <ul class="list-unstyled mb-0">
        <li>
          <i class="bi bi-envelope-at text-secondary me-2" aria-hidden="true"></i>
          <strong>Email:</strong>
          <a [href]="'mailto:' + user.email" class="text-decoration-none">{{ user.email }}</a>
        </li>
      </ul>
    </section>

  </div>
</article>
