<div class="glass-card p-2 md:p-3 rounded-2xl w-full">
  <div
    class="relative w-full aspect-square rounded-xl overflow-hidden border border-black/5"
  >
    @if (safeUrl) {
      <iframe
        [src]="safeUrl"
        [title]="mapTitle"
        width="100%"
        height="400"
        style="border: 0"
        allowfullscreen
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
      ></iframe>
    }
  </div>
</div>
