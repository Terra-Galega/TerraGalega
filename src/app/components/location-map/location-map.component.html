<!-- Tarjeta de vidrio que contiene el mapa -->
<div class="glass-card p-2 md:p-3 rounded-2xl w-full">
  <div
    class="relative w-full aspect-square rounded-xl overflow-hidden border border-black/5"
  >
    <!-- El mapa solo aparece si la URL pasó la validación del componente -->
    @if (safeUrl) {
      <!-- Ocupa todo el cuadro de la tarjeta, sin dejar espacio vacío debajo -->
      <iframe
        class="absolute inset-0 w-full h-full"
        [src]="safeUrl"
        [title]="mapTitle"
        style="border: 0"
        allowfullscreen
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>
    }
  </div>
</div>
