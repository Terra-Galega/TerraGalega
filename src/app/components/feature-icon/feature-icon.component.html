<!-- Dibuja el icono de la característica indicada en "name". Son los mismos trazados que usa la
     app móvil (FEATURE_PATHS en ShopCards.kt): cuadrícula de 24 y trazo de 1.8.
     El tamaño llega por la clase "size" y el color se hereda (currentColor). -->
@switch (name) {
  @case ("vegetarian") {
    <!-- Hoja -->
    <svg [class]="size" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
      stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 19c0-8 5-14 15-14 0 10-6 15-14 15" />
      <path d="M5 19c3-5 6-8 10-10" />
    </svg>
  }
  @case ("spicyMild") {
    <!-- Una llama -->
    <svg [class]="size" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
      stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 01-10 0c0-2 1-3.2 2-4.2 0 1.5.7 2.3 1.5 2.7C10.3 8.5 10.8 5.5 12 3z" />
    </svg>
  }
  @case ("spicyHot") {
    <!-- Dos llamas -->
    <svg [class]="size" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
      stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 3c.8 2.8 4 4.4 4 8a4 4 0 01-8 0c0-1.6.8-2.6 1.6-3.4 0 1.2.6 1.8 1.2 2.1C7.6 7.2 8.2 5.2 9 3z" />
      <path d="M16 9c.6 2 3 3.2 3 5.8a3 3 0 01-6 0c0-1.2.6-1.9 1.2-2.5 0 .9.5 1.4.9 1.6-.2-1.8.3-3.3.9-4.9z" />
    </svg>
  }
  @case ("containsNuts") {
    <!-- Bellota -->
    <svg [class]="size" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
      stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 10h12c0 5-2.5 9-6 10-3.5-1-6-5-6-10z" />
      <path d="M5 10c0-2.2 3-4 7-4s7 1.8 7 4" />
      <path d="M12 6V3" />
    </svg>
  }
  @case ("containsSeafood") {
    <!-- Pez -->
    <svg [class]="size" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
      stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 12c3-4.5 8-5.5 12-3l6-3v12l-6-3c-4 2.5-9 1.5-12-3z" />
      <circle cx="8" cy="11" r="0.8" fill="currentColor" stroke="none" />
    </svg>
  }
  @case ("containsGluten") {
    <!-- Espiga de trigo -->
    <svg [class]="size" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
      stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 21V8" />
      <path d="M12 8c-2.5 0-4-1.5-4-4 2.5 0 4 1.5 4 4z" />
      <path d="M12 8c2.5 0 4-1.5 4-4-2.5 0-4 1.5-4 4z" />
      <path d="M12 14c-2.5 0-4-1.5-4-4 2.5 0 4 1.5 4 4z" />
      <path d="M12 14c2.5 0 4-1.5 4-4-2.5 0-4 1.5-4 4z" />
      <path d="M12 20c-2.5 0-4-1.5-4-4 2.5 0 4 1.5 4 4z" />
      <path d="M12 20c2.5 0 4-1.5 4-4-2.5 0-4 1.5-4 4z" />
    </svg>
  }
}
