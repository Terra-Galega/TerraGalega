<!-- Tarjeta con el mismo estilo de las opiniones de siempre -->
<div
  class="p-8 shadow-sm h-full"
  style="background-color: rgb(251, 247, 242); border-radius: 2px"
>
  <!-- Calificación: estrellas llenas hasta la nota y atenuadas el resto -->
  <div
    class="flex gap-1 mb-5"
    role="img"
    [attr.aria-label]="review.rating + ' de 5 estrellas'"
  >
    @for (star of stars; track star) {
    <span [class.opacity-25]="star > review.rating">
      <app-star-icon size="w-4 h-4" />
    </span>
    }
  </div>

  <!-- Comentario del cliente -->
  <p
    class="text-sm leading-relaxed mb-6 italic break-words"
    style="color: rgba(44, 44, 44, 0.68)"
  >
    "{{ review.comment }}"
  </p>

  <!-- Autor y mes, separados del texto por una línea -->
  <div class="pt-5 border-t" style="border-color: rgba(44, 44, 44, 0.1)">
    <p class="font-semibold text-charcoal text-sm">{{ review.authorName }}</p>
    <p class="text-xs mt-0.5 capitalize" style="color: rgba(44, 44, 44, 0.45)">
      {{ month }}
    </p>
  </div>
</div>
