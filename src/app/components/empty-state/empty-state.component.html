<div class="text-center" [class]="compact ? 'py-16' : 'py-24'" style="color: rgba(44, 44, 44, 0.35)">
  <p class="mb-2" [class.text-lg]="!compact">{{ message }}</p>
  @if (actionLabel) {
    <button
      type="button"
      class="text-sm font-medium hover:underline"
      style="color: #b2571f"
      (click)="action.emit()"
    >
      {{ actionLabel }}
    </button>
  }
</div>
