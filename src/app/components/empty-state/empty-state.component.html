<div class="py-24 text-center" style="color: rgba(44, 44, 44, 0.35)">
  <p class="text-lg mb-2">{{ message }}</p>
  @if (actionLabel) {
    <button
      type="button"
      class="text-sm font-medium hover:underline"
      style="color: #b2571f"
      (click)="action.emit()"
    >
      {{ actionLabel }}
    </button>
  }
</div>
