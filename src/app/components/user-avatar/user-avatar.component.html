<!-- Círculo crema con borde y sombra; el tamaño depende de las clases calculadas en el componente. -->
<div class="relative z-10 rounded-full flex items-center justify-center font-serif font-semibold" [class]="sizeClasses"
  style="
    background-color: #f5f2eb;
    color: #556141;
    border: 4px solid #f5f2eb;
    box-shadow: 0 8px 28px rgba(44, 44, 44, 0.18);
  ">
  <!-- Muestra las iniciales del usuario en lugar de una imagen de perfil. -->
  {{ initials }}
</div>
