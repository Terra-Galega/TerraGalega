<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <title>Terra Galega</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">

  <!-- Aplica el tema guardado ANTES de que se pinte la página (evita el destello claro).
       La clave coincide con THEME_KEY de theme.service.ts. -->
  <script>
    try {
      var root = document.documentElement;
      if (localStorage.getItem('terragalega_theme') === 'dark') {
        root.setAttribute('data-theme', 'dark');
        root.style.colorScheme = 'dark';
      }
      var palette = localStorage.getItem('terragalega_palette');
      if (palette === 'protanopia' || palette === 'deuteranopia') {
        palette = 'red-green';
      }
      if (palette === 'red-green' || palette === 'blue-yellow') {
        root.setAttribute('data-palette', palette);
      }
      if (localStorage.getItem('terragalega_contrast') === 'high') {
        root.setAttribute('data-contrast', 'high');
      }
    } catch (e) { }
  </script>
  <link rel="icon" type="image/svg+xml" href="/images/logo-cropped.svg">

  <!-- Fuentes: conexión anticipada y descarga sin bloquear el pintado de la página -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Source+Sans+3:wght@300;400;500;600&family=Droid+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Pinyon+Script&display=swap">
</head>

<body>
  <app-root></app-root>
</body>

</html>
